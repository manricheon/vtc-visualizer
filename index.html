<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VTC Visualizer</title>
<link rel="icon" href="data:,">
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
<style>
  /* ===== chart chrome & ink tokens (dataviz reference palette, light) ===== */
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --page: #f9f9f7;
    --ink-1: #0b0b0b;
    --ink-2: #52514e;
    --ink-muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --accent: #2a78d6;
    --danger: #d03b3b;
    --hover: #eef4fd;
    --font: system-ui, -apple-system, "Segoe UI", sans-serif;
    /* 타이포 4단계 — 예전엔 12/12.5/13/15px가 섞여 있었다 */
    --fs-xs: 11px; --fs-sm: 12.5px; --fs-md: 14px; --fs-lg: 20px;
    /* 간격은 4px 배수로만 */
    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px;
    /* 컨트롤 규격 통일 */
    --ctl-h: 30px; --radius: 6px; --radius-lg: 10px;
    --shadow-1: 0 1px 2px rgba(11,11,11,.05), 0 1px 1px rgba(11,11,11,.03);
  }
  /* 다크 테마 토큰 — 단순 반전이 아니라 다크 서피스에 맞춘 값. OS 선호를 기본으로, 토글이 양방향 오버라이드 */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-1: #202226; --page: #16171a; --ink-1: #ececed; --ink-2: #b7b8bb; --ink-muted: #8a8b8f;
      --grid: #34363b; --axis: #4a4c52; --border: rgba(255,255,255,0.13); --accent: #5a9ef0; --danger: #f2635f; --hover: #223247;
    }
  }
  :root[data-theme="dark"], :root:not([data-theme]) { }
  @media (prefers-color-scheme: dark) { :root:not([data-theme]) { --shadow-1: 0 1px 2px rgba(0,0,0,.45); } }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #202226; --page: #16171a; --ink-1: #ececed; --ink-2: #b7b8bb; --ink-muted: #8a8b8f;
    --grid: #34363b; --axis: #4a4c52; --border: rgba(255,255,255,0.13); --accent: #5a9ef0; --danger: #f2635f; --hover: #223247;
  }
  * { box-sizing: border-box; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  body {
    margin: 0; background: var(--page); color: var(--ink-1);
    font-family: var(--font); font-size: 14px; line-height: 1.5;
  }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 16px 20px 60px; }
  :root[data-width="wide"] .wrap { max-width: 1660px; }
  :root[data-width="full"] .wrap { max-width: none; }

  header.app {
    display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap;
    padding: var(--sp-3) 0 var(--sp-4);
  }
  header.app h1 { font-size: var(--fs-lg); margin: 0; font-weight: 650; letter-spacing: -.01em; }
  header.app .sub { color: var(--ink-muted); font-size: var(--fs-sm); margin-right: auto; }
  /* 버튼 9개를 한 줄에 나열하던 것을 역할별로 묶는다: 주 동작 · 내보내기 · 보기 */
  header.app .actions { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; }
  header.app .grp { display: flex; align-items: center; gap: var(--sp-1); }
  header.app .grp + .grp { padding-left: var(--sp-3); border-left: 1px solid var(--grid); }
  header.app .grp.view select { max-width: 118px; }

  button, select, input[type="text"], input[type="number"], input[type="search"], textarea {
    font-family: var(--font); font-size: var(--fs-md); color: var(--ink-1);
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 0 var(--sp-2); height: var(--ctl-h);
    line-height: calc(var(--ctl-h) - 2px);
  }
  textarea { height: auto; line-height: 1.5; padding: var(--sp-1) var(--sp-2); }
  select { padding-right: var(--sp-1); }
  button { cursor: pointer; }
  button:hover { border-color: var(--ink-muted); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.primary:hover { filter: brightness(0.94); }
  button.ghost { background: transparent; }
  button.danger { color: var(--danger); }
  button.small { font-size: var(--fs-sm); height: 26px; line-height: 24px; padding: 0 var(--sp-2); }
  input[type="color"] { width: 30px; height: 24px; padding: 1px; border: 1px solid var(--border); border-radius: 5px; background: var(--surface-1); cursor: pointer; }
  label.inline { display: inline-flex; align-items: center; gap: 5px; color: var(--ink-2); }

  section.card {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: var(--sp-4); margin-bottom: var(--sp-4);
    box-shadow: var(--shadow-1);
  }
  section.card h2 {
    font-size: var(--fs-xs); margin: 0 0 var(--sp-3); color: var(--ink-muted); font-weight: 600;
    text-transform: uppercase; letter-spacing: .09em;
  }

  /* ===== data input ===== */
  #dropzone {
    border: 1.5px dashed var(--axis); border-radius: var(--radius-lg);
    padding: var(--sp-5) var(--sp-4); text-align: center; color: var(--ink-muted);
    font-size: var(--fs-md);
    transition: background .15s, border-color .15s, padding .15s;
  }
  #dropzone.empty { padding: var(--sp-6) var(--sp-4); background: var(--page); }
  /* 데이터가 들어온 뒤에는 한 줄로 물러난다 — 자리를 차지할 이유가 없다 */
  #dropzone:not(.empty) { display: flex; align-items: center; justify-content: center; gap: var(--sp-3); flex-wrap: wrap; padding: var(--sp-2) var(--sp-3); font-size: var(--fs-sm); }
  #dropzone:not(.empty) .btns { margin-top: 0; }
  #dropzone.empty .btns { margin-top: var(--sp-4); }
  #dropzone .empty-hint { display: none; font-size: var(--fs-sm); margin-top: var(--sp-2); }
  #dropzone.empty .empty-hint { display: block; }
  #btnExample { font-weight: 600; }
  #dropzone.drag { background: var(--hover); border-color: var(--accent); color: var(--accent); }
  #dropzone .btns { margin-top: var(--sp-3); display: flex; gap: var(--sp-2); justify-content: center; flex-wrap: wrap; }
  #datasetChips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--hover); border: 1px solid var(--border); border-radius: 999px;
    padding: 2px 6px 2px 10px; font-size: 12px;
  }
  .chip .n { color: var(--ink-muted); }
  .chip button { border: none; background: none; padding: 0 4px; color: var(--ink-muted); font-size: 13px; }
  .chip button:hover { color: var(--danger); }

  /* ===== chart cards ===== */
  #charts { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
  .chart-card { padding: 0; overflow: hidden; margin-bottom: 0; flex: 1 1 100%; }
  .chart-card.half { flex-basis: calc(50% - 8px); }
  @media (max-width: 860px) { .chart-card.half { flex-basis: 100%; } }
  .chart-card .head {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    border-bottom: 1px solid var(--border); background: var(--surface-1);
    flex-wrap: wrap;   /* 절반 폭에서 버튼이 "설"·"프리"처럼 잘리던 것 — 줄이는 대신 접는다 */
  }
  .chart-card .head button { flex: none; }
  .chart-card .head .name { font-weight: 600; margin-right: auto; font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chart-card .body { display: flex; align-items: stretch; }
  .chart-card .cfg {
    width: 292px; flex: none; border-right: 1px solid var(--border);
    padding: 10px 12px; overflow-y: auto; max-height: 640px; font-size: 13px;
  }
  .chart-card .cfg.hidden { display: none; }
  .cfg-search { width: 100%; margin: 0 0 8px; font-size: 12.5px; }
  .chart-card .plot { flex: 1; min-width: 0; min-height: 460px; }
  .chart-card .plot-caption { padding: 8px 14px 2px; font-size: 12.5px; line-height: 1.55; color: var(--ink-2); white-space: pre-wrap; }
  .chart-card .plot-hint { padding: 5px 12px; font-size: 11px; color: var(--ink-muted); border-top: 1px solid var(--grid); }
  details.grp { margin-bottom: var(--sp-2); border-bottom: 1px solid var(--grid); padding-bottom: var(--sp-2); }
  details.grp summary { cursor: pointer; font-weight: 600; color: var(--ink-2); font-size: var(--fs-sm); padding: var(--sp-1) 0; user-select: none; letter-spacing: .01em; }
  .row { display: flex; align-items: center; gap: var(--sp-2); margin: var(--sp-2) 0; flex-wrap: wrap; }
  .row > span.lbl { width: 78px; flex: none; color: var(--ink-muted); font-size: var(--fs-sm); }
  .row select, .row input[type="text"] { flex: 1; min-width: 60px; }
  .row input[type="number"] { width: 74px; }
  .hint { color: var(--ink-muted); font-size: var(--fs-xs); line-height: 1.55; margin: var(--sp-1) 0; }
  /* 컨트롤 4개를 좁은 패널에 밀어 넣으면 어디를 골라야 할지 알 수 없다 — 좁으면 줄로 접히게 둔다 */
  .filter-block { border-left: 2px solid var(--grid); padding-left: var(--sp-2); margin: var(--sp-2) 0; }
  .filter-row { display: flex; gap: 4px; margin: 4px 0; align-items: center; flex-wrap: wrap; }
  .filter-row select { flex: 1 1 96px; min-width: 96px; }
  .filter-row .op { flex: 0 1 auto; min-width: 74px; width: auto; }
  .filter-row input { flex: 1 1 96px; min-width: 80px; }
  .filter-row button.small { flex: none; }
  .filter-rule { font-size: var(--fs-xs); color: var(--ink-muted); margin: 2px 0 0 2px; line-height: 1.5; }
  .filter-rule b { color: var(--ink-2); font-weight: 600; }
  .filter-vals { display: flex; flex-wrap: wrap; gap: 2px 12px; margin: 2px 0 8px 6px; }
  .filter-vals label.inline { font-size: 12px; gap: 4px; }
  .series-row { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
  .series-row .sname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
  .series-row .slabel { flex: 1; min-width: 0; font-size: 12px; }
  .series-row select { width: 92px; flex: none; }
  .series-row input[type="number"] { width: 52px; }
  .series-block { margin: 6px 0; padding-bottom: 4px; border-bottom: 1px dashed var(--grid); }
  .series-block:last-child { border-bottom: none; }
  .series-row.sub { margin: 2px 0 0 10px; }
  .series-row.sub select { flex: 1; width: auto; min-width: 0; }
  .series-row.sub input[type="number"] { width: 46px; flex: none; }
  /* 텍스트 마커 목록: 고정 메모 표시 / 기준을 잃어 숨겨진 마커 */
  .tm-badge { flex: none; font-size: var(--fs-xs); color: var(--muted); border: 1px solid var(--grid); border-radius: var(--radius); padding: 1px 6px; white-space: nowrap; }
  .tm-badge.warn { color: var(--danger); border-color: var(--danger); }
  .series-row.tm-stale { flex-wrap: wrap; }   /* 사유 + 다시 지정이 좁은 패널에서 잘리지 않도록 */
  .series-row.tm-stale input[type="text"] { color: var(--muted); font-style: italic; min-width: 120px; }

  /* ===== data table ===== */
  #tableCtrl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  #tableCtrl input[type="search"] { width: 240px; }
  #tableCtrl .count { color: var(--ink-muted); font-size: 12px; }
  #tableWrap { overflow: auto; max-height: 480px; border: 1px solid var(--grid); border-radius: 8px; }
  table.data { border-collapse: collapse; width: 100%; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  table.data th, table.data td { padding: 5px 10px; border-bottom: 1px solid var(--grid); text-align: left; white-space: nowrap; }
  table.data th.num, table.data td.num { text-align: right; }   /* 숫자는 자릿수를 맞춰 읽는다 */
  table.data th {
    position: sticky; top: 0; background: var(--surface-1); cursor: pointer;
    color: var(--ink-2); font-weight: 600; user-select: none; border-bottom: 1px solid var(--axis);
  }
  table.data th:hover { color: var(--accent); }
  table.data tr:hover td { background: var(--hover); }
  #pager { display: flex; gap: 8px; align-items: center; margin-top: 8px; color: var(--ink-muted); font-size: 12px; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  #dropzone.empty { border-color: var(--accent); }

  /* ===== analysis panel ===== */
  #anCtrl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  #anCtrl .count { color: var(--ink-muted); font-size: 12px; }
  #anTableWrap { overflow: auto; max-height: 360px; border: 1px solid var(--grid); border-radius: 8px; }
  #anTableWrap table.data th { cursor: default; }
  #anTableWrap table.data th:hover { color: var(--ink-2); }
  .ins-row { display: flex; gap: 8px; align-items: baseline; padding: 7px 0 7px 12px; border-bottom: 1px solid var(--grid); }
  .ins-tier { display: flex; gap: 8px; align-items: baseline; margin: 12px 0 2px; font-size: 11.5px; color: var(--ink-muted); }
  .ins-tier:first-of-type { margin-top: 4px; }
  .ins-spec { font-size: 11px; color: var(--ink-muted); font-variant-numeric: tabular-nums; margin-top: 3px; }
  .ins-row:last-of-type { border-bottom: none; }
  .ins-row .ins-text { flex: 1; font-size: 12.5px; line-height: 1.5; }
  .ins-badge { flex: none; font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--hover); color: var(--ink-2); }
  .ins-badge.t0 { border: 1px solid var(--axis); }
  .ins-badge.t1 { border: 1px solid var(--danger); color: var(--danger); }

  /* ===== modal ===== */
  #modalBack {
    display: none; position: fixed; inset: 0; background: rgba(11,11,11,0.35); z-index: 50;
    align-items: center; justify-content: center;
  }
  #modalBack.show { display: flex; }
  #pasteModal {
    background: var(--surface-1); border-radius: 10px; padding: 18px; width: min(680px, 92vw);
    display: flex; flex-direction: column; gap: 10px;
  }
  #pasteModal textarea { width: 100%; height: 240px; font-family: ui-monospace, monospace; font-size: 12px; resize: vertical; }

  /* ===== point-click popover ===== */
  #ptPopover {
    display: none; position: fixed; z-index: 60; min-width: 180px;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 4px 16px rgba(11,11,11,0.14); padding: 6px;
  }
  #ptPopover.show { display: flex; flex-direction: column; gap: 4px; }
  #ptPopover .pp-title { font-size: 11.5px; color: var(--ink-muted); padding: 2px 4px; font-variant-numeric: tabular-nums; }
  #ptPopover .pp-note { font-size: 10.5px; color: var(--ink-muted); padding: 2px 4px 0; border-top: 1px solid var(--grid); }
  #ptPopover button { text-align: left; border: none; padding: 6px 8px; border-radius: 6px; }
  #ptPopover button:hover { background: var(--hover); }
  #ptPopover .pp-row { display: flex; gap: 4px; }
  #ptPopover .pp-row button { flex: 1; text-align: center; border: 1px solid var(--border); }
  #ptPopover input[type="text"] { width: 100%; }
  /* 컬럼 목록: 많을 수 있으므로 자체 스크롤 */
  #ptPopover .pp-list { max-height: 320px; overflow-y: auto; display: flex; flex-direction: column; gap: 1px; }
  #ptPopover .pp-check { display: flex; align-items: baseline; gap: var(--sp-2); padding: 3px 4px; border-radius: var(--radius); cursor: pointer; }
  #ptPopover .pp-check:hover { background: var(--hover); }
  #ptPopover .pp-check .cname { flex: 1; font-size: var(--fs-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #ptPopover .pp-check .cuse { flex: 0 1 auto; font-size: var(--fs-xs); color: var(--ink-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 45%; }
  #ptPopover .pp-check.off .cname { color: var(--ink-muted); text-decoration: line-through; }
  #btnCols.on { border-color: var(--accent); color: var(--accent); }

  /* ===== data table: include/exclude ===== */
  table.data th.chk, table.data td.chk { width: 30px; text-align: center; padding: 5px 6px; cursor: default; }
  table.data tr.excl td:not(.chk) { opacity: 0.4; }
  table.data tr.muted td:not(.chk) { opacity: 0.55; font-style: italic; }

  /* ===== toast ===== */
  #toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(10px);
    background: var(--ink-1); color: var(--surface-1); border-radius: 8px; padding: 9px 14px;
    display: flex; gap: 12px; align-items: center; font-size: 13px;
    opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; z-index: 70;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  #toast button { background: none; border: none; color: #8db9ee; font-weight: 600; padding: 0; }
  #toast button:hover { text-decoration: underline; }

  footer { color: var(--ink-muted); font-size: 12px; text-align: center; margin-top: 24px; }
  h1 .ver { font-size: 12px; font-weight: 600; color: var(--ink-muted); vertical-align: 6px;
            border: 1px solid var(--border); border-radius: 10px; padding: 1px 7px; margin-left: 2px; }
  #emptyCharts { color: var(--ink-muted); text-align: center; padding: 30px 0; }
  @media (max-width: 860px) {
    .chart-card .body { flex-direction: column; }
    .chart-card .cfg { width: 100%; border-right: none; border-bottom: 1px solid var(--border); max-height: 320px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="app">
    <h1>VTC Visualizer <span id="appVersion" class="ver"></span></h1>
    <span class="sub" data-i18n="header.sub"></span>
    <nav class="actions">
      <span class="grp">
        <button id="btnAddChart" class="primary" data-i18n="btn.addChart"></button>
        <button id="btnAnalyze" data-i18n="btn.analyze"></button>
      </span>
      <span class="grp">
        <button id="btnExportMenu" data-i18n="btn.exportMenu"></button>
      </span>
      <span class="grp view">
        <select id="selPalette" class="ghost" title=""></select>
        <button id="btnWidth" class="ghost" title=""></button>
        <button id="btnTheme" class="ghost" title=""></button>
        <button id="btnLangToggle" class="ghost"></button>
        <button id="btnReset" class="danger ghost" data-i18n="btn.reset"></button>
      </span>
    </nav>
  </header>

  <section class="card">
    <h2 data-i18n="section.dataInput"></h2>
    <div id="dropzone">
      <span data-i18n="dropzone.text"></span>
      <div class="empty-hint" data-i18n="dropzone.emptyHint"></div>
      <div class="btns">
        <button id="btnOpenFiles" data-i18n="btn.openFiles"></button>
        <button id="btnOpenFolder" data-i18n="btn.openFolder"></button>
        <button id="btnPaste" data-i18n="btn.paste"></button>
        <button id="btnExample" class="ghost" data-i18n="btn.example"></button>
      </div>
    </div>
    <div id="datasetChips"></div>
    <details id="derivedPanel" class="grp" hidden></details>
    <input type="file" id="fileInput" accept=".csv,.json,.tsv" multiple hidden>
    <input type="file" id="folderInput" webkitdirectory multiple hidden>
  </section>

  <section class="card" id="analysisCard" hidden>
    <h2 data-i18n="an.title"></h2>
    <div id="anCtrl"></div>
    <div id="anBody"></div>
  </section>

  <div id="charts"></div>
  <div id="emptyCharts" data-i18n="emptyCharts.text"></div>

  <section class="card">
    <h2 data-i18n="section.rawData"></h2>
    <div id="tableCtrl">
      <input type="search" id="tableSearch" data-i18n-ph="table.searchPh">
      <span class="count" id="tableCount"></span>
      <button class="small" id="btnCols"></button>
      <button class="small" id="restoreExcl" hidden data-i18n="table.restoreExcl"></button>
      <button class="small" id="restoreMuted" hidden data-i18n="table.restoreMuted"></button>
      <button class="small" id="btnExportCsv" data-i18n="btn.exportCsv"></button>
    </div>
    <div id="tableWrap"><table class="data" id="dataTable"></table></div>
    <div id="pager">
      <button class="small" id="pgPrev" data-i18n="pager.prev"></button>
      <span id="pgInfo"></span>
      <button class="small" id="pgNext" data-i18n="pager.next"></button>
    </div>
  </section>

  <footer>VTC Visualizer <span class="footer-ver"></span> — <span data-i18n="footer.text"></span> © mrc</footer>
</div>

<div id="modalBack">
  <div id="pasteModal">
    <strong data-i18n="modal.title"></strong>
    <div class="row"><span class="lbl" data-i18n="modal.datasetName"></span><input type="text" id="pasteName" data-i18n-ph="modal.datasetNamePh"></div>

const state = {

  charts: [],     // [chartConfig]
  derived: [],    // 계산 컬럼 정의 [{name, kind, ...}] — 입력 파일이 아니라 뷰 계층(세션 상태)

/* 계산 컬럼: 정의대로 각 행에 파생 값을 주입 (기존 파생값은 먼저 제거해 재계산) */
function roundv(x) { return typeof x === 'number' ? Math.round(x * 1e6) / 1e6 : x; }
let derivedApplied = [];   // 직전에 주입한 파생 컬럼명 — 삭제·변경 시 잔여 컬럼까지 제거
function applyDerived() {
  const toClear = new Set([...derivedApplied, ...state.derived.map(d => d.name)]);
  for (const d of state.datasets) for (const r of d.rows) for (const n of toClear) delete r[n];
  const rows = state.datasets.flatMap(d => d.rows);
  for (const def of state.derived) {
    if (def.kind === 'binary') {
      const op = def.op;
      const constB = def.bConst !== undefined && def.bConst !== '' ? Number(def.bConst) : null;   // 단위 환산용 상수
      for (const r of rows) {
        const a = r[def.a], b = constB !== null ? constB : r[def.b];
        r[def.name] = (typeof a === 'number' && typeof b === 'number')
          ? roundv(op === '-' ? a - b : op === '+' ? a + b : op === '*' ? a * b : op === '/' ? (b ? a / b : null) : op === 'ratio' ? (b ? a / b * 100 : null) : null)
          : null;
      }
    } else if (def.kind === 'concat') {
      /* 계산이 아니라 **라벨 만들기** — 여러 컬럼 값을 규칙대로 이어 붙여 문자열 컬럼을 만든다.
         결과는 문자열이라 그룹·분할·필터·막대 X축으로 바로 쓰인다. */
      const parts = def.parts || [];
      const sep = def.sep === undefined ? ' · ' : def.sep;
      for (const r of rows) {
        const seg = [];
        for (const pt of parts) {
          const v = r[pt.col];
          if (v === null || v === undefined || v === '') continue;   // 값이 없는 조각은 건너뛴다(구분자만 남지 않게)
          seg.push((pt.pre || '') + String(v) + (pt.post || ''));
        }
        r[def.name] = seg.length ? seg.join(sep) : null;
      }
    } else if (def.kind === 'norm' || def.kind === 'rank' || def.kind === 'groupagg' || def.kind === 'bin') {
      /* 그룹(선택) 안에서 계산 — by가 비면 전체가 하나의 그룹 */
      const buckets = new Map();
      for (const r of rows) {
        const k = def.by ? String(r[def.by]) : '__all';
        if (!buckets.has(k)) buckets.set(k, []);
        buckets.get(k).push(r);
      }
      for (const rs of buckets.values()) {
        const vals = rs.map(r => r[def.col]).filter(v => typeof v === 'number');
        if (!vals.length) { rs.forEach(r => { r[def.name] = null; }); continue; }
        const mn = Math.min(...vals), mx = Math.max(...vals);
        const mean = vals.reduce((a, b) => a + b, 0) / vals.length;
        const sd = vals.length > 1 ? Math.sqrt(vals.reduce((a, b) => a + (b - mean) * (b - mean), 0) / (vals.length - 1)) : 0;

            const v = r[def.col];
            r[def.name] = typeof v !== 'number' ? null : roundv(
              def.mode === 'z' ? (sd ? (v - mean) / sd : null)
              : def.mode === 'max' ? (mx ? v / mx * 100 : null)
              : (mx > mn ? (v - mn) / (mx - mn) : null));

        } else if (def.kind === 'rank') {
          const sorted = rs.filter(r => typeof r[def.col] === 'number')
            .sort((a, b) => def.desc ? b[def.col] - a[def.col] : a[def.col] - b[def.col]);
          sorted.forEach((r, i) => { r[def.name] = i + 1; });
          for (const r of rs) if (typeof r[def.col] !== 'number') r[def.name] = null;
        } else if (def.kind === 'groupagg') {
          const agg = def.agg === 'sum' ? sum : def.agg === 'min' ? mn : def.agg === 'max' ? mx

          for (const r of rs) r[def.name] = roundv(agg);
        } else {   // bin — 동일 폭 구간, 라벨은 경계값 (문자열이라 그룹·필터로 쓸 수 있다)
          const n = Math.max(2, Math.min(20, Number(def.bins) || 4));
          const w = (mx - mn) / n;
          for (const r of rs) {
            const v = r[def.col];
            if (typeof v !== 'number') { r[def.name] = null; continue; }
            const idx = w > 0 ? Math.min(n - 1, Math.floor((v - mn) / w)) : 0;
            r[def.name] = `${roundv(mn + idx * w)}~${roundv(mn + (idx + 1) * w)}`;
          }
        }
      }
    } else if (def.kind === 'refdelta') {
      const ref = new Map();
      const key = r => (def.keys || []).map(k => String(r[k])).join('|');
      for (const r of rows) if (String(r[def.refCol]) === String(def.refVal)) ref.set(key(r), r);
      for (const r of rows) {
        const base = ref.get(key(r)), v = r[def.valueCol], bv = base ? base[def.valueCol] : null;
        r[def.name] = (typeof v === 'number' && typeof bv === 'number')
          ? roundv(def.mode === 'retention' ? (bv ? v / bv * 100 : null) : v - bv) : null;
      }
    }
  }
  derivedApplied = state.derived.map(d => d.name);
  invalidateDataCaches();   // 파생 컬럼이 컬럼 목록·숫자 판정을 바꾼다
}

/* ================= parsing ================= */
function parseCSV(text) {
  const rows = [];
  let field = '', row = [], inQ = false;
  const pushF = () => { row.push(field); field = ''; };
  const pushR = () => { if (row.length > 1 || row[0] !== '') rows.push(row); row = []; };
  const sep = text.split('\n', 1)[0].includes('\t') ? '\t' : ',';
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQ = false; }
      else field += c;
    } else if (c === '"') inQ = true;
    else if (c === sep) pushF();
    else if (c === '\n') { pushF(); pushR(); }
    else if (c !== '\r') field += c;
  }
  if (field !== '' || row.length) { pushF(); pushR(); }
  if (rows.length < 2) throw new Error(t('err.csvHeaderRows'));
  const header = rows[0].map(h => h.trim());
  return rows.slice(1).map(r => {
    const o = {};
    header.forEach((h, i) => { o[h] = coerce(r[i]); });
    return o;
  });
}
function coerce(v) {
  if (v === undefined || v === null) return null;
  const s = String(v).trim();
  if (s === '') return null;
  const n = Number(s.replace(/,/g, ''));
  return Number.isFinite(n) && /^[\s]*[-+]?[\d.,eE+-]+[\s]*$/.test(s) ? n : s;
}
function parseAny(text, filename) {
  const s = text.trim();   // 주의: 이름을 t로 지으면 i18n t()를 가림 (실제 있었던 버그)
  if (s.startsWith('[') || s.startsWith('{') || /\.json$/i.test(filename || '')) {
    let j = JSON.parse(s);
    // 세션 파일을 데이터로 오인하지 않기 — "세션 가져오기"로 안내
    if (j && !Array.isArray(j) && Array.isArray(j.datasets) && Array.isArray(j.charts)) {
      throw new Error(t('err.sessionAsData'));
    }
    if (!Array.isArray(j)) {
      const arr = Object.values(j).find(v => Array.isArray(v));
      if (arr) j = arr; else throw new Error(t('err.jsonArray'));
    }
    return j.map(o => {
      const r = {};
      for (const k of Object.keys(o)) {
        const v = o[k];
        r[k] = (v !== null && typeof v === 'object') ? JSON.stringify(v) : (typeof v === 'string' ? coerce(v) : v);
      }
      return r;
    });
  }
  return parseCSV(text);
}

/* ================= data model ================= */
let sourceWarned = false;
/* 같은 파일을 다시 넣으면 행 배열이 통째로 교체돼 손으로 한 큐레이션(_excluded/_muted)과
   레이블 위치가 전부 사라졌다. "구조를 나타내는 컬럼"(문자열 + 값이 몇 개뿐인 숫자)의 조합을
   행의 정체성으로 보고, 같은 정체성의 행에 되붙인다. 값이 갱신돼도 조건이 같으면 살아남는다. */
let rowKeyColsCache = null;
function rowKeyCols() {
  if (rowKeyColsCache && rowKeyColsCache.ver === dataVer) return rowKeyColsCache.cols;
  const rows = allRows(), out = [];
  for (const c of columns()) {
    if (c === '_source') { out.push(c); continue; }
    const vals = new Set();
    let numeric = 0, seen = 0;
    for (const r of rows) {
      const v = r[c];
      if (v === null || v === undefined) continue;
      seen++;
      if (typeof v === 'number') numeric++;
      if (vals.size <= 40) vals.add(v);
    }
    if (!seen) continue;
    const isText = numeric / seen < 0.5;
    /* 숫자는 "값이 몇 개뿐"일 때만 조건으로 본다 — 행 수 대비로 판단해야 한다.
       측정값(행마다 다른 값)이 키에 들어가면 갱신 때 전부 어긋난다. */
    const fewLevels = vals.size <= Math.max(2, Math.min(24, Math.floor(rows.length / 3)));
    if (isText || fewLevels) out.push(c);
  }
  rowKeyColsCache = { ver: dataVer, cols: out };
  return out;
}
function rowKey(r, cols) { return (cols || rowKeyCols()).map(c => String(r[c])).join('\u0001'); }
function addDataset(name, rows) {
  if (!rows.length) { alert(tf('err.noRowsInDataset', { name })); return; }
  if (!sourceWarned && rows.some(r => r._source !== undefined)) {   // _source는 예약어 — 덮어쓰되 침묵하지는 않는다
    sourceWarned = true;
    showToast(t('toast.sourceOverwritten'));
  }
  rows.forEach(r => { r._source = name; });
  const existing = state.datasets.find(d => d.name === name);
  if (existing) {
    const cols = rowKeyCols();
    const marks = new Map();   // 갱신 전에 손으로 표시한 것을 행 정체성으로 기억해 둔다
    for (const r of existing.rows) {
      if (r._excluded || r._muted) marks.set(rowKey(r, cols), { ex: !!r._excluded, mu: !!r._muted });
    }
    existing.rows = rows;
    if (marks.size) {
      let back = 0;
      for (const r of rows) {
        const m = marks.get(rowKey(r, cols));
        if (!m) continue;
        if (m.ex) r._excluded = true;
        if (m.mu) r._muted = true;
        back++;
      }
      if (back) setTimeout(() => showToast(tf('toast.marksKept', { n: back })), 60);
    }
  }
  else state.datasets.push({ id: state.nextId++, name, rows });
  invalidateDataCaches();
  onDataChanged();
}
function askRemoveDataset(id) {   // 확인은 사용자가 누르는 자리에서만 — 모델 함수는 그대로 쓸 수 있어야 한다
  const ds = state.datasets.find(d => d.id === id);
  if (!ds) return;
  if (!confirm(tf('confirm.removeDataset', { name: ds.name, rows: ds.rows.length.toLocaleString(), charts: state.charts.length }))) return;
  removeDataset(id);
}
function removeDataset(id) {
  const i = state.datasets.findIndex(d => d.id === id);
  if (i < 0) return;
  const ds = state.datasets[i];
  state.datasets.splice(i, 1);
  invalidateDataCaches();
  onDataChanged();
  showToast(tf('toast.datasetRemoved', { name: ds.name }), t('toast.undo'), () => {
    state.datasets.splice(Math.min(i, state.datasets.length), 0, ds);
    invalidateDataCaches();
    onDataChanged(false);
  });
  return;
}
let dataVer = 0, allRowsCache = null, colCache = null, numColCache = null;
const uniqCache = new Map();
function invalidateDataCaches() { dataVer++; allRowsCache = null; colCache = null; numColCache = null; uniqCache.clear(); sizeRangeCache = null; }

  if (allRowsCache) return allRowsCache;
  allRowsCache = state.datasets.flatMap(d => d.rows);
  return allRowsCache;
}
function columns() {
  if (colCache) return colCache;
  const set = new Set();
  for (const d of state.datasets) for (const r of d.rows) for (const k of Object.keys(r)) {
    if (k.startsWith('_') && k !== '_source') continue;   // 내부 키(_excluded 등) 숨김
    set.add(k);
  }
  colCache = [...set];
  return colCache;
}
/* _source는 데이터셋이 2개 이상일 때만 노출 (1개면 헷갈리기만 함).
   여기가 "화면에 보이는 컬럼"의 단일 관문이다 — 표·축/그룹 드롭다운·필터·자동 분석·계산 컬럼 입력·CSV 내보내기가 모두 이걸 쓴다.
   반대로 `rowKeyCols()`는 `columns()`를 써야 한다: 숨김이 행 정체성을 흔들면 제외·흐리게·마커 앵커가 전부 어긋난다. */
function visibleColumns() {
  const cols = columns();
  const shown = state.datasets.length > 1 ? cols : cols.filter(c => c !== '_source');
  return state.hiddenCols.length ? shown.filter(c => !state.hiddenCols.includes(c)) : shown;
}
function numericColumnsAll() {
  if (numColCache) return numColCache;
  const cols = columns(), rows = allRows(), out = [];
  for (const c of cols) {
    let any = false, ok = true;
    for (const r of rows) {
      const v = r[c];
      if (v === null || v === undefined) continue;
      any = true;
      if (typeof v !== 'number') { ok = false; break; }
    }

   숨김은 hiddenCols가 바뀔 때마다 달라지므로 캐시하지 않고 매번 거른다(컬럼 수만큼이라 비용이 없다).
   그리는 코드는 All 쪽을 써야 한다 — 숨겼다고 이미 그린 차트의 연속 색상이 꺼지면 안 된다. */

function uniqueVals(col) {
  if (uniqCache.has(col)) return uniqCache.get(col);

  for (const r of allRows()) { const v = r[col]; if (v !== null && v !== undefined) s.add(v); }

/* 단일 필터 매칭 — 컬럼 미선택·값 미입력은 통과(true)로 취급 */
function matchFilter(f, r) {
  if (!f.col) return true;
  if (f.value === '' || f.value === null || f.value === undefined) return true;
  const v = r[f.col];
  if (v === null || v === undefined) return false;
  if (f.op === 'in') {   // 다중 선택: 빈 배열이면 통과(미완성 필터)
    return !Array.isArray(f.value) || f.value.length === 0 || f.value.map(String).includes(String(v));
  }
  const tv = coerce(f.value);
  switch (f.op) {
    case '=': return String(v) === String(tv);
    case '≠': return String(v) !== String(tv);
    case '>': return typeof v === 'number' && v > Number(tv);
    case '<': return typeof v === 'number' && v < Number(tv);
    case '≥': return typeof v === 'number' && v >= Number(tv);
    case '≤': return typeof v === 'number' && v <= Number(tv);
    case '포함': return String(v).includes(String(f.value));

   "조건에 맞는 쪽을 남기고/진하게" 규칙이라 = 와 ≠ 중 어느 쪽이 흐려지는지 헷갈리기 쉽다. */

  const others = (cfg.filters || []).filter(x => x !== f && x.mode !== 'dim');
  const pool = others.length ? base.filter(r => others.every(x => matchFilter(x, r))) : base;

/* 값이 채워진 필터만 실제로 동작한다 — 미완성 필터는 통과(matchFilter도 true를 준다).
   "맞는 것"에 동작하는 모드(excludeIn/dimIn)는 이 판정이 없으면 미완성 필터가 전부를 지워 버린다. */

}

   두 방향을 다 두는 이유: "조건에 맞는 쪽을 남긴다"와 "고른 행에 동작을 적용한다"가
   둘 다 자연스러운 읽기라서, 한쪽만 두면 반대로 이해한 사람이 조용히 틀린 그림을 얻는다. */

  return rows.filter(r => excl.every(f => f.mode === 'excludeIn'
    ? (!filterActive(f) || !matchFilter(f, r))   // 맞는 것을 뺀다

const toastEl = document.createElement('div');

toastEl.id = 'toast';
document.body.append(toastEl);
let toastTimer = null;
function showToast(msg, actionLabel, action) {
  toastEl.innerHTML = '';
  toastEl.append(el('span', {}, msg));
  if (action) toastEl.append(el('button', { onclick: () => { action(); toastEl.classList.remove('show'); } }, actionLabel));

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function el(tag, attrs = {}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'html') e.innerHTML = v;
    else e.setAttribute(k, v);
  }
  for (const c of children) e.append(c);
  return e;
}
function select(options, value, onchange, attrs = {}) {
  const s = el('select', { ...attrs, onchange: e => onchange(e.target.value) });
  for (const o of options) {
    const [val, label] = Array.isArray(o) ? o : [o, o];
    const opt = el('option', { value: val }, label);
    if (String(val) === String(value)) opt.selected = true;
    s.append(opt);
  }
  return s;
}
function colSelect(cfg, key, opts) {
  const { allowEmpty = true, emptyLabel = t('opt.noneParen'), onChange } = opts || {};
  const cols = chartColumns(cfg);

function cfgSearchBox(panel) {
  const inp = el('input', { type: 'search', class: 'cfg-search', 'data-i18n-ph': 'cfg.searchPh', placeholder: t('cfg.searchPh') });
  inp.addEventListener('input', () => {
    const q = inp.value.trim().toLowerCase();
    panel.querySelectorAll('details.grp').forEach(g => {
      if (!q) {
        g.hidden = false;
        g.querySelectorAll('.row').forEach(r => { r.hidden = false; });
        if (g._preSearchOpen !== undefined) { g.open = g._preSearchOpen; delete g._preSearchOpen; }
        return;
      }
      if (g._preSearchOpen === undefined) g._preSearchOpen = g.open;
      let hit = 0;
      g.querySelectorAll('.row').forEach(r => {
        const lbl = r.querySelector('.lbl');
        const match = (lbl ? lbl.textContent : r.textContent).toLowerCase().includes(q);
        r.hidden = !match;
        if (match) hit++;
      });
      const inTitle = g.querySelector('summary').textContent.toLowerCase().includes(q);
      g.hidden = !hit && !inTitle;
      g.open = hit > 0 || inTitle;
      if (inTitle && !hit) g.querySelectorAll('.row').forEach(r => { r.hidden = false; });
    });
  });
  return inp;
}

async function exportImg(cfg, format) {
  const div = plotDivs[cfg.id];
  if (!div || !div.data) { alert(t('err.drawChartFirst')); return; }
  /* WebGL로 그려진 차트를 그대로 SVG로 내보내면 그림이 래스터로 박힌다 — 잠시 SVG로 다시 그린 뒤 되돌린다 */
  const wasGl = format === 'svg' && div.data.some(tr => tr.type === 'scattergl');
  if (wasGl) { cfg._forceSvg = true; renderPlot(cfg); await new Promise(r => setTimeout(r, 250)); }
  await Plotly.downloadImage(div, { format, width: div.clientWidth * 1.0 || 900, height: div.clientHeight || 480, scale: format === 'png' ? 3 : 1, filename: (cfg.title || `chart-${cfg.id}`).replace(/\s+/g, '_') });
  if (wasGl) { delete cfg._forceSvg; renderPlot(cfg); }
}
/* 비어 있는 축을 데이터에 맞게 채운다 — 차트 추가와 데이터셋 전환이 같은 규칙을 쓴다.
   y는 점수형(score/acc/f1), x는 비용형(token/latency/cost) 컬럼 우선. */
function guessAxes(cfg) {
  if (cfg.x && cfg.y) return;
  const nums = chartNumCols(cfg);
  const yGuess = nums.find(c => /score|acc|f1|auc|bleu|rouge|prec|recall/i.test(c));
  const xGuess = nums.find(c => c !== yGuess && /token|budget|latency|time|cost|frame|step|size|param/i.test(c));
  if (!cfg.x) cfg.x = xGuess || nums.find(c => c !== yGuess) || nums[0] || '';
  if (!cfg.y) cfg.y = yGuess || nums.find(c => c !== cfg.x) || '';
  const cats = chartColumns(cfg).filter(c => !nums.includes(c) && c !== '_source');
  if (!cfg.group && cats[0]) cfg.group = cats[0];
}

  const keptFilters = (cfg.filters || []).filter(f => !f.col || ok.includes(f.col));
  if (keptFilters.length !== (cfg.filters || []).length) {
    (cfg.filters || []).forEach(f => { if (f.col && !ok.includes(f.col)) dropped.push(f.col); });
    cfg.filters = keptFilters;

  guessAxes(cfg);

/* ================= data table ================= */
const tableState = { search: '', sortCol: null, sortDir: 1, page: 0, pageSize: 200 };
function renderTable() {
  const cols = visibleColumns();
  const table = document.getElementById('dataTable');
  let rows = allRows();
  const q = tableState.search.trim().toLowerCase();
  if (q) rows = rows.filter(r => cols.some(c => r[c] !== null && r[c] !== undefined && String(r[c]).toLowerCase().includes(q)));
  if (tableState.sortCol) {
    const c = tableState.sortCol, d = tableState.sortDir;
    rows = rows.slice().sort((a, b) => {
      const va = a[c], vb = b[c];
      if (va === null || va === undefined) return 1;
      if (vb === null || vb === undefined) return -1;
      if (typeof va === 'number' && typeof vb === 'number') return d * (va - vb);
      return d * String(va).localeCompare(String(vb));
    });
  }
  const total = rows.length;
  const pages = Math.max(1, Math.ceil(total / tableState.pageSize));
  tableState.page = Math.min(tableState.page, pages - 1);
  const start = tableState.page * tableState.pageSize;
  const view = rows.slice(start, start + tableState.pageSize);
  const allIncluded = rows.every(r => !r._excluded);

  /* 숫자 컬럼은 우측 정렬 — tabular-nums만으로는 자릿수가 맞지 않는다(150 vs 23412.3) */
  const numSet = new Set(numericColumns());
  const nc = c => numSet.has(c) ? ' class="num"' : '';
  let html = `<thead><tr><th class="chk" title="${esc(t('table.allIncludeTitle'))}"><input type="checkbox" id="chkAll"${allIncluded ? ' checked' : ''}></th>` + cols.map(c =>
    `<th data-col="${esc(c)}"${nc(c)}>${esc(c)}${tableState.sortCol === c ? (tableState.sortDir > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('') + '</tr></thead><tbody>';
  view.forEach((r, i) => {
    html += `<tr class="${r._excluded ? 'excl' : ''}${r._muted ? ' muted' : ''}"><td class="chk"><input type="checkbox" data-i="${i}"${r._excluded ? '' : ' checked'}></td>`
      + cols.map(c => `<td${nc(c)}>${r[c] === null || r[c] === undefined ? '<span style="color:var(--axis)">–</span>' : esc(r[c])}</td>`).join('') + '</tr>';
  });
  table.innerHTML = html + '</tbody>';
  const rerenderCharts = () => { for (const c of state.charts) renderPlot(c); };
  table.querySelectorAll('th[data-col]').forEach(th => th.addEventListener('click', () => {
    const c = th.dataset.col;
    if (tableState.sortCol === c) tableState.sortDir *= -1;
    else { tableState.sortCol = c; tableState.sortDir = 1; }
    renderTable();
  }));
  table.querySelectorAll('tbody input[type="checkbox"]').forEach(cb => cb.addEventListener('change', () => {
    const r = view[Number(cb.dataset.i)];

    renderTable(); rerenderCharts(); analysisStale(); save();
  }));
  const chkAll = table.querySelector('#chkAll');
  if (chkAll) chkAll.addEventListener('change', () => {
    rows.forEach(r => { if (chkAll.checked) delete r._excluded; else r._excluded = true; });
    renderTable(); rerenderCharts(); analysisStale(); save();
  });
  const nExcl = allRows().filter(r => r._excluded).length;
  document.getElementById('tableCount').textContent = tf('table.count', {
    total: total.toLocaleString(), cols: cols.length, all: allRows().length.toLocaleString(),
    excl: nExcl ? tf('table.exclSuffix', { n: nExcl }) : '',

  const restoreBtn = document.getElementById('restoreExcl');
  restoreBtn.hidden = nExcl === 0;
  restoreBtn.textContent = tf('table.restoreExcl', { n: nExcl });
  const nMuted = allRows().filter(r => r._muted).length;
  const mutedBtn = document.getElementById('restoreMuted');
  mutedBtn.hidden = nMuted === 0;
  mutedBtn.textContent = tf('table.restoreMuted', { n: nMuted });
  document.getElementById('pgInfo').textContent = tf('pager.info', { page: pages ? tableState.page + 1 : 0, pages });
  const colBtn = document.getElementById('btnCols');
  const nAll = columns().filter(c => c !== '_source' || state.datasets.length > 1).length;
  colBtn.hidden = !state.datasets.length;

}

/* ================= 자동 분석 (탐색용 스크리닝) =================
 * 인사이트는 세션에 저장하지 않는 순수 파생값 — 데이터가 바뀌면 버리고 다시 계산한다.
 * 문장은 {kind, params}로만 보관하고 렌더 시 i18n 템플릿에 넣는다(언어 토글에 자동 대응).

 * 시드=클러스터) 반복 수가 임의적이라 p값을 정당화할 수 없다. 대신 원단위 차이 + 조건별 방향

const AN = {

  minN: 8, rBase: 0.6, multK: 0.03, rDup: 0.995, defCV: 3e-3, rhoGap: 0.30, simpsonGap: 0.30,
  crossMin: 0.8, flipMin: 0.25, dzMin: 0.8, relMin: 0.05,
  missMin: 0.05, biasGap: 0.30, designMaxLv: 12, catMaxLv: 24,   // 모델 20종 비교 같은 실제 사례를 침묵시키지 않도록
  madZ: 3.5, outMax: 3, outMinAmp: 0.05, satFrac: 0.9, bootB: 2000,

let anShowAll = false;

/* ---- 순수 통계 (인자만으로 동작 — 콘솔에서 바로 검증 가능) ---- */
function anMean(a) { return a.length ? a.reduce((s, v) => s + v, 0) / a.length : null; }
function anQuantile(sorted, p) {

  const i = (sorted.length - 1) * p, lo = Math.floor(i), hi = Math.ceil(i);
  return lo === hi ? sorted[lo] : sorted[lo] + (sorted[hi] - sorted[lo]) * (i - lo);
}
function anMedian(a) { return a.length ? anQuantile(a.slice().sort((x, y) => x - y), 0.5) : null; }

  const s = a.slice().sort((x, y) => x - y), mean = anMean(a);
  const sd = n > 1 ? Math.sqrt(a.reduce((p, v) => p + (v - mean) * (v - mean), 0) / (n - 1)) : 0;
  return { n, mean, sd, min: s[0], q1: anQuantile(s, 0.25), med: anQuantile(s, 0.5), q3: anQuantile(s, 0.75), max: s[n - 1] };

function anPearson(xs, ys) {
  const n = xs.length; if (n < 3) return null;
  const mx = anMean(xs), my = anMean(ys);

  for (let i = 0; i < n; i++) { const dx = xs[i] - mx, dy = ys[i] - my; sxy += dx * dy; sxx += dx * dx; syy += dy * dy; }
  const d = Math.sqrt(sxx * syy);
  return d > 0 ? sxy / d : null;

function anRanks(a) {   // 동순위는 평균 랭크
  const idx = a.map((v, i) => [v, i]).sort((p, q) => p[0] - q[0]);
  const out = new Array(a.length);
  for (let i = 0; i < idx.length;) {
    let j = i;
    while (j + 1 < idx.length && idx[j + 1][0] === idx[i][0]) j++;
    const r = (i + j) / 2 + 1;
    for (let k = i; k <= j; k++) out[idx[k][1]] = r;

function anSpearman(xs, ys) { return anPearson(anRanks(xs), anRanks(ys)); }
/* 수정 z (Iglewicz–Hoaglin). z-score를 쓰지 않는 이유: |z| 상한이 (n−1)/√n이라 n=10이면 최대 2.85 —
   "|z|>3" 규칙이 물리적으로 발동하지 않는다. MAD=0(값의 과반이 동률)이면 평균절대편차로 폴백. */

  const m = anMean(dev);
  return m > 0 ? a.map(v => (v - med) / (1.253314 * m)) : null;

/* 결정적 난수(mulberry32) — 같은 데이터면 항상 같은 구간이 나와야 보고서에 옮겨 적을 수 있다 */

  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;

    x = Math.imul(x ^ (x >>> 15), x | 1);
    x ^= x + Math.imul(x ^ (x >>> 7), x | 61);
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;

   벤치마크 행은 서로 독립이 아니므로 행 단위로 뽑으면 구간이 실제보다 좁아진다.

    means[b] = s / n;
  }
  const sorted = Array.from(means).sort((x, y) => x - y);
  return { lo: anQuantile(sorted, 0.025), hi: anQuantile(sorted, 0.975), B: iter };
}
function anCV(a) {   // 변동계수 — "정의상 관계"(비율·차이가 일정) 판정용
  const m = anMean(a);
  if (m === null || m === 0) return Infinity;
  const sd = Math.sqrt(a.reduce((p, v) => p + (v - m) * (v - m), 0) / a.length);
  return Math.abs(sd / m);
}
function anPairXY(rows, a, b) {   // 쌍별 완전관측만
  const xs = [], ys = [], rs = [];
  for (const r of rows) {
    const x = r[a], y = r[b];
    if (typeof x === 'number' && typeof y === 'number') { xs.push(x); ys.push(y); rs.push(r); }
  }
  return { xs, ys, rows: rs };
}
function anCell(rows, col, keyFn) {   // keyFn(row) -> 셀 키, 값은 숫자 배열
  const m = new Map();
  for (const r of rows) {
    const v = r[col];
    if (typeof v !== 'number') continue;
    const k = keyFn(r);
    if (!m.has(k)) m.set(k, []);
    m.get(k).push(v);
  }
  return m;
}

/* ---- 컬럼 프로파일: 모든 가드의 전제 ----
   numericColumns()는 숫자/문자만 구분하지만, 인사이트에는 식별자·설계 노브·연속량 구분이 필요하다. */
const AN_ID_RE = /^(id|idx|index|uid|uuid|run|run_id|seed|trial|rep|repeat|timestamp)$/i;
function anIsSeq(vals) {   // 등차 또는 등비 수열 (예: 500·1000·…·16000)
  if (vals.length < 3) return true;
  const d = [], r = [];
  for (let i = 1; i < vals.length; i++) { d.push(vals[i] - vals[i - 1]); if (vals[i - 1] > 0) r.push(vals[i] / vals[i - 1]); }
  return anCV(d) < 0.35 || (r.length === vals.length - 1 && anCV(r) < 0.35);
}
function anProfile(rows, cols) {
  const total = rows.length;
  return cols.map(col => {
    let nonNull = 0, numeric = 0, capped = false;
    const set = new Set(), numsArr = [], sample = [];
    for (const r of rows) {
      const v = r[col];
      if (v === null || v === undefined || v === '') continue;
      nonNull++;
      if (set.size < AN.uniqueCap) set.add(v); else capped = true;
      if (typeof v === 'number') { numsArr.push(v); numeric++; }
      else if (sample.length < 3 && !sample.includes(String(v))) sample.push(String(v));
    }
    const unique = set.size;
    const p = { col, n: nonNull, missing: total - nonNull, unique, uniqueCapped: capped, sample,
                numRatio: nonNull ? numeric / nonNull : 0 };
    if (col === '_source') p.role = 'source';
    else if (!nonNull) p.role = 'empty';
    else if (unique === 1) { p.role = 'const'; p.constVal = [...set][0]; }
    else if (p.numRatio === 1) {
      p.num = anDescribe(numsArr);
      const lv = [...set].sort((a, b) => a - b), allInt = numsArr.every(v => Number.isInteger(v));
      if (AN_ID_RE.test(col) || (allInt && total >= 10 && unique >= total * 0.9)) p.role = 'id';
      else if (unique <= 2) { p.role = 'flag'; p.levels = lv.map(String); }
      else if (unique <= AN.designMaxLv && (unique <= total / 3 || (allInt && unique <= 8)) && (allInt || anIsSeq(lv))) { p.role = 'design'; p.levels = lv; }
      else p.role = 'cont';
    } else if (p.numRatio >= 0.5 && numeric >= 2) { p.role = 'mixed'; p.num = anDescribe(numsArr); p.badN = nonNull - numeric; }
    else if (AN_ID_RE.test(col) || (total >= 10 && unique >= total * 0.9)) p.role = 'id';
    else if (unique <= AN.catMaxLv) { p.role = 'cat'; p.levels = [...set].map(String).sort(); }
    else p.role = 'catmany';
    if (['cat', 'catmany', 'const', 'flag', 'source'].includes(p.role)) {
      const cnt = new Map();
      for (const r of rows) {
        const v = r[col];
        if (v === null || v === undefined || v === '') continue;
        cnt.set(String(v), (cnt.get(String(v)) || 0) + 1);
      }
      p.top = [...cnt.entries()].sort((a, b) => b[1] - a[1]).slice(0, 3);
    }
    return p;
  });
}

/* ---- 인사이트 엔진 ---- */
function analyzeData() {
  const all = allRows().filter(r => !r._excluded);
  const cols = visibleColumns();
  const total = all.length;
  const stride = total > AN.maxRows ? Math.ceil(total / AN.maxRows) : 1;
  /* 예전엔 i % stride로 골랐는데, 데이터가 요인을 행 단위로 순환하며 기록됐고 주기가 stride의 배수면
     특정 레벨만 남는다. 시드 고정 난수로 뽑아 재현성은 지키면서 주기와의 공진을 피한다. */
  let rows = all;
  if (stride > 1) {
    const rnd = anRng(0x9E3779B9 ^ total), keep = AN.maxRows / total;
    rows = all.filter(() => rnd() < keep);
    if (rows.length > AN.maxRows) rows = rows.slice(0, AN.maxRows);   // 확률 추출이라 상한을 살짝 넘을 수 있다
  }
  const profiles = anProfile(all, cols);                                    // 프로파일은 항상 전체 행
  const P = {};
  profiles.forEach(p => { P[p.col] = p; });
  const ins = [];
  const push = (tier, kind, params, score, chart) => ins.push({ tier, kind, params, score, chart });
  const pc = x => Math.round(x * 100);
  const fv = v => fmtBarVal(v);

  const catCols = profiles.filter(p => p.role === 'cat' || p.role === 'flag').map(p => p.col);   // flag = 2값 조건(fp16 on/off 등)
  const designAll = profiles.filter(p => p.role === 'design').map(p => p.col);
  /* 설계값이 1:1로 대응하면(frames = tokens/250 같은 경우) 같은 블록을 두 번 세는 셈이라
     대표 하나만 남긴다 — 연속 컬럼의 중복 접기와 같은 원칙 */
  const samePartition = (a, b) => {
    const ab = new Map(), ba = new Map();
    for (const r of rows) {
      if (r[a] === undefined || r[b] === undefined) continue;
      const va = String(r[a]), vb = String(r[b]);
      if (ab.has(va) && ab.get(va) !== vb) return false;
      if (ba.has(vb) && ba.get(vb) !== va) return false;
      ab.set(va, vb); ba.set(vb, va);
    }
    return ab.size > 0;
  };
  const designCols = [];
  for (const d of designAll) {
    const rep = designCols.find(k => samePartition(k, d));
    if (rep) push(0, 'dupdesign', { a: rep, b: d }, 0.55);
    else designCols.push(d);
  }
  const contCols = profiles.filter(p => p.role === 'cont').map(p => p.col).slice(0, AN.maxNumCols);
  const primaryCat = catCols[0] || '';

  /* ===== Tier 0 — 데이터 무결성 (가장 싸고 항상 옳다) ===== */
  for (const p of profiles) {
    if (p.role === 'empty') push(0, 'empty', { col: p.col, pct: 100 }, 0.95);
    else if (p.role === 'const') push(0, 'const', { col: p.col, val: String(p.constVal) }, 0.9);
    else if (p.role === 'mixed') push(0, 'mixed', { col: p.col, k: p.badN, sample: p.sample.join(', ') }, 0.99);
    if (p.role !== 'empty' && total && p.missing / total >= AN.missMin) {
      push(0, 'missing', { col: p.col, pct: pc(p.missing / total), k: p.missing }, 0.75 + (p.missing / total >= 0.2 ? 0.1 : 0));
    }
  }
  if (state.datasets.length > 1) push(0, 'sources', { k: state.datasets.length }, 0.55);
  {   // 완전 중복 행 (_source·내부 키 제외 — 두 파일의 같은 내용도 잡히도록)
    const seen = new Set();
    let dup = 0;
    const kc = cols.filter(c => c !== '_source');
    for (const r of rows) {
      const k = kc.map(c => String(r[c])).join(AN_SEP);
      if (seen.has(k)) dup++; else seen.add(k);
    }
    if (dup) push(0, 'duprow', { k: dup }, 0.7);
  }
  for (const p of profiles) {   // 그룹 편향 결측 — 다른 모든 비교를 무효화하므로 최상단
    if (!p.missing || p.role === 'empty' || p.role === 'source') continue;
    let hit = null;
    for (const g of catCols) {
      const byLv = new Map();
      for (const r of rows) {
        const lv = String(r[g]), o = byLv.get(lv) || [0, 0];
        o[0]++;
        const v = r[p.col];
        if (v === null || v === undefined || v === '') o[1]++;
        byLv.set(lv, o);
      }
      const base = p.missing / total;
      for (const [lv, o] of byLv) {
        const rate = o[1] / o[0];
        if (rate - base >= AN.biasGap && (!hit || rate > hit.rate)) hit = { g, lv, rate, base };
      }
    }
    if (hit) push(0, 'missbias', { col: p.col, g: hit.g, lv: hit.lv, pct: pc(hit.rate), base: pc(hit.base) }, 0.93);
  }
  for (const g of catCols) for (const d of designCols) {   // 설계 불균형 — 평균 비교의 전제
    const filled = new Set();
    for (const r of rows) if (r[g] !== undefined && r[d] !== undefined) filled.add(String(r[g]) + AN_SEP + String(r[d]));
    const cells = (P[g].levels || []).length * (P[d].levels || []).length;
    if (cells && filled.size / cells < AN.crossMin) {
      push(0, 'imbalance', { g, d, filled: filled.size, total: cells }, 0.87);
    }
  }

  /* ===== 상관 스캔 — 자명한 쌍을 먼저 걷어내고, 남은 쌍은 그룹별로 재검산 ===== */
  const derivedPairs = new Set();   // 계산 컬럼 부모–자식 (자명한 상관)
  for (const d of state.derived) {
    /* 파생 컬럼과 그 입력의 상관은 자명하다 — kind마다 부모 필드가 다르므로 전부 등록한다
       (예전에는 binary 외에는 valueCol만 봐서 z-score 컬럼이 원본과 "함께 움직인다"로 보고됐다) */
    const parents = d.kind === 'binary' ? [d.a, d.b]
      : d.kind === 'refdelta' ? [d.valueCol, d.refCol, ...(d.keys || [])]
      : d.kind === 'concat' ? (d.parts || []).map(pt => pt.col)
      : [d.col, d.by];
    for (const pa of parents) if (pa) derivedPairs.add([d.name, pa].sort().join(AN_SEP));
  }
  /* 1차 패스: 자명한 쌍(정의상 같은 값·거의 같은 정보)을 찾아 대표 컬럼 하나로 접는다.
     이렇게 하지 않으면 cost_usd(=latency_ms×5e-4) 때문에 모든 발견이 두 번씩 나온다. */
  const alias = new Map();   // 컬럼 -> 대표 컬럼
  const repOf = c => { let r = c; while (alias.has(r)) r = alias.get(r); return r; };
  const pairCache = new Map();
  let nPairs = 0;
  for (let i = 0; i < contCols.length; i++) for (let j = i + 1; j < contCols.length; j++) {
    const a = contCols[i], b = contCols[j];
    const q = anPairXY(rows, a, b);
    if (q.xs.length < AN.minN) continue;
    nPairs++;
    const r = anPearson(q.xs, q.ys);
    if (r === null) continue;
    pairCache.set(a + AN_SEP + b, { r, q });
    if (derivedPairs.has([a, b].sort().join(AN_SEP))) { if (repOf(b) !== repOf(a)) alias.set(repOf(b), repOf(a)); continue; }
    const ratios = [], diffs = [];
    for (let k = 0; k < q.xs.length; k++) { if (q.xs[k] !== 0) ratios.push(q.ys[k] / q.xs[k]); diffs.push(q.ys[k] - q.xs[k]); }
    const defRatio = ratios.length === q.xs.length && anCV(ratios) < AN.defCV;   // 반올림 오차 허용
    const defDiff = anCV(diffs) < AN.defCV;
    if (defRatio || defDiff || Math.abs(r) >= AN.rDup) {
      const small = v => Math.abs(v) >= 0.01 ? fv(v) : v.toExponential(2);   // 배율은 0.0005처럼 작을 수 있다
      const rel = defRatio ? '×' + small(anMean(ratios))
        : defDiff ? (anMean(diffs) >= 0 ? '+' : '−') + small(Math.abs(anMean(diffs)))
        : 'r=' + r.toFixed(3);
      push(0, defRatio || defDiff ? 'dupcol' : 'dupinfo', { a, b, rel }, defRatio || defDiff ? 0.65 : 0.6);
      if (repOf(b) !== repOf(a)) alias.set(repOf(b), repOf(a));   // b를 a로 접는다
    }
  }
  const reps = contCols.filter(c => repOf(c) === c);   // 이후 모든 스캔은 대표 컬럼만
  const pairStats = [];
  for (let i = 0; i < reps.length; i++) for (let j = i + 1; j < reps.length; j++) {
    const a = reps[i], b = reps[j];
    const c1 = pairCache.get(a + AN_SEP + b);
    if (!c1) continue;
    pairStats.push({ a, b, r: c1.r, xs: c1.q.xs, ys: c1.q.ys, rows: c1.q.rows, n: c1.q.xs.length });
  }
  const rThresh = Math.min(0.95, AN.rBase + AN.multK * Math.log2(Math.max(2, nPairs)));   // 다중비교 억제(보정 아님)
  const confCols = [...catCols, ...designCols];
  for (const ps of pairStats) {
    let flip = null;
    for (const g of confCols) {   // 심슨 역전: 합친 수치가 그룹별 수치와 어긋나면 발견이 아니라 경고
      const byLv = new Map();
      for (const r of ps.rows) {
        const lv = String(r[g]);
        if (!byLv.has(lv)) byLv.set(lv, []);
        byLv.get(lv).push(r);
      }
      const within = [];
      for (const rs of byLv.values()) {
        if (rs.length < 5) continue;
        const q = anPairXY(rs, ps.a, ps.b), rw = anPearson(q.xs, q.ys);
        if (rw !== null) within.push(rw);
      }
      if (within.length < 2) continue;
      const med = anMedian(within), gap = Math.abs(ps.r - med);
      const flipped = Math.sign(med) !== Math.sign(ps.r) && Math.abs(med) >= 0.3;
      if (flipped || gap >= AN.simpsonGap) {
        if (!flip || gap > flip.gap) flip = { g, gap, within, flipped };
      }
    }
    if (flip) {
      push(1, flip.flipped ? 'simpson' : 'simpsonGap', {
        a: ps.a, b: ps.b, g: flip.g, rp: ps.r.toFixed(2), k: flip.within.length,
        lo: Math.min(...flip.within).toFixed(2), hi: Math.max(...flip.within).toFixed(2),
      }, 0.9 + Math.min(0.09, flip.gap / 10), { type: 'scatter', x: ps.a, y: ps.b, group: flip.g, trend: 'linear' });
      continue;
    }
    if (Math.abs(ps.r) < rThresh) continue;
    const rho = anSpearman(ps.xs, ps.ys);
    const useRho = rho !== null && Math.abs(Math.abs(rho) - Math.abs(ps.r)) >= AN.rhoGap;
    const v = useRho ? rho : ps.r;
    push(2, 'corr', {
      a: ps.a, b: ps.b, n: ps.n, dirUp: v >= 0,
      stat: useRho ? 'Spearman ρ' : 'Pearson r', v: v.toFixed(2),
    }, 0.5 + 0.45 * (Math.abs(ps.r) - rThresh) / (1 - rThresh || 1),
      { type: 'scatter', x: ps.a, y: ps.b, group: primaryCat, trend: 'linear', trendBand: '1' });
  }

  /* ===== 그룹 비교 — 셀 평균으로 축약 후 같은 조건끼리 짝지어 비교 =====
     블록 = **모든 설계 노브가 같은 행들**. 첫 노브만 쓰면 노브가 2개 이상인 데이터에서
     "같은 조건끼리 짝지었다"가 사실이 아니게 된다(이상치 판정도 같은 기준을 쓴다). */
  const blockKeyOf = r => designCols.length ? designCols.map(d => String(r[d])).join(AN_SEP) : '__all';
  const blockLabelOf = key => {
    if (key === '__all') return AN_ALL;
    const vals = key.split(AN_SEP);
    return designCols.length === 1 ? vals[0] : designCols.map((d, i) => `${d}=${vals[i]}`).join(' ');
  };
  const blocks = [];   // 실제로 관측된 조합만, 설계값 순서대로
  {
    const seen = new Set();
    for (const r of rows) { const k = blockKeyOf(r); if (!seen.has(k)) { seen.add(k); blocks.push(k); } }
    blocks.sort((a, b) => {
      const va = a.split(AN_SEP), vb = b.split(AN_SEP);
      for (let i = 0; i < va.length; i++) {
        const na = Number(va[i]), nb = Number(vb[i]);
        const d = (Number.isFinite(na) && Number.isFinite(nb)) ? na - nb : String(va[i]).localeCompare(String(vb[i]));
        if (d) return d;
      }
      return 0;
    });
  }
  for (const g of catCols) {
    const lv = P[g].levels || [];
    if (lv.length < 2) continue;
    for (const c of reps) {
      const cell = anCell(rows, c, r => String(r[g]) + AN_SEP + blockKeyOf(r));
      const at = (gl, bl) => { const v = cell.get(gl + AN_SEP + bl); return v ? anMean(v) : null; };
      const stats = lv.map(gl => {
        const vs = blocks.map(bl => at(gl, bl)).filter(v => v !== null);
        return { gl, m: vs.length ? anMean(vs) : null, k: vs.length };
      }).filter(s => s.m !== null && s.k >= 3);
      if (stats.length < 2) continue;
      const skipped = lv.length - stats.length;   // 측정이 부족해 비교에서 빠진 레벨 수
      stats.sort((x, y) => y.m - x.m);
      const paired = (A, B) => blocks.map(bl => {
        const a = at(A, bl), b = at(B, bl);
        return (a !== null && b !== null) ? a - b : null;
      }).filter(v => v !== null);

      let cross = null;   // 교차: 우열이 조건에 따라 뒤집히면 평균 차이로 요약하지 않는다
      for (let i = 0; i < stats.length; i++) for (let j = i + 1; j < stats.length; j++) {
        const ds = paired(stats[i].gl, stats[j].gl);
        if (ds.length < 3) continue;
        const pos = ds.filter(v => v > 0), neg = ds.filter(v => v < 0);
        if (!pos.length || !neg.length) continue;
        const mx = Math.max(...pos), mn = Math.max(...neg.map(Math.abs));
        if (Math.min(mx, mn) < AN.flipMin * Math.max(mx, mn)) continue;   // 미세한 흔들림은 교차가 아님
        const sc = Math.min(pos.length, neg.length) / ds.length;
        if (!cross || sc > cross.sc) cross = { A: stats[i].gl, B: stats[j].gl, ds, sc, n: ds.length };
      }
      if (cross) {
        const used = blocks.filter(bl => at(cross.A, bl) !== null && at(cross.B, bl) !== null);
        const labs = keep => used.filter((bl, i) => keep(cross.ds[i])).map(blockLabelOf).join(', ');
        push(1, 'cross', {
          c, g, d: designCols.join(' × '), a: cross.A, b: cross.B, n: cross.n,
          loList: labs(v => v > 0), hiList: labs(v => v < 0),
        }, 0.85 + 0.1 * cross.sc, { type: 'scatter+line', x: designCols[0] || '', y: c, group: g });
        continue;   // 같은 (g, c)에 평균 차이 인사이트를 겹쳐 내지 않는다
      }
      const best = stats[0], worst = stats[stats.length - 1];
      const ds = paired(best.gl, worst.gl);
      if (ds.length < 3) continue;
      const same = ds.filter(v => v > 0).length / ds.length;
      const dd = anDescribe(ds), dz = dd.sd ? dd.mean / dd.sd : (dd.mean ? Infinity : 0);
      const rel = worst.m ? dd.mean / Math.abs(worst.m) : 0;
      if (same < AN.crossMin) continue;
      if (Math.abs(dz) < AN.dzMin && Math.abs(rel) < AN.relMin) continue;
      const boot = anBootMean(ds);
      if (!boot || (boot.lo <= 0 && boot.hi >= 0)) continue;   // 구간이 0을 포함하면 방향을 말할 수 없다
      push(2, 'group', {
        c, g, best: best.gl, worst: worst.gl, m1: fv(best.m), m2: fv(worst.m),
        diff: fv(dd.mean), rel: (rel * 100).toFixed(1), lo: fv(dd.min), hi: fv(dd.max),
        ck: ds.filter(v => v > 0).length, cn: ds.length, bootLo: fv(boot.lo), bootHi: fv(boot.hi),
        scopeK: stats.length, scopeSkipped: skipped,
      }, 0.5 + 0.4 * Math.min(1, Math.abs(rel) / 0.3),
        { type: 'bar', x: g, y: c, group: '', barAgg: 'mean', barError: 'sem', barSort: 'desc', barText: 'value' });
    }
  }

  /* ===== 포화 — 곡선 피팅·외삽 없이 관측 지점의 누적 증가분만 기술 ===== */
  for (const xcol of designCols) {
    const xs = P[xcol].levels || [];
    if (xs.length < 4) continue;
    const groups = primaryCat ? (P[primaryCat].levels || []) : ['__all'];
    const satHits = [];
    for (const c of reps) for (const gl of groups) {
      const sub = primaryCat ? rows.filter(r => String(r[primaryCat]) === gl) : rows;
      /* 다른 노브에 대해 균형이 맞을 때만 주변 평균을 쓴다 — 불균형이면 추세가 아니라 구성 차이를 보게 된다 */
      const counts = xs.map(x => sub.filter(r => r[xcol] === x).length);
      if (!counts.length || counts.some(n => n !== counts[0]) || counts[0] === 0) continue;
      const ys = xs.map(x => {
        const vs = sub.filter(r => r[xcol] === x).map(r => r[c]).filter(v => typeof v === 'number');
        return vs.length ? anMean(vs) : null;
      });
      if (ys.some(v => v === null)) continue;
      const steps = [];
      for (let i = 1; i < ys.length; i++) steps.push(ys[i] - ys[i - 1]);
      const gain = ys[ys.length - 1] - ys[0];
      if (!gain) continue;
      if (steps.filter(s => Math.sign(s) === Math.sign(gain)).length / steps.length < 0.8) continue;
      let cum = 0, k = -1;
      for (let i = 0; i < steps.length; i++) { cum += steps[i]; if (Math.abs(cum / gain) >= AN.satFrac) { k = i; break; } }
      if (k < 0 || k > steps.length - 2) continue;   // 뒤에 최소 한 구간 이상 남아야 "포화"
      if (Math.abs(cum) > Math.abs(gain)) continue;  // 중간에 넘었다가 되돌아오는 곡선은 포화가 아니다 (비율이 100%를 넘는다)
      satHits.push({ c, gl, k, pct: pc(Math.abs(cum / gain)) });
    }
    /* 같은 지점에서 포화하는 그룹이 여럿이면 한 문장으로 합친다 (같은 말을 그룹 수만큼 반복하지 않도록) */
    const byPoint = new Map();
    for (const h of satHits) {
      const key = h.c + AN_SEP + h.k;
      if (!byPoint.has(key)) byPoint.set(key, []);
      byPoint.get(key).push(h);
    }
    for (const hits of byPoint.values()) {
      const h0 = hits[0];
      const chart = { type: 'scatter+line', x: xcol, y: h0.c, group: primaryCat,
        xScale: anIsSeq(xs) && xs[0] > 0 && xs[xs.length - 1] / xs[0] >= 20 ? 'log' : 'linear' };
      const base = { y: h0.c, x: xcol, k: xs.length, x0: xs[0], x1: xs[h0.k + 1] };
      const score = 0.45 + 0.3 * (1 - (h0.k + 1) / (xs.length - 1)) + 0.05 * (hits.length - 1);
      if (hits.length > 1 && primaryCat) {
        const ps = hits.map(h => h.pct);
        push(2, 'saturMulti', { ...base, g: primaryCat, n: hits.length, total: groups.length,
          pctLo: Math.min(...ps), pctHi: Math.max(...ps) }, score, chart);
      } else {
        push(2, 'satur', { ...base, g: primaryCat ? `${primaryCat}=${h0.gl}` : AN_ALL,
          pct: h0.pct, rest: 100 - h0.pct }, score, chart);
      }
    }
  }

  /* ===== 이상치 — 셀 내부(반복) 또는 국소 추세 잔차에서만. 전체 풀에 IQR을 적용하면
     단조 스윕의 양 끝을 매번 오탐한다. 자동 제외는 하지 않는다(제안만). ===== */
  const scopeOf = r => [primaryCat, ...designCols].filter(Boolean).map(k => `${k}=${r[k]}`).join(', ') || AN_ALL;
  for (const c of reps) {
    /* 셀 = 모든 설계 노브가 같은 행들(= 진짜 반복 측정). 첫 노브만 쓰면 스윕이 반복으로 오인된다 */
    const cells = new Map();
    for (const r of rows) {
      if (typeof r[c] !== 'number') continue;
      const k = [primaryCat, ...designCols].filter(Boolean).map(x => String(r[x])).join(AN_SEP);
      if (!cells.has(k)) cells.set(k, []);
      cells.get(k).push(r);
    }
    const repeated = [...cells.values()].some(v => v.length >= 4);
    if (repeated) {
      for (const cr of cells.values()) {
        if (cr.length < 4) continue;
        const vals = cr.map(r => r[c]);
        const z = anRobustZ(vals);
        if (!z) continue;
        const rng = Math.max(...vals) - Math.min(...vals);
        z.forEach((zi, i) => {
          if (Math.abs(zi) >= AN.madZ && rng > 0) {
            push(2, 'outlier', { col: c, val: fv(vals[i]), z: anZ(zi), scope: scopeOf(cr[i]) }, anOutScore(zi));
          }
        });
      }
    } else if (designCols.length === 1) {   // 잔차 판정은 축이 하나일 때만 — 노브가 여럿이면 다른 노브의 변동을 잔차로 오인한다
      const groups = primaryCat ? (P[primaryCat].levels || []) : ['__all'];
      for (const gl of groups) {
        const xcol = designCols[0];
        const sub = (primaryCat ? rows.filter(r => String(r[primaryCat]) === gl) : rows)
          .filter(r => typeof r[c] === 'number' && typeof r[xcol] === 'number')
          .sort((a, b) => a[xcol] - b[xcol]);
        if (sub.length < 6) continue;
        const ys = sub.map(r => r[c]), rng = Math.max(...ys) - Math.min(...ys);
        const res = ys.map((v, i) => (i === 0 || i === ys.length - 1) ? 0 : v - anMedian([ys[i - 1], ys[i], ys[i + 1]]));
        const z = anRobustZ(res);
        if (!z || !rng) continue;
        for (let i = 1; i < ys.length - 1; i++) {   // 끝점은 국소 중앙값으로 판정할 수 없으므로 제외
          if (Math.abs(z[i]) >= AN.madZ && Math.abs(res[i]) >= AN.outMinAmp * rng) {
            push(2, 'outlier', {
              col: c, val: fv(ys[i]), z: anZ(z[i]), scope: scopeOf(sub[i]),
            }, anOutScore(z[i]), { type: 'scatter+line', x: xcol, y: c, group: primaryCat, showLabels: true, labelCol: c });
          }
        }
      }
    }
  }

  /* 정렬: Tier 0(데이터) → Tier 1(교란 경고) → Tier 2(발견), 티어 내 점수순. 종류별 상한으로 소음 억제 */
  ins.sort((a, b) => a.tier - b.tier || b.score - a.score);
  const seen = {};
  const kept = ins.filter(i => {
    // 심슨 경고는 같은 뿌리(그룹 간 수준 차이)에서 여러 쌍이 한꺼번에 나오므로 더 짧게 자른다
    const cap = i.kind === 'outlier' ? AN.outMax : /^simpson/.test(i.kind) ? 2 : AN.maxPerKind;
    seen[i.kind] = (seen[i.kind] || 0) + 1;
    return seen[i.kind] <= cap;
  });
  /* 발견이 0건일 때 "왜 없는지"를 말해줄 수 있도록 스캔 범위를 함께 남긴다 */
  const lvOf = c => (P[c].levels || []).length || P[c].unique;
  const scope = {
    cats: catCols.map(c => `${c}(${lvOf(c)})`),
    designs: designCols.map(c => `${c}(${lvOf(c)})`),
    conts: reps.length,
    skipped: profiles.filter(p => ['id', 'catmany', 'const', 'empty'].includes(p.role))
      .map(p => ({ col: p.col, role: p.role, unique: p.unique })),
  };
  return { profiles, insights: kept, meta: { nRows: total, nScan: rows.length, nCols: cols.length, nPairs, stride, scope,
    capped: profiles.filter(p => p.role === 'cont').length > AN.maxNumCols } };
}

/* ---- 인사이트에서 근거 차트 만들기 (기존 차트는 건드리지 않고 새로 추가) ---- */
/* 인사이트 문장: 언어 종속 조각(방향어·"전체 행")은 여기서만 해석한다 */
function anInsText(ins) {
  const p = { ...ins.params };
  if ('scopeK' in p) p.scope = p.scopeSkipped
    ? tf('an.groupScope', { k: p.scopeK, skipped: p.scopeSkipped })
    : tf('an.groupScopeAll', { k: p.scopeK });
  if ('dirUp' in p) p.dir = t(p.dirUp ? 'an.dir.up' : 'an.dir.down');
  for (const k of Object.keys(p)) if (p[k] === AN_ALL) p[k] = t('an.allRows');
  return tf('an.ins.' + ins.kind, p);
}
function anChartTitle(ins) {
  const p = ins.params;
  if (ins.kind === 'group') return tf('an.ct.group', { c: p.c, g: p.g });
  if (ins.kind === 'cross' || ins.kind === 'satur' || ins.kind === 'outlier') {
    return tf('an.ct.trend', { c: p.c || p.y || p.col, x: p.d || p.x || '' });
  }
  return tf('an.ct.rel', { a: p.a, b: p.b });
}
const AN_TYPE_KEY = { scatter: 'opt.scatter', line: 'opt.line', 'scatter+line': 'opt.scatterLine',
  bar: 'opt.bar', heatmap: 'opt.heatmap', dumbbell: 'opt.dumbbell' };
/* 인사이트가 어떤 차트 설정에 대응하는지 한 줄로 — 기존 차트와 대조하거나 손으로 재현할 때의 좌표 */
function anChartSpec(ov) {
  const parts = [t(AN_TYPE_KEY[ov.type] || ov.type), `X=${ov.x}`, `Y=${ov.y}`];
  if (ov.group) parts.push(`${t('cfg.group')}=${ov.group}`);
  if (ov.barAgg && ov.barAgg !== 'none') parts.push(`${t('cfg.barAgg')}=${t('opt.aggMean')}`);
  return parts.join(' · ');
}
/* 같은 축·그룹의 차트가 이미 있으면 새로 만들지 않고 그리로 보낸다 (중복 카드 방지 + 대조가 목적) */
function anFindChart(ov) {
  return state.charts.find(c => c.type === ov.type && c.x === ov.x && c.y === ov.y
    && (c.group || '') === (ov.group || '')) || null;
}
function runInsightChart(ins) {
  if (!ins.chart) return;
  const found = anFindChart(ins.chart);
  const cfg = found || addChart({ ...ins.chart, title: anChartTitle(ins) });
  const card = document.querySelector(`.chart-card[data-chart="${cfg.id}"]`);
  if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  showToast(t(found ? 'an.chartFound' : 'an.chartAdded'));
}

/* ---- 패널 ---- */
/* 행 집합(제외·흐리게·계산 컬럼)이 바뀌면 인사이트는 낡은 것이 된다.
   GUIDE가 "표에 남아 있는 행에 대해 실행된다"고 약속하므로 조용히 남겨두면 안 된다. */
function analysisStale() { if (analysis) { analysis = null; renderAnalysis(); } }
function toggleAnalysis() {
  const card = document.getElementById('analysisCard');
  if (!allRows().length) { alert(t('an.emptyData')); return; }
  if (!card.hidden && analysis) { card.hidden = true; return; }   // 결과가 낡았으면 닫지 말고 다시 계산
  runAnalysis();
}
function runAnalysis() {
  const btn = document.getElementById('btnAnalyze'), card = document.getElementById('analysisCard');
  card.hidden = false;
  btn.disabled = true; btn.textContent = t('an.computing');
  requestAnimationFrame(() => {   // 한 프레임 양보해 버튼 상태가 보이도록
    try { analysis = analyzeData(); anShowAll = false; renderAnalysis(); }
    finally { btn.disabled = false; btn.textContent = t('btn.analyze'); }
  });
}
const AN_KIND_KEY = { cont: 'an.k.cont', design: 'an.k.design', cat: 'an.k.cat', catmany: 'an.k.catmany',
  id: 'an.k.id', flag: 'an.k.flag', mixed: 'an.k.mixed', const: 'an.k.const', empty: 'an.k.empty', source: 'an.k.source' };
/* 기본 목록 선정: 티어 순서는 지키되 데이터·주의가 발견을 전부 밀어내지 않도록 할당량을 둔다
   (전체는 "더 보기"로 볼 수 있다) */
function anPickShown(list) {
  const quota = [3, 3, AN.maxShown], used = [0, 0, 0], out = [];
  for (const i of list) if (used[i.tier] < quota[i.tier] && out.length < AN.maxShown) { out.push(i); used[i.tier]++; }
  for (const i of list) if (out.length < AN.maxShown && !out.includes(i)) out.push(i);
  return out.sort((a, b) => a.tier - b.tier || b.score - a.score);
}
function renderAnalysis() {
  const card = document.getElementById('analysisCard');
  const ctrl = document.getElementById('anCtrl'), body = document.getElementById('anBody');
  if (!card || card.hidden) return;
  ctrl.innerHTML = ''; body.innerHTML = '';
  if (!analysis) {
    ctrl.append(el('button', { class: 'small', onclick: runAnalysis }, t('an.recompute')));
    body.append(el('div', { class: 'hint' }, t('an.stale')));
    return;
  }
  const { profiles, insights, meta } = analysis;
  let note = tf('an.scan', { rows: meta.nRows.toLocaleString(), cols: meta.nCols, pairs: meta.nPairs });
  if (meta.stride > 1) note += ' ' + tf('an.sampled', { n: meta.nScan.toLocaleString() });
  if (meta.capped) note += ' ' + tf('an.capped', { n: AN.maxNumCols });
  ctrl.append(
    el('button', { class: 'small', onclick: runAnalysis }, t('an.recompute')),
    el('button', { class: 'small', onclick: async () => {
      const ok = await copyText(insightsMd());
      showToast(t(ok ? 'toast.insightsCopied' : 'toast.copyFailed'));
    } }, t('an.copyInsights')),
    el('button', { class: 'small', onclick: exportProfileCsv }, t('an.exportProfile')),
    el('button', { class: 'small', onclick: () => { card.hidden = true; } }, t('an.close')),
    el('span', { class: 'count' }, note),
  );
  const sc = meta.scope || { cats: [], designs: [], conts: 0, skipped: [] };
  const none = t('an.scopeNone');
  let scopeLine = tf('an.scanScope', {
    cats: sc.cats.length ? sc.cats.join(', ') : none,
    designs: sc.designs.length ? sc.designs.join(', ') : none,
    conts: sc.conts,
  });
  if (sc.skipped.length) {
    scopeLine += ' ' + tf('an.skipped', {
      list: sc.skipped.map(x => x.role === 'catmany' ? tf('an.skipLevels', { col: x.col, n: x.unique })
        : `${x.col}(${t(AN_KIND_KEY[x.role] || x.role)})`).join(', '),
    });
  }
  body.append(el('div', { class: 'hint' }, scopeLine));

  /* 인사이트 */
  const gIns = el('details', { class: 'grp', open: '' }, el('summary', {}, tf('an.insights', { n: insights.length })));
  if (!insights.length) gIns.append(el('div', { class: 'hint' }, t('an.none')));
  const shown = anShowAll ? insights : anPickShown(insights);
  let lastTier = -1;
  for (const i of shown) {
    if (i.tier !== lastTier) {   // 티어가 바뀔 때마다 "이 등급은 어떻게 확인하는가" 한 줄
      lastTier = i.tier;
      gIns.append(el('div', { class: 'ins-tier' },
        el('span', { class: 'ins-badge t' + i.tier }, t('an.tier' + i.tier)),
        el('span', {}, t('an.verify' + i.tier))));
    }
    const text = el('span', { class: 'ins-text' }, anInsText(i));
    if (i.chart) text.append(el('div', { class: 'ins-spec' }, anChartSpec(i.chart)));
    gIns.append(el('div', { class: 'ins-row' },
      text,
      ...(i.chart ? [el('button', { class: 'small', title: t('an.chartBtnTitle'),
        onclick: () => runInsightChart(i) }, t(anFindChart(i.chart) ? 'an.chartGo' : 'an.chartBtn'))] : []),
    ));
  }
  if (insights.length > shown.length) {
    gIns.append(el('button', { class: 'small', onclick: () => { anShowAll = !anShowAll; renderAnalysis(); } },
      anShowAll ? t('an.less') : tf('an.more', { n: insights.length - shown.length })));
  }

  /* 컬럼 프로파일 */
  const gProf = el('details', { class: 'grp' }, el('summary', {}, tf('an.profile', { n: profiles.length })));
  const heads = ['an.h.col', 'an.h.kind', 'an.h.missing', 'an.h.unique', 'an.h.min', 'an.h.med', 'an.h.max', 'an.h.mean', 'an.h.sd', 'an.h.note'];
  let html = '<thead><tr>' + heads.map(h => `<th>${esc(t(h))}</th>`).join('') + '</tr></thead><tbody>';
  for (const p of profiles) {
    const nu = p.num, num = v => (v === null || v === undefined) ? '' : esc(fmtBarVal(v));
    const note = p.role === 'mixed' ? tf('an.note.mixed', { k: p.badN, sample: p.sample.join(', ') })
      : p.top ? p.top.map(([v, n]) => `${v} (${n})`).join(', ') : '';
    html += `<tr><td>${esc(p.col)}</td><td>${esc(t(AN_KIND_KEY[p.role] || p.role))}</td>`
      + `<td>${p.missing || ''}</td><td>${p.unique}${p.uniqueCapped ? '+' : ''}</td>`
      + `<td>${nu ? num(nu.min) : ''}</td><td>${nu ? num(nu.med) : ''}</td><td>${nu ? num(nu.max) : ''}</td>`
      + `<td>${nu ? num(nu.mean) : ''}</td><td>${nu ? num(nu.sd) : ''}</td><td>${esc(note)}</td></tr>`;
  }
  const wrap = el('div', { id: 'anTableWrap', html: `<table class="data">${html}</tbody></table>` });
  gProf.append(wrap);

  body.append(gIns, gProf, el('div', { class: 'hint' }, t('an.disclaimer')));
}
function exportProfileCsv() {
  if (!analysis) return;
  const cols = ['column', 'kind', 'n', 'missing', 'unique', 'min', 'q1', 'median', 'q3', 'max', 'mean', 'sd'];
  const rows = analysis.profiles.map(p => ({
    column: p.col, kind: p.role, n: p.n, missing: p.missing, unique: p.unique,
    min: p.num ? p.num.min : '', q1: p.num ? p.num.q1 : '', median: p.num ? p.num.med : '',
    q3: p.num ? p.num.q3 : '', max: p.num ? p.num.max : '', mean: p.num ? p.num.mean : '', sd: p.num ? p.num.sd : '',
  }));
  const blob = new Blob(['﻿' + toCSV(rows, cols)], { type: 'text/csv;charset=utf-8' });

/* ================= dataset chips ================= */
function renderChips() {

  box.innerHTML = '';
  for (const d of state.datasets) {
    box.append(el('span', { class: 'chip' },
      d.name, el('span', { class: 'n' }, tf('chips.rows', { n: d.rows.length })),

    ));
  }
}
/* 계산 컬럼 패널 — 이항 연산 / 기준 대비 델타 */
let derivedEditIdx = -1;
/* 계산 컬럼을 지우면 그걸 축·필터로 쓰던 차트는 조용히 빈 그래프가 되고, 설정 패널은 "(선택)"으로 보이면서도
   내부적으로는 사라진 컬럼을 붙들고 있었다. 지우기 전에 어디서 쓰는지 보여주고, 지운 뒤에는 참조까지 정리한다. */
const DERIVED_REF_FIELDS = ['x', 'y', 'y2', 'group', 'group2', 'size', 'colorBy', 'facetBy', 'labelCol', 'heatZ'];
/* 임의 컬럼의 사용처 — 계산 컬럼 삭제(참조를 끊는다)와 컬럼 숨김(끊지 않는다)이 함께 쓴다 */
function colUsage(name) {
  const charts = [];
  state.charts.forEach((c, i) => {
    const fields = DERIVED_REF_FIELDS.filter(k => c[k] === name);
    const filters = (c.filters || []).filter(f => f.col === name).length;
    if (fields.length || filters) charts.push({ cfg: c, label: c.title || tf('card.chartNum', { n: i + 1 }), fields, filters });
  });
  const deps = state.derived.filter(d => d.name !== name
    && derivedInputs(d).includes(name)).map(d => d.name);
  return { charts, deps };
}
const derivedUsage = colUsage;
function clearDerivedRefs(name) {
  let n = 0;
  for (const c of state.charts) {
    let touched = false;
    for (const k of DERIVED_REF_FIELDS) if (c[k] === name) { c[k] = ''; touched = true; }
    const before = (c.filters || []).length;
    c.filters = (c.filters || []).filter(f => f.col !== name);
    if (c.filters.length !== before) touched = true;
    if (touched) n++;
  }
  return n;
}
function removeDerived(i, commit) {
  const d = state.derived[i];
  if (!d) return;
  const use = derivedUsage(d.name);
  if (use.charts.length || use.deps.length) {   // 되돌릴 수 없는 동작이므로 먼저 묻는다

let saveTimer = null;

function save() {

      const charts = state.charts.map(serializableChart);
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ datasets: state.datasets, charts, derived: state.derived, hiddenCols: state.hiddenCols, nextId: state.nextId }));
    } catch (e) {   // 쿼터 초과 — 조용히 넘기면 자동 저장이 꺼진 줄 모르고 작업하게 된다
      if (!quotaWarned) { quotaWarned = true; showToast(t('toast.quota')); }
    }
  }, 400);
}
function loadSaved() {
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || localStorage.getItem(LEGACY_STORAGE_KEY));
    if (s && s.datasets) {
      restoreSession(s);
      if (!localStorage.getItem(STORAGE_KEY)) { save(); localStorage.removeItem(LEGACY_STORAGE_KEY); }
      return true;
    }
  } catch (e) {}

}
function restoreSession(s) {
  if (s.presets && typeof s.presets === 'object') {   // 같은 이름은 받는 쪽 것을 유지 — 남의 세션이 내 프리셋을 덮지 않게
    const mine = loadPresets(), added = [];
    for (const [k, v] of Object.entries(s.presets)) if (!(k in mine)) { mine[k] = v; added.push(k); }
    if (added.length) { savePresets(mine); showToast(tf('toast.presetsImported', { n: added.length })); }
  }
  if (s.ui) {   // 보기 설정은 이 브라우저에 아직 선택이 없을 때만 따라간다
    if (s.ui.lang && !localStorage.getItem(LANG_KEY)) { LANG = s.ui.lang; localStorage.setItem(LANG_KEY, LANG); applyLang(); }
    if (s.ui.theme && !localStorage.getItem(THEME_KEY)) { THEME = s.ui.theme; localStorage.setItem(THEME_KEY, THEME); applyTheme(); }
    if (s.ui.width && !localStorage.getItem(WIDTH_KEY)) { WIDTH = s.ui.width; localStorage.setItem(WIDTH_KEY, WIDTH); applyWidth(); }
    if (s.ui.palette && !localStorage.getItem(PALETTE_KEY)) setPaletteTheme(s.ui.palette);
  }
  state.datasets = s.datasets || [];
  invalidateDataCaches();
  state.derived = s.derived || [];
  state.hiddenCols = Array.isArray(s.hiddenCols) ? s.hiddenCols : [];   // 예전 세션엔 없다
  state.charts = (s.charts || []).map(c => {
    const m = { ...defaultChart(), ...c };
    if (m.baseline) {   // 구버전 세션 마이그레이션: 단일 baseline → baselines 배열
      m.baselines = [{ x: m.baseline.x, y: m.baseline.y, shade: m.baselineShade || 'none' }];
    }
    delete m.baseline; delete m.baselineShade;
    if (m.fontColor === '#0b0b0b') m.fontColor = '';   // 구 기본값(라이트 잉크) → 자동(테마 따름)
    return m;

  state.nextId = s.nextId || (Math.max(0, ...state.datasets.map(d => d.id), ...state.charts.map(c => c.id)) + 1);
  onDataChanged(false);

  showToast(failed.length ? tf('toast.reportPartial', { n: saved, list: failed.join(', ') }) : tf('toast.reportSaved', { n: saved }));
}
/* 클립보드: file://에서는 navigator.clipboard가 막히므로 폴백을 함께 둔다 */
async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; }
  } catch (e) { /* 폴백으로 */ }
  const ta = el('textarea', { style: 'position:fixed;left:-9999px;top:0' });
  ta.value = text;
  document.body.append(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  ta.remove();
  return ok;
}
