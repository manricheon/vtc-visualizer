<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VTC Visualizer</title>
<link rel="icon" href="data:,">
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
<style>
  /* ===== chart chrome & ink tokens (dataviz reference palette, light) ===== */
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --page: #f9f9f7;
    --ink-1: #0b0b0b;
    --ink-2: #52514e;
    --ink-muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --accent: #2a78d6;
    --danger: #d03b3b;
    --hover: #eef4fd;
    --font: system-ui, -apple-system, "Segoe UI", sans-serif;
    /* 타이포 4단계 — 예전엔 12/12.5/13/15px가 섞여 있었다 */
    --fs-xs: 11px; --fs-sm: 12.5px; --fs-md: 14px; --fs-lg: 20px;
    /* 간격은 4px 배수로만 */
    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px;
    /* 컨트롤 규격 통일 */
    --ctl-h: 30px; --radius: 6px; --radius-lg: 10px;
    --shadow-1: 0 1px 2px rgba(11,11,11,.05), 0 1px 1px rgba(11,11,11,.03);
  }
  /* 다크 테마 토큰 — 단순 반전이 아니라 다크 서피스에 맞춘 값. OS 선호를 기본으로, 토글이 양방향 오버라이드 */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-1: #202226; --page: #16171a; --ink-1: #ececed; --ink-2: #b7b8bb; --ink-muted: #8a8b8f;
      --grid: #34363b; --axis: #4a4c52; --border: rgba(255,255,255,0.13); --accent: #5a9ef0; --danger: #f2635f; --hover: #223247;
    }
  }
  :root[data-theme="dark"], :root:not([data-theme]) { }
  @media (prefers-color-scheme: dark) { :root:not([data-theme]) { --shadow-1: 0 1px 2px rgba(0,0,0,.45); } }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #202226; --page: #16171a; --ink-1: #ececed; --ink-2: #b7b8bb; --ink-muted: #8a8b8f;
    --grid: #34363b; --axis: #4a4c52; --border: rgba(255,255,255,0.13); --accent: #5a9ef0; --danger: #f2635f; --hover: #223247;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--ink-1);
    font-family: var(--font); font-size: 14px; line-height: 1.5;
  }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 16px 20px 60px; }
  :root[data-width="wide"] .wrap { max-width: 1660px; }
  :root[data-width="full"] .wrap { max-width: none; }

  header.app {
    display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap;
    padding: var(--sp-3) 0 var(--sp-4);
  }
  header.app h1 { font-size: var(--fs-lg); margin: 0; font-weight: 650; letter-spacing: -.01em; }
  header.app .sub { color: var(--ink-muted); font-size: var(--fs-sm); margin-right: auto; }
  /* 버튼 9개를 한 줄에 나열하던 것을 역할별로 묶는다: 주 동작 · 내보내기 · 보기 */
  header.app .actions { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; }
  header.app .grp { display: flex; align-items: center; gap: var(--sp-1); }
  header.app .grp + .grp { padding-left: var(--sp-3); border-left: 1px solid var(--grid); }
  header.app .grp.view select { max-width: 118px; }

  button, select, input[type="text"], input[type="number"], input[type="search"], textarea {
    font-family: var(--font); font-size: var(--fs-md); color: var(--ink-1);
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 0 var(--sp-2); height: var(--ctl-h);
    line-height: calc(var(--ctl-h) - 2px);
  }
  textarea { height: auto; line-height: 1.5; padding: var(--sp-1) var(--sp-2); }
  select { padding-right: var(--sp-1); }
  button { cursor: pointer; }
  button:hover { border-color: var(--ink-muted); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.primary:hover { filter: brightness(0.94); }
  button.ghost { background: transparent; }
  button.danger { color: var(--danger); }
  /* 좁은 자리에서 버튼 글자가 **세로로 쪼개지던 것**(기준선 줄의 `값 고정`)을 막는다 —
     줄이 모자라면 버튼을 접을지언정 글자를 세로로 세우지 않는다 */
  button.small { font-size: var(--fs-sm); height: 26px; line-height: 24px; padding: 0 var(--sp-2); white-space: nowrap; flex: none; }
  input[type="color"] { width: 30px; height: 24px; padding: 1px; border: 1px solid var(--border); border-radius: 5px; background: var(--surface-1); cursor: pointer; }
  label.inline { display: inline-flex; align-items: center; gap: 5px; color: var(--ink-2); }

  section.card {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: var(--sp-4); margin-bottom: var(--sp-4);
    box-shadow: var(--shadow-1);
  }
  section.card h2 {
    font-size: var(--fs-xs); margin: 0 0 var(--sp-3); color: var(--ink-muted); font-weight: 600;
    text-transform: uppercase; letter-spacing: .09em;
  }

  /* 데이터 카드 접기 — 파일을 다 넣으면 240px 중 할 일이 남는 것이 없다.
     접어도 드롭은 받는다(리스너가 `document.body`에 있다). 접힘은 이 브라우저의 기본값으로 남긴다. */
  .data-head { display: flex; align-items: baseline; gap: var(--sp-2); flex-wrap: wrap; }
  .data-head h2 { margin: 0 0 var(--sp-3); }
  #dataSummary { flex: 1; min-width: 0; color: var(--ink-muted); font-size: var(--fs-sm);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #dataCard.folded { padding-bottom: var(--sp-2); }
  #dataCard.folded .data-head h2 { margin-bottom: 0; }
  #dataCard.folded .data-body { display: none; }
  /* ===== data input ===== */
  #dropzone {
    border: 1.5px dashed var(--axis); border-radius: var(--radius-lg);
    padding: var(--sp-5) var(--sp-4); text-align: center; color: var(--ink-muted);
    font-size: var(--fs-md);
    transition: background .15s, border-color .15s, padding .15s;
  }
  #dropzone.empty { padding: var(--sp-6) var(--sp-4); background: var(--page); }
  /* 데이터가 들어온 뒤에는 한 줄로 물러난다 — 자리를 차지할 이유가 없다 */
  #dropzone:not(.empty) { display: flex; align-items: center; justify-content: center; gap: var(--sp-3); flex-wrap: wrap; padding: var(--sp-2) var(--sp-3); font-size: var(--fs-sm); }
  #dropzone:not(.empty) .btns { margin-top: 0; }
  #dropzone.empty .btns { margin-top: var(--sp-4); }
  #dropzone .empty-hint { display: none; font-size: var(--fs-sm); margin-top: var(--sp-2); }
  #dropzone.empty .empty-hint { display: block; }
  #btnExample { font-weight: 600; }
  #dropzone.drag { background: var(--hover); border-color: var(--accent); color: var(--accent); }
  #dropzone .btns { margin-top: var(--sp-3); display: flex; gap: var(--sp-2); justify-content: center; flex-wrap: wrap; }
  #datasetChips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  /* 레시피 칩 — 데이터를 넣은 직후 "누르면 되는 것"이 보이는 자리 */
  #starterChips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  #starterChips .lbl { color: var(--ink-muted); font-size: var(--fs-sm); }
  #starterChips .chip-btn { font-size: 12.5px; padding: 3px 10px; border-radius: 999px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--hover); border: 1px solid var(--border); border-radius: 999px;
    padding: 2px 6px 2px 10px; font-size: 12px;
  }
  .chip .n { color: var(--ink-muted); }
  /* 아직 돌아오지 않은 데이터 — 설정은 살아 있고 파일만 다시 넣으면 된다 */
  .chip.ghost { background: none; border-style: dashed; color: var(--ink-muted); }
  .chip button { border: none; background: none; padding: 0 4px; color: var(--ink-muted); font-size: 13px; }
  .chip button:hover { color: var(--danger); }

  /* ===== chart cards ===== */
  #charts { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
  .chart-card { padding: 0; overflow: hidden; margin-bottom: 0; flex: 1 1 100%; }
  .chart-card.half { flex-basis: calc(50% - 8px); }
  /* 접기는 **탭을 접는 것**이다 — 그림만 감추면 설정 패널이 열려 있는 카드는 그대로 길어서
     "접었는데 아무 일도 안 일어난다"가 된다(실제 보고). 헤더 한 줄만 남긴다. */
  .chart-card.folded > .body,
  .chart-card.folded > .chart-table,
  .chart-card.folded > .plot-caption,
  .chart-card.folded > .plot-hint { display: none; }
  @media (max-width: 860px) { .chart-card.half { flex-basis: 100%; } }
  .chart-card .head {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    border-bottom: 1px solid var(--border); background: var(--surface-1);
    flex-wrap: wrap;   /* 절반 폭에서 버튼이 "설"·"프리"처럼 잘리던 것 — 줄이는 대신 접는다 */
  }
  .chart-card .head button { flex: none; }
  .chart-card .head .name { font-weight: 600; font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 설정을 접어 둔 카드의 한 줄 요약 — 자리가 모자라면 이것부터 줄어든다(버튼은 flex:none) */
  .chart-card .head .spec {
    color: var(--ink-muted); font-size: var(--fs-xs); min-width: 0; flex: 1 1 auto;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .chart-card .head .spec[hidden] { display: none; }
  .chart-card .head .name:last-of-type { margin-right: auto; }
  .chart-card .body { display: flex; align-items: stretch; }
  /* 설정 패널 폭은 사용자가 정한다(`--cfg-w`) — 한국어 라벨과 선택지가 292px에서 자주 두 줄로 접혔다.
     절반 폭 카드에서는 상한을 둔다: 카드가 좁은데 패널까지 넓히면 그림이 남지 않는다. */
  .chart-card .cfg {
    width: var(--cfg-w, 300px); flex: none; border-right: 1px solid var(--border);
    padding: 10px 12px; overflow-y: auto; font-size: 13px;
    /* 640px 고정이라 화면이 커도 안 늘어났다(1000px 창에서 360px을 버렸다).
       max-height라 내용이 짧으면 그만큼만 차지한다 — 상한만 화면을 따라간다. */
    max-height: min(calc(100vh - 150px), 900px); min-height: 240px;
  }
  .chart-card.half .cfg { width: min(var(--cfg-w, 300px), 320px); }
  .chart-card .cfg.hidden { display: none; }
  /* 폭 선택과 `하나씩`이 자리를 먹으면서 검색 안내 문구가 잘렸다 — 줄이느니 **줄로 접는다** */
  .cfg-search { flex: 1 1 168px; min-width: 168px; font-size: 12.5px; }
  .cfg-search-box .top { display: flex; gap: 6px; align-items: center; margin: 0 0 8px; flex-wrap: wrap; }
  .cfg-search-box .top label.inline { font-size: 12px; color: var(--ink-muted); gap: 4px; white-space: nowrap; }
  /* 폭 이름이 길어지면(`아주 넓게`) 화살표에 겹친다 — 내용에 맞추되 검색칸을 다 먹지 않게 상한만 둔다 */
  .cfg-search-box .top select { flex: none; width: auto; max-width: 45%; font-size: 12px; padding: 0 4px; }
  .cfg-noresult { margin: 0 0 var(--sp-2); }
  /* 간단 모드: 자주 안 쓰는 줄을 감춘다(43 → 16). **지우는 게 아니라 감추는 것**이라
     DOM에는 그대로 있고, 값이 들어 있는 줄은 `A(row, keep)`가 애초에 `.adv`를 안 붙여 계속 보인다.
     검색은 이걸 이긴다 — 안 그러면 검색 결과에서 조용히 빠져 "그런 옵션은 없다"가 된다. */
  .cfg.simple .row.adv, .cfg.simple .hint.adv { display: none; }
  .cfg.simple details.grp.alladv { display: none; }
  .cfg.searching .row.adv { display: flex; }
  .cfg.searching .hint.adv, .cfg.searching details.grp.alladv { display: block; }
  .cfg-more { margin: var(--sp-2) 0 0; }
  .cfg-more button { font-size: 12px; }
  .chart-card .plot { flex: 1; min-width: 0; min-height: 460px; }
  .chart-card .plot-caption { padding: 8px 14px 2px; font-size: 12.5px; line-height: 1.55; color: var(--ink-2); white-space: pre-wrap; }
  /* 차트를 표로 — 넓은 표는 자기 안에서만 가로로 흐른다(페이지가 옆으로 밀리면 안 된다) */
  .chart-table { padding: 0 14px 4px; }
  .chart-table-wrap { max-height: 320px; overflow: auto; border: 1px solid var(--grid); border-radius: var(--radius); }
  .chart-table caption { caption-side: top; text-align: left; padding: 6px 10px; color: var(--ink-muted); font-size: var(--fs-xs); }
  .chart-table table.data th { cursor: default; }
  .chart-table table.data th:hover { color: var(--ink-2); }
  .chart-card .plot-hint { padding: 5px 12px; font-size: 11px; color: var(--ink-muted); border-top: 1px solid var(--grid); }
  details.grp { margin-bottom: var(--sp-2); border-bottom: 1px solid var(--grid); padding-bottom: var(--sp-2); }
  details.grp summary { cursor: pointer; font-weight: 600; color: var(--ink-2); font-size: var(--fs-sm); padding: var(--sp-1) 0; user-select: none; letter-spacing: .01em; }
  /* 시리즈가 많을 때만 쓰는 한 겹 더 접기 — 검색은 `details.grp`만 훑으므로 일부러 그 클래스를 안 쓴다 */
  details.sub-grp > summary { cursor: pointer; color: var(--ink-muted); font-size: var(--fs-xs); padding: var(--sp-1) 0; user-select: none; }
  .row { display: flex; align-items: center; gap: var(--sp-2); margin: var(--sp-2) 0; flex-wrap: wrap; }
  .row > .lbl { width: var(--cfg-lbl, 84px); flex: none; color: var(--ink-muted); font-size: var(--fs-sm); }
  .row select, .row input[type="text"] { flex: 1; min-width: 60px; }
  /* 숫자 칸이 74px일 때 한국어 placeholder(`시작`)가 스피너에 밀려 잘렸다 — 글자가 잘리면 무슨 칸인지 알 수 없다 */
  .row input[type="number"] { width: 92px; min-width: 0; flex: 0 1 auto; }
  .hint { color: var(--ink-muted); font-size: var(--fs-xs); line-height: 1.55; margin: var(--sp-1) 0; }
  /* 컨트롤 4개를 좁은 패널에 밀어 넣으면 어디를 골라야 할지 알 수 없다 — 좁으면 줄로 접히게 둔다 */
  .filter-block { border-left: 2px solid var(--grid); padding-left: var(--sp-2); margin: var(--sp-2) 0; }
  .filter-row { display: flex; gap: 4px; margin: 4px 0; align-items: center; flex-wrap: wrap; }
  .filter-row select { flex: 1 1 96px; min-width: 96px; }
  .filter-row .op { flex: 0 1 auto; min-width: 74px; width: auto; }
  .filter-row input { flex: 1 1 96px; min-width: 80px; }
  .filter-row button.small { flex: none; }
  .filter-rule { font-size: var(--fs-xs); color: var(--ink-muted); margin: 2px 0 0 2px; line-height: 1.5; }
  .filter-rule b { color: var(--ink-2); font-weight: 600; }
  .filter-vals { display: flex; flex-wrap: wrap; gap: 2px 12px; margin: 2px 0 8px 6px; }
  .filter-vals label.inline { font-size: 12px; gap: 4px; }
  /* 한 줄에 다 못 넣으면 **접는다**. 예전에는 강제로 한 줄이라 이름이 밀려 사라지고 오른쪽 컨트롤이 잘렸다
     (기준선 줄: 이름 + 뱃지 + 버튼 + 방향 + 음영 + ×). */
  .series-row { display: flex; align-items: center; gap: 6px; margin: 4px 0; flex-wrap: wrap; }
  .series-row .sname { flex: 1 1 96px; min-width: 72px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
  .series-row .slabel { flex: 1 1 96px; min-width: 72px; font-size: 12px; }
  /* 마커 이름이 가장 긴 것(triangle-up)까지 들어가야 한다 — 잘리면 무엇을 고른 건지 알 수 없다 */
  .series-row select { width: 104px; flex: 0 1 auto; min-width: 86px; max-width: 100%; }
  /* 52px에서는 한국어 안내 문구(`시작`)가 반 글자에서 잘렸다 — 무슨 칸인지 알 수 없게 된다 */
  .series-row input[type="number"] { width: 72px; min-width: 0; }
  .series-block { margin: 6px 0; padding-bottom: 4px; border-bottom: 1px dashed var(--grid); }
  .series-block:last-child { border-bottom: none; }
  .series-row.sub { margin: 2px 0 0 10px; }
  /* 시리즈 하위 줄(모드·모양·선)의 선택은 늘어나되 **가장 긴 이름(triangle-up)보다 좁아지지 않는다** */
  .series-row.sub select { flex: 1 1 auto; width: auto; min-width: 104px; }
  .series-row.sub input[type="number"] { width: 46px; flex: none; }
  /* 텍스트 마커 목록: 고정 메모 표시 / 기준을 잃어 숨겨진 마커 */
  .tm-badge { flex: none; font-size: var(--fs-xs); color: var(--muted); border: 1px solid var(--grid); border-radius: var(--radius); padding: 1px 6px; white-space: nowrap; }
  .tm-badge.warn { color: var(--danger); border-color: var(--danger); }
  .series-row.tm-stale { flex-wrap: wrap; }   /* 사유 + 다시 지정이 좁은 패널에서 잘리지 않도록 */
  .series-row.tm-stale input[type="text"] { color: var(--muted); font-style: italic; min-width: 120px; }

  /* ===== data table ===== */
  #tableCtrl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  #tableCtrl input[type="search"] { width: 240px; }
  #tableCtrl .count { color: var(--ink-muted); font-size: 12px; }
  #tableWrap { overflow: auto; max-height: 480px; border: 1px solid var(--grid); border-radius: 8px; }
  table.data { border-collapse: collapse; width: 100%; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  table.data th, table.data td { padding: 5px 10px; border-bottom: 1px solid var(--grid); text-align: left; white-space: nowrap; }
  table.data th.num, table.data td.num { text-align: right; }   /* 숫자는 자릿수를 맞춰 읽는다 */
  table.data th {
    position: sticky; top: 0; background: var(--surface-1); cursor: pointer;
    color: var(--ink-2); font-weight: 600; user-select: none; border-bottom: 1px solid var(--axis);
  }
  table.data th:hover { color: var(--accent); }
  table.data tr:hover td { background: var(--hover); }
  #pager { display: flex; gap: 8px; align-items: center; margin-top: 8px; color: var(--ink-muted); font-size: 12px; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  /* 건너뛰기 링크 — 포커스를 받을 때만 나타난다(첫 tabbable이어야 하므로 <body> 맨 앞) */
  .skip { position: absolute; left: -9999px; top: 0; z-index: 100; background: var(--card); color: var(--ink);
          border: 1px solid var(--accent); border-radius: var(--radius); padding: var(--sp-2) var(--sp-3); }
  .skip:focus { left: var(--sp-3); top: var(--sp-3); }
  #charts:focus { outline: none; }

  #toast {

const state = {
  datasets: [],   // {id, name, rows:[{col:val}]}
  charts: [],     // [chartConfig]
  derived: [],    // 계산 컬럼 정의 [{name, kind, ...}] — 입력 파일이 아니라 뷰 계층(세션 상태)
  hiddenCols: [], // 화면에서 감춘 컬럼명 — 데이터는 그대로 두고 목록에서만 뺀다(뷰 계층)
  nextId: 1,
};
/* 계산 컬럼: 정의대로 각 행에 파생 값을 주입 (기존 파생값은 먼저 제거해 재계산) */
function roundv(x) { return typeof x === 'number' ? Math.round(x * 1e6) / 1e6 : x; }
let derivedApplied = [];   // 직전에 주입한 파생 컬럼명 — 삭제·변경 시 잔여 컬럼까지 제거
function applyDerived() {
  const toClear = new Set([...derivedApplied, ...state.derived.map(d => d.name)]);
  for (const d of state.datasets) for (const r of d.rows) for (const n of toClear) delete r[n];
  const rows = state.datasets.flatMap(d => d.rows);
  for (const def of state.derived) {
    if (def.kind === 'binary') {
      const op = def.op;
      const constB = def.bConst !== undefined && def.bConst !== '' ? Number(def.bConst) : null;   // 단위 환산용 상수
      for (const r of rows) {
        const a = r[def.a], b = constB !== null ? constB : r[def.b];
        r[def.name] = (typeof a === 'number' && typeof b === 'number')
          ? roundv(op === '-' ? a - b : op === '+' ? a + b : op === '*' ? a * b : op === '/' ? (b ? a / b : null) : op === 'ratio' ? (b ? a / b * 100 : null) : null)
          : null;
      }
    } else if (def.kind === 'concat') {
      /* 계산이 아니라 **라벨 만들기** — 여러 컬럼 값을 규칙대로 이어 붙여 문자열 컬럼을 만든다.
         결과는 문자열이라 그룹·분할·필터·막대 X축으로 바로 쓰인다. */
      const parts = def.parts || [];
      const sep = def.sep === undefined ? ' · ' : def.sep;
      for (const r of rows) {
        const seg = [];
        for (const pt of parts) {
          const v = r[pt.col];
          if (v === null || v === undefined || v === '') continue;   // 값이 없는 조각은 건너뛴다(구분자만 남지 않게)
          seg.push((pt.pre || '') + String(v) + (pt.post || ''));
        }
        r[def.name] = seg.length ? seg.join(sep) : null;
      }
    } else if (def.kind === 'norm' || def.kind === 'rank' || def.kind === 'groupagg' || def.kind === 'bin') {
      /* 그룹(선택) 안에서 계산 — by가 비면 전체가 하나의 그룹 */
      const buckets = new Map();
      for (const r of rows) {
        const k = def.by ? String(r[def.by]) : '__all';
        if (!buckets.has(k)) buckets.set(k, []);
        buckets.get(k).push(r);
      }
      for (const rs of buckets.values()) {
        const vals = rs.map(r => r[def.col]).filter(v => typeof v === 'number');
        if (!vals.length) { rs.forEach(r => { r[def.name] = null; }); continue; }
        const { mn, mx } = minMax(vals);   // 그룹이 없으면 이 배열이 전체 행이다 — 스프레드 금지
        const mean = vals.reduce((a, b) => a + b, 0) / vals.length;
        const sd = vals.length > 1 ? Math.sqrt(vals.reduce((a, b) => a + (b - mean) * (b - mean), 0) / (vals.length - 1)) : 0;
        const sum = vals.reduce((a, b) => a + b, 0);
        if (def.kind === 'norm') {
          for (const r of rs) {
            const v = r[def.col];
            r[def.name] = typeof v !== 'number' ? null : roundv(
              def.mode === 'z' ? (sd ? (v - mean) / sd : null)
              : def.mode === 'max' ? (mx ? v / mx * 100 : null)
              : (mx > mn ? (v - mn) / (mx - mn) : null));
          }
        } else if (def.kind === 'rank') {
          const sorted = rs.filter(r => typeof r[def.col] === 'number')
            .sort((a, b) => def.desc ? b[def.col] - a[def.col] : a[def.col] - b[def.col]);
          sorted.forEach((r, i) => { r[def.name] = i + 1; });
          for (const r of rs) if (typeof r[def.col] !== 'number') r[def.name] = null;
        } else if (def.kind === 'groupagg') {
          const agg = def.agg === 'sum' ? sum : def.agg === 'min' ? mn : def.agg === 'max' ? mx
            : def.agg === 'count' ? vals.length : mean;
          for (const r of rs) r[def.name] = roundv(agg);
        } else {   // bin — 동일 폭 구간, 라벨은 경계값 (문자열이라 그룹·필터로 쓸 수 있다)
          const n = Math.max(2, Math.min(20, Number(def.bins) || 4));
          const w = (mx - mn) / n;
          for (const r of rs) {
            const v = r[def.col];
            if (typeof v !== 'number') { r[def.name] = null; continue; }
            const idx = w > 0 ? Math.min(n - 1, Math.floor((v - mn) / w)) : 0;
            r[def.name] = `${roundv(mn + idx * w)}~${roundv(mn + (idx + 1) * w)}`;
          }
        }
      }
    } else if (def.kind === 'refdelta') {
      const ref = new Map();
      const key = r => (def.keys || []).map(k => String(r[k])).join('|');
      for (const r of rows) if (String(r[def.refCol]) === String(def.refVal)) ref.set(key(r), r);
      for (const r of rows) {
        const base = ref.get(key(r)), v = r[def.valueCol], bv = base ? base[def.valueCol] : null;
        r[def.name] = (typeof v === 'number' && typeof bv === 'number')
          ? roundv(def.mode === 'retention' ? (bv ? v / bv * 100 : null) : v - bv) : null;
      }
    } else if (def.kind === 'lookup') {
      /* 파일 간 결합 — 다른 파일의 값을 키로 찾아 **컬럼 하나로** 붙인다.
         **행은 절대 늘리지 않는다**: 행이 늘면 `rowKeyCols()`가 만드는 행 정체성이 깨져
         제외·흐리게·포인트 레이블·텍스트 마커 앵커가 전부 어긋난다.
         메타(파라미터·가격 등) 붙이기가 사실상 전부이고, 그건 행 증가 없이 된다. */
      const keys = def.keys || [];
      const key = r => keys.map(k => String(r[k])).join('');
      const src = new Map();
      if (keys.length) {
        for (const r of rows) {
          if (r._source !== def.from) continue;
          const k = key(r);
          if (!src.has(k)) src.set(k, []);
          src.get(k).push(r[def.col]);
        }
      }
      for (const r of rows) {
        const hits = keys.length ? src.get(key(r)) : null;
        if (!hits || !hits.length) { r[def.name] = null; continue; }
        if (def.agg === 'count') { r[def.name] = hits.length; continue; }
        if (def.agg === 'first' || !def.agg) { r[def.name] = hits[0] === undefined ? null : hits[0]; continue; }
        const nums = hits.filter(v => typeof v === 'number');
        if (!nums.length) { r[def.name] = null; continue; }
        let out = nums[0];
        if (def.agg === 'sum' || def.agg === 'mean') { out = nums.reduce((a, b) => a + b, 0); if (def.agg === 'mean') out /= nums.length; }
        else if (def.agg === 'min') { for (const v of nums) if (v < out) out = v; }
        else if (def.agg === 'max') { for (const v of nums) if (v > out) out = v; }
        r[def.name] = roundv(out);
      }
    }
  }
  derivedApplied = state.derived.map(d => d.name);
  invalidateDataCaches();   // 파생 컬럼이 컬럼 목록·숫자 판정을 바꾼다
}

          font: { family: cfg.fontFamily, size: cfg.fontSize + 1, color: ink } });
    /* 끊긴 자리 표시 — 없으면 두 패널이 그냥 두 그래프로 읽힌다 */
    const mid = BRK_LOW + BRK_GAP / 2;
    for (const q of [0, 1]) anns.push({ text: '⁄⁄', xref: 'paper', yref: 'paper',
      x: isX ? mid : q, y: isX ? q : mid, xanchor: 'center', yanchor: 'middle', showarrow: false,
      font: { family: cfg.fontFamily, size: cfg.fontSize + 4, color: CHROME.axis } });
    applyBreakRefs(lay, br, ax);
    return lay;
  }
  // facet(작은 다중 차트): 값별 subplot 격자. 베이스라인·텍스트마커·포인트레이블은 좌표 모호로 비활성
  if (cfg.facetBy) {
    const vals = facetValues(cfg), n = vals.length || 1;
    const cols = cfg.facetCols > 0 ? cfg.facetCols : Math.min(n, Math.max(1, Math.ceil(Math.sqrt(n))));
    const rowsN = Math.ceil(n / cols);
    const lay = {
      title: cfg.title ? { text: cfg.title, font: { family: cfg.fontFamily, size: cfg.fontSize + 4, color: inkOf(cfg)}, x: 0.5 } : undefined,
      font: { family: cfg.fontFamily, size: cfg.fontSize, color: inkOf(cfg)},
      paper_bgcolor: CHROME.surface, plot_bgcolor: faceColor(cfg),
      grid: { rows: rowsN, columns: cols, pattern: 'independent', roworder: 'top to bottom' },
      showlegend: cfg.legendPos !== 'none',
      legend: legend ? { ...legend, traceorder: 'normal' } : undefined,
      margin: { l: 64, r: (cfg.legendPos === 'right' || /^inside/.test(cfg.legendPos) || cfg.legendPos === 'none') ? 8 : 40, t: (cfg.title ? 52 : 30) + 6, b: 52 },
      barmode: cfg.barMode || 'group', bargap: 0.25, bargroupgap: 0.08,
      uirevision: [cfg.id, cfg.type, cfg.facetBy, cfg.facetCols, cfg.x, cfg.y, cfg.xScale, cfg.yScale].join('|'),
    };
    const anns = [];
    vals.forEach((v, i) => {
      const sfx = i === 0 ? '' : String(i + 1);
      const rowIdx = Math.floor(i / cols), colIdx = i % cols;
      const xa = horizBar ? axis(cfg.yLabel, cfg.yScale, cfg.yMin, cfg.yMax, cfg.y, cfg.yTick) : axis(cfg.xLabel, cfg.xScale, cfg.xMin, cfg.xMax, cfg.x, cfg.xTick);
      const ya = horizBar ? axis(cfg.xLabel, cfg.xScale, cfg.xMin, cfg.xMax, cfg.x, cfg.xTick) : axis(cfg.yLabel, cfg.yScale, cfg.yMin, cfg.yMax, cfg.y, cfg.yTick);
      if (rowIdx !== rowsN - 1) xa.title = undefined;   // 가장자리에만 축 제목
      if (colIdx !== 0) ya.title = undefined;
      lay['xaxis' + sfx] = xa; lay['yaxis' + sfx] = ya;
      anns.push({ text: `${cfg.facetBy} = ${v}`, xref: 'x' + sfx + ' domain', yref: 'y' + sfx + ' domain', x: 0.5, y: 1, yanchor: 'bottom',
        showarrow: false, font: { family: cfg.fontFamily, size: cfg.fontSize, color: inkOf(cfg)} });
    });
    lay.annotations = anns;
    return lay;
  }
  return {
    title: cfg.title ? { text: cfg.title, font: { family: cfg.fontFamily, size: cfg.fontSize + 4, color: inkOf(cfg)}, x: 0.5 } : undefined,
    font: { family: cfg.fontFamily, size: cfg.fontSize, color: inkOf(cfg)},
    paper_bgcolor: CHROME.surface, plot_bgcolor: faceColor(cfg),
    xaxis, yaxis, ...y2Layout(cfg),
    showlegend: cfg.legendPos !== 'none',   // 범례는 사용자가 숨길 때만 사라진다 (시리즈 수로 자동 판단하지 않음)
    legend: legend ? { ...legend, traceorder: 'normal' } : undefined,
    margin: { l: 64, r: hasY2(cfg) ? 64 : ((cfg.legendPos === 'right' || /^inside/.test(cfg.legendPos) || cfg.legendPos === 'none') ? 8 : 40), t: cfg.title ? 52 : 28, b: 56 },
    hovermode: 'closest',
    annotations: [...buildAnnotations(cfg), ...trendFitAnnotations(cfg, traces), ...spanAnnotations(cfg), ...bestAnnotations(cfg), ...baselineAnnotations(cfg)],
    shapes: chartShapes(cfg, gd),
    barmode: cfg.barMode || 'group', bargap: 0.25, bargroupgap: 0.08,
    // 스타일 변경 시 줌/팬 유지 — 축·범위·스케일·차트 유형/막대 방향이 바뀔 때만 뷰 리셋
    uirevision: [cfg.id, cfg.type, cfg.barOrient, cfg.x, cfg.y, cfg.y2, cfg.xScale, cfg.yScale, cfg.xMin, cfg.xMax, cfg.yMin, cfg.yMax].join('|'),
  };
}

function renderPlot(cfg) {
  const div = plotDivs[cfg.id];
  if (!div) return;
  /* 분포 차트(히스토그램·박스)는 값 컬럼 하나로 그린다 — X를 요구하면 X가 비었을 때 빈 화면이 된다 */
  /* 분포 차트는 값 컬럼(`cfg.y`) 하나로 그린다 — X를 요구하면 아무것도 안 그려진다.
     유형이 늘 때 여기를 같이 안 고쳐 v0.32의 바이올린·ECDF가 X 없이는 빈 화면이었다.
     그래서 목록을 손으로 적지 않고 `isDistType()` 하나를 본다. */
  const needsX = !isDistType(cfg.type);
  if ((needsX && !cfg.x) || !cfg.y || !allRows().length) {
    Plotly.purge(div);
    div.innerHTML = `<div style="padding:40px;color:#898781;text-align:center">${esc(t('plot.placeholder'))}</div>`;
    div._vizBound = false;   // purge가 이벤트 에미터를 제거하므로 재바인딩 필요
    return;
  }
  applyCardSpec(cfg);   // 설정을 바꾸면 요약도 따라와야 한다(모든 변경이 renderPlot을 거친다)
  const gd = div;
  if (!gd.data) gd.innerHTML = '';   // placeholder 텍스트만 제거 — 기존 플롯 DOM은 Plotly.react가 관리
  gd._vizRendering = true;
  const traces = buildTraces(cfg);
  Plotly.react(gd, traces, buildLayout(cfg, gd._fullLayout ? gd : null, traces), {
    responsive: true, displaylogo: false,
    scrollZoom: true, displayModeBar: true,
    edits: { annotationTail: true, annotationPosition: true },   // position은 고정 메모(paper)를 끌어 옮기기 위한 것
    modeBarButtonsToRemove: ['lasso2d', 'select2d'],
  }).then(() => {
    gd._vizRendering = false;
    if (cfg._asTable) renderChartTable(cfg);   // 표는 그림과 같은 행을 보여야 한다
    /* 기준을 잃은 마커는 화면에서 사라지므로, 사라졌다는 사실을 한 번은 말해 준다 */
    if ((cfg._tmStaleN || 0) !== (cfg._tmStaleShown || 0)) {
      if (cfg._tmStaleN) showToast(tf('toast.tmStale', { n: cfg._tmStaleN }));
      cfg._tmStaleShown = cfg._tmStaleN;
      refreshPanels(cfg);
    }
    /* 베이스라인도 같은 규칙 — 안 그리고 넘어가면 "기준선이 없는 그림"이 그대로 보고서로 나간다 */
    if ((cfg._blStaleN || 0) !== (cfg._blStaleShown || 0)) {
      if (cfg._blStaleN) showToast(tf('toast.blStale', { n: cfg._blStaleN }));
      cfg._blStaleShown = cfg._blStaleN;
      refreshPanels(cfg);
    }
    if (!gd._vizBound) {
      gd._vizBound = true;
      gd.on('plotly_click', ev => {
        const p = ev.points && ev.points[0];
        if (!p || p.data._pareto) return;   // 프런티어 선은 데이터 점이 아니다 (이름은 번역되므로 플래그로 판정)
        const c = state.charts.find(ch => ch.id === cfg.id);
        if (!c) return;
        if (tmPending && tmPending.chartId === c.id) applyReanchor(c, p);   // "다시 지정" 대기 중
        else showPointPopover(c, gd, p, ev.event);
      });
      gd.on('plotly_clickannotation', ev => {
        const c = state.charts.find(ch => ch.id === cfg.id);
        if (!c || !ev.annotation) return;
        if (ev.annotation._kind === 'plabel') {          // 포인트 레이블 클릭 → 개별 숨김
          if (!c.hiddenLabels.includes(ev.annotation._key)) c.hiddenLabels.push(ev.annotation._key);
          renderPlot(c); refreshPanels(c); save();
        } else if (ev.annotation._kind === 'tmarker') {  // 텍스트 마커 클릭 → 편집/삭제
          showMarkerEditPopover(c, ev.annotation._tmIdx, ev.event);
        }
      });
      gd.on('plotly_relayout', ev => {
        const c = state.charts.find(ch => ch.id === cfg.id);
        if (!c) return;
        let moved = false, zoomed = false;
        for (const k of Object.keys(ev)) {
          const m = k.match(/^annotations\[(\d+)\]\.(ax|ay|x|y)$/);
          if (m) {
            const ann = gd.layout.annotations[Number(m[1])];
            if (!ann) continue;
            if (m[2] === 'x' || m[2] === 'y') {
              // 고정 메모만 위치 자체를 옮긴다 — 점에 묶인 마커의 머리는 행이 정하므로 무시한다
              if (ann._kind === 'tmarker' && ann._paper && c.textMarkers[ann._tmIdx]) {
                c.textMarkers[ann._tmIdx][m[2]] = Math.max(0, Math.min(1, ev[k]));
                moved = true;
              }
              continue;
            }
            if (ann._kind === 'plabel' && ann._key) {
              const off = c.labelOffsets[ann._key] || { ax: 0, ay: -14 };
              off[m[2]] = ev[k];
              c.labelOffsets[ann._key] = off;
              moved = true;
            } else if (ann._kind === 'tmarker' && c.textMarkers[ann._tmIdx]) {
              c.textMarkers[ann._tmIdx][m[2]] = ev[k];
              moved = true;
            }
          }
          if (/^[xy]axis\.range/.test(k) || k === 'autosize') zoomed = true;
        }
        if (moved) save();
        if (zoomed && c.baselines.some(b => (b.shade || 'none') !== 'none')) {
          Plotly.relayout(gd, { shapes: chartShapes(c, gd) });
        }
      });
    }
  });
}

/* ---- 포인트 클릭 팝오버: 베이스라인 / 텍스트 마커 ---- */
const popover = document.createElement('div');
popover.id = 'ptPopover';
document.body.append(popover);
document.addEventListener('pointerdown', e => { if (!popover.contains(e.target)) hidePopover(); }, true);
/* Tab으로 빠져나가도 닫는다. 검사를 한 턴 미루는 이유: 목록을 다시 그리는 경로(컬럼 메뉴의 `모두 표시` 등)는
   innerHTML을 갈아 끼우는 동안 잠깐 포커스를 잃는다 — 그 순간에 닫으면 방금 누른 메뉴가 사라진다.
   포커스가 되돌아왔는지 다음 턴에 보고 판단한다. 되돌리지는 않는다(포커스는 이미 사용자가 옮긴 곳에 있다). */

  setTimeout(() => {
    if (popover.classList.contains('show') && !popover.contains(document.activeElement)) hidePopover();
  }, 0);
});
/* 팝오버를 연 요소 — 닫을 때 포커스를 여기로 되돌린다.
   되돌리는 것은 **Escape로 닫을 때만**이다: 바깥을 클릭해 닫혔는데 포커스를 끌어오면 방금 누른 것을 빼앗는다. */
let ppOpener = null;
function hidePopover(restore) {
  popover.classList.remove('show'); popover.innerHTML = '';
  popover.removeAttribute('role'); popover.removeAttribute('aria-label');
  const o = ppOpener; ppOpener = null;
  if (restore === true && o && o.isConnected && o.focus) o.focus();
}
function placePopover(mouseEv, label) {
  /* 키보드로 버튼을 눌러도(clientX=0) 구석에 뜨지 않게 — 좌표가 없으면 누른 요소 기준으로 붙인다 */
  let cx = mouseEv && mouseEv.clientX, cy = mouseEv && mouseEv.clientY;
  const anchor = mouseEv && (mouseEv.getBoundingClientRect ? mouseEv : mouseEv.currentTarget);   // 이벤트 또는 요소
  if (!cx && !cy && anchor && anchor.getBoundingClientRect) {
    const r = anchor.getBoundingClientRect();
    cx = r.left; cy = r.bottom;
  }
  /* 상수(230×140)로 클램프하던 것을 **실제 크기**로 — 조판 팝오버처럼 큰 것이 화면 밖으로 나갔다.
     크기를 재려면 먼저 보여야 하므로 위치를 잡기 전에 `show`를 켜고 좌표만 나중에 정한다. */
  popover.style.left = '-9999px'; popover.style.top = '0px';
  popover.classList.add('show');
  const box = popover.getBoundingClientRect();
  const x = Math.max(4, Math.min((cx || 200) + 6, window.innerWidth - box.width - 8));
  const y = Math.max(4, Math.min((cy || 200) + 6, window.innerHeight - box.height - 8));
  popover.style.left = x + 'px'; popover.style.top = y + 'px';
  popover.setAttribute('role', 'dialog');
  const title = label || (popover.querySelector('.pp-title') || {}).textContent;
  if (title) popover.setAttribute('aria-label', title);
  if (anchor && anchor.getBoundingClientRect && anchor.focus) ppOpener = anchor;
  else if (document.activeElement && document.activeElement !== document.body) ppOpener = document.activeElement;
  /* 팝오버는 <body> 끝에 붙어 있어 Tab 순서가 트리거를 따라오지 않는다 — 열 때 안으로 넣어 준다 */

}
function showPointPopover(c, gd, p, mouseEv) {
  popover.innerHTML = '';
  /* "이 점의 기준선이 이미 있나"는 저장된 좌표가 아니라 **지금 그려진 자리**로 판단해야 한다 —
     점에 묶인 기준선은 데이터가 갱신되면 저장값과 화면값이 다르다(그러면 같은 점에 두 개가 쌓인다). */
  const bRows = c.baselines.some(b => b.rk) ? markerAnchorRows(c) : null;
  const bIdx = c.baselines.findIndex(b => {
    const at = resolveBaseline(c, b, bRows);
    return !at.stale && at.x === p.x && at.y === p.y;
  });
  popover.append(
    el('div', { class: 'pp-title' }, `(${p.x}, ${p.y})`),
    el('button', {
      onclick: () => {
        if (bIdx >= 0) c.baselines.splice(bIdx, 1);
        /* 클릭으로 만든 기준선은 **그 점(행)에 묶는다** — 데이터가 갱신되면 새 값을 따라가야 한다.
           설정 패널에서 값으로 넣는 기준선은 앵커를 붙이지 않는다(값 자체가 의미다). */
        else c.baselines.push({ x: p.x, y: p.y, shade: 'none', ...markerAnchorFor(c, p) });
        hidePopover(); renderPlot(c); refreshPanels(c); save();
      },
    }, bIdx >= 0 ? t('pt.removeBaseline') : t('pt.addBaseline')),
    el('button', {
      onclick: () => {
        const g = p.data && p.data._g, g2 = p.data && p.data._g2;
        const hit = [];
        for (const r of allRows()) {
          if (r._excluded) continue;
          if (r[c.x] === p.x && r[c.y] === p.y
              && (g == null || String(r[c.group]) === g)
              && (g2 == null || String(r[c.group2]) === g2)) { r._excluded = true; hit.push(r); }
        }
        hidePopover();
        if (hit.length) {
          const refresh = () => { bumpCuration(); for (const ch of state.charts) renderPlot(ch); renderTable(); analysisStale(); save(); };
          refresh();
          showToast(tf('toast.excluded', { n: hit.length }), t('toast.undo'), () => { hit.forEach(r => delete r._excluded); refresh(); });
        }
      },
    }, t('pt.excludePoint')),
    el('button', {
      onclick: () => {
        const g = p.data && p.data._g, g2 = p.data && p.data._g2;
        const match = r => r[c.x] === p.x && r[c.y] === p.y
          && (g == null || String(r[c.group]) === g) && (g2 == null || String(r[c.group2]) === g2);
        const already = allRows().some(r => match(r) && r._muted);
        const hit = [];
        for (const r of allRows()) if (match(r) && !r._excluded) { if (already) delete r._muted; else r._muted = true; hit.push(r); }
        hidePopover();
        if (hit.length) {
          const refresh = () => { bumpCuration(); for (const ch of state.charts) renderPlot(ch); renderTable(); analysisStale(); save(); };
          refresh();
          /* 켤 때만 알리던 것을 끌 때도 — 같은 동작의 반대 방향인데 한쪽만 되돌릴 수 있으면 규칙이 아니다 */
          showToast(tf(already ? 'toast.unmuted' : 'toast.muted', { n: hit.length }), t('toast.undo'), () => {
            hit.forEach(r => { if (already) r._muted = true; else delete r._muted; });
            refresh();
          });
        }
      },
    }, allRows().some(r => r[c.x] === p.x && r[c.y] === p.y && r._muted) ? t('pt.unmute') : t('pt.mute')),
    el('button', {
      onclick: () => {
        popover.innerHTML = '';
        const inp = el('input', { type: 'text', placeholder: t('pt.textPlaceholder') });
        const add = () => {
          const txt = inp.value.trim();
          if (txt) {
            c.textMarkers.push({ x: p.x, y: p.y, text: txt, ax: 40, ay: -40, ...markerAnchorFor(c, p) });
            renderPlot(c); refreshPanels(c); save();
          }
          hidePopover();
        };
        inp.addEventListener('keydown', e => { if (e.key === 'Enter') add(); if (e.key === 'Escape') hidePopover(); });
        popover.append(el('div', { class: 'pp-title' }, t('pt.textMarker')), inp,
          el('div', { class: 'pp-row' }, el('button', { onclick: add }, t('btn.add')), el('button', { onclick: hidePopover }, t('btn.cancel'))));
        placePopover(mouseEv); inp.focus();
      },
    }, t('pt.addTextMarker')),
    el('div', { class: 'pp-note' }, t('pt.excludeNote')),
  );

}
/* 클릭한 점이 어느 행이었는지 기억해 둔다 — 값이 갱신돼도 같은 조건의 행을 다시 찾아간다.
   **찾는 집합은 푸는 집합과 같아야 한다**(v0.35.1): 여기서 `allRows()`를 훑으면
   값이 같은 다른 파일의 행이나 필터로 빠진 행을 물 수 있는데, `resolveMarker`/`resolveBaseline`은
   `chartRows()`에서 찾으므로 **만들자마자 "기준 점을 잃었다"가 된다**(실제로 그랬다 —
   같은 데이터를 두 파일로 들고 있거나 차트에 데이터셋·필터를 걸어 두면 클릭한 그 점이 곧바로 사라졌다). */
function markerAnchorFor(c, p) {
  const g = p.data && p.data._g, g2 = p.data && p.data._g2;
  const row = chartRows(c).find(r => r[c.x] === p.x && r[c.y] === p.y
    && (g == null || String(r[c.group]) === g) && (g2 == null || String(r[c.group2]) === g2));
  return row ? { rk: rowKey(row), xc: c.x, yc: c.y } : {};
}
/* {kind:'marker'|'baseline', chartId, idx} — "다시 지정"을 누른 항목. 다음 포인트 클릭이 새 앵커가 된다.
   마커와 베이스라인이 같은 기계를 쓰므로 대기 상태도 하나다(두 벌로 늘리면 둘 다 대기 중인 상태가 생긴다). */
let tmPending = null;
function startReanchor(c, idx, kind = 'marker') {

  showToast(t(kind === 'baseline' ? 'toast.blPick' : 'toast.tmPick'), t('btn.cancel'), () => { tmPending = null; });
}
function applyReanchor(c, p) {
  const { kind, idx } = tmPending;

  const m = c.textMarkers[idx];

/* ================= chart card UI ================= */
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
let ctlSeq = 0;   // 설정 컨트롤 id 일련번호 — `<label for>`로 잇기 위해서만 쓴다(패널을 다시 지어도 겹치지 않게 전역)
function el(tag, attrs = {}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'html') e.innerHTML = v;
    else e.setAttribute(k, v);
  }
  for (const c of children) e.append(c);
  return e;
}
function select(options, value, onchange, attrs = {}) {
  const s = el('select', { ...attrs, onchange: e => onchange(e.target.value) });
  const mkOpt = o => {
    const [val, label] = Array.isArray(o) ? o : [o, o];
    const opt = el('option', { value: val }, label);
    if (String(val) === String(value)) opt.selected = true;
    return opt;
  };
  for (const o of options) {
    /* `{ label, options: [...] }`는 optgroup — 유형 11종처럼 목록이 길면 묶어야 읽힌다 */
    if (o && !Array.isArray(o) && o.options) {
      const g = el('optgroup', { label: o.label });
      for (const oo of o.options) g.append(mkOpt(oo));
      s.append(g);
    } else s.append(mkOpt(o));
  }
  return s;
}
function colSelect(cfg, key, opts) {
  const { allowEmpty = true, emptyLabel = t('opt.noneParen'), onChange } = opts || {};
  const cols = chartColumns(cfg);
  const items = allowEmpty ? [['', emptyLabel], ...cols] : cols;
  return select(items, cfg[key], v => { cfg[key] = v; if (onChange) onChange(); renderPlot(cfg); save(); });
}

/* 카드 이름은 화면 글자이자 그 `<section>`의 접근 이름이다 — 한 곳에서 같이 갱신한다 */

/* 카드 헤더 요약 — 설정을 접어 두면 "이 카드가 무슨 그림인지"를 확인하려고 다시 펼쳐야 했다.
   리포트용 `chartSpecText`는 로그축·집계까지 적어 헤더에서는 흐르므로 짧은 것을 따로 만든다.
   **설정이 펼쳐져 있을 때는 숨긴다** — 바로 아래 같은 내용이 보이는데 두 번 적을 이유가 없다. */
function cardSpecText(cfg) {
  const parts = [t(AN_TYPE_KEY[cfg.type] || cfg.type)];
  if (isDistType(cfg.type)) { if (cfg.y) parts.push(cfg.y); }
  else if (cfg.type === 'heatmap') {
    if (cfg.x && cfg.y) parts.push(`${cfg.x} × ${cfg.y}`);
    if (cfg.heatZ) parts.push(cfg.heatZ);
  } else if (cfg.x && cfg.y) parts.push(`${cfg.x} × ${cfg.y}`);
  if (cfg.y2) parts.push('+ ' + cfg.y2);
  if (cfg.group) parts.push(`${t('card.specGroup')} ${cfg.group}`);
  if (cfg.facetBy) parts.push(`${t('card.specFacet')} ${cfg.facetBy}`);
  const nf = (cfg.filters || []).filter(filterActive).length;
  if (nf) parts.push(`${t('card.specFilter')} ${nf}`);
  if (cfg.dataset) parts.push(cfg.dataset);
  return parts.join(' · ');

/* 그래프를 표로 — 스크린리더에게는 이것이 차트를 읽는 유일한 길이고,
   눈으로 보는 사람에게도 "그 점의 값이 정확히 얼마인지"를 확인하는 자리다.
   차트가 실제로 쓰는 컬럼만, 그 차트의 필터를 적용한 뒤의 행으로 만든다. */
const CHART_TABLE_MAX = 300;
function chartTableCols(cfg) {
  const seen = [];
  for (const k of ['x', 'y', 'y2', 'group', 'group2', 'size', 'colorBy', 'errCol', 'facetBy', 'labelCol', 'heatZ']) {
    const c = cfg[k];

function renderChartTable(cfg, card) {

  if (!cols.length) { box.append(el('div', { class: 'hint' }, t('card.tableNoCols'))); return; }
  const rows = chartRows(cfg).filter(r => !r._excluded);
  const shown = rows.slice(0, CHART_TABLE_MAX);
  const numSet = new Set(numericColumnsAll());
  const nc = c => numSet.has(c) ? ' class="num"' : '';
  const head = `<thead><tr>${cols.map(c => `<th${nc(c)}>${esc(c)}</th>`).join('')}</tr></thead>`;
  const body = shown.map(r => `<tr>${cols.map(c =>
    `<td${nc(c)}>${r[c] === null || r[c] === undefined ? '–' : esc(r[c])}</td>`).join('')}</tr>`).join('');

  tbl.innerHTML = head + '<tbody>' + body + '</tbody>';
  const cap = el('caption');
  cap.textContent = rows.length > shown.length
    ? tf('card.tableCapCut', { n: shown.length, total: rows.length })

/* details 그룹 접힘 상태를 차트별로 기억한다 (`_` 접두사라 세션에는 저장되지 않는다) */
/* 설정 그룹이 8개라 옵션 하나 찾기가 번거롭다 — 라벨로 걸러 보여준다 */
function cfgSearchBox(panel) {
  const inp = el('input', { type: 'search', class: 'cfg-search', 'data-i18n-ph': 'cfg.searchPh', placeholder: t('cfg.searchPh'), 'aria-label': t('cfg.searchPh') });
  const none = el('div', { class: 'hint cfg-noresult', hidden: '' });
  inp.addEventListener('input', () => {
    const q = inp.value.trim().toLowerCase();
    grpSilent = true;   // 검색이 여닫는 것은 사용자의 선택이 아니다 — 기본 펼침으로 저장하지 않는다
    /* 검색은 간단 모드를 이긴다 — 감춘 줄을 결과에서도 빼면 "그런 옵션은 없다"가 된다 */
    panel.classList.toggle('searching', !!q);
    let shown = 0;
    panel.querySelectorAll('details.grp').forEach(g => {
      if (!q) {
        g.hidden = false;
        g.querySelectorAll('.row').forEach(r => { r.hidden = false; });
        if (g._preSearchOpen !== undefined) { g.open = g._preSearchOpen; delete g._preSearchOpen; }
        return;
      }
      if (g._preSearchOpen === undefined) g._preSearchOpen = g.open;
      let hit = 0;
      g.querySelectorAll('.row').forEach(r => {
        /* 라벨만 보면 "로그"(축 스케일의 **선택지** 이름)처럼 흔한 말이 안 잡힌다 — 행 전체 글자도 본다 */
        const lbl = r.querySelector('.lbl');
        const match = ((lbl ? lbl.textContent + ' ' : '') + r.textContent).toLowerCase().includes(q);
        r.hidden = !match;
        if (match) hit++;
      });
      const inTitle = g.querySelector('summary').textContent.toLowerCase().includes(q);
      g.hidden = !hit && !inTitle;
      g.open = hit > 0 || inTitle;
      if (inTitle && !hit) g.querySelectorAll('.row').forEach(r => { r.hidden = false; });
      if (!g.hidden) shown++;
    });
    /* `toggle`은 비동기로 온다 — 같은 턴에 풀면 검색이 여닫은 것까지 기본값으로 저장된다 */
    setTimeout(() => { grpSilent = false; }, 0);
    /* 하나도 안 맞으면 패널이 통째로 비어 고장난 것처럼 보였다 */
    none.hidden = !q || shown > 0;
    none.textContent = q ? tf('cfg.searchNone', { q: inp.value.trim() }) : '';
  });
  /* 폭 선택은 패널 안에 둔다 — 답답함을 느끼는 자리가 여기다(설정은 전역이라 모든 카드에 함께 적용된다) */
  const wsel = select([['s', t('cfg.wS')], ['m', t('cfg.wM')], ['l', t('cfg.wL')], ['xl', t('cfg.wXL')]], CFGW,
    v => setCfgWidth(v), { title: t('cfg.widthTitle') });
  wsel.classList.add('cfg-wsel');
  wsel.setAttribute('aria-label', t('cfg.widthTitle'));
  const acc = el('input', { type: 'checkbox', class: 'cfg-accsel', ...(ACCORDION ? { checked: '' } : {}),
    onchange: e => setAccordion(e.target.checked) });
  const accLbl = el('label', { class: 'inline', title: t('cfg.oneGroupTitle') }, acc, t('cfg.oneGroup'));
  const smp = el('input', { type: 'checkbox', class: 'cfg-smpsel', ...(SIMPLE ? { checked: '' } : {}),
    onchange: e => setSimple(e.target.checked) });
  const smpLbl = el('label', { class: 'inline', title: t('cfg.simpleTitle') }, smp, t('cfg.simple'));
  return el('div', { class: 'cfg-search-box' }, el('div', { class: 'top' }, inp, wsel, accLbl, smpLbl), none);

   접힌 카드에서는 조작 안내 줄도 감춘다: 그릴 것이 없는데 "드래그 = 영역 확대"가 남아 있었다. */
function setCollapsed(cfg, on) {

/* ================= data table ================= */
const tableState = { search: '', sortCol: null, sortDir: 1, page: 0, pageSize: 200 };
function renderTable() {
  const cols = visibleColumns();
  const table = document.getElementById('dataTable');
  let rows = allRows();
  const q = tableState.search.trim().toLowerCase();
  if (q) rows = rows.filter(r => cols.some(c => r[c] !== null && r[c] !== undefined && String(r[c]).toLowerCase().includes(q)));
  if (tableState.sortCol) {
    const c = tableState.sortCol, d = tableState.sortDir;
    rows = rows.slice().sort((a, b) => {
      const va = a[c], vb = b[c];
      if (va === null || va === undefined) return 1;
      if (vb === null || vb === undefined) return -1;
      if (typeof va === 'number' && typeof vb === 'number') return d * (va - vb);
      return d * String(va).localeCompare(String(vb));
    });
  }
  const total = rows.length;
  const pages = Math.max(1, Math.ceil(total / tableState.pageSize));
  tableState.page = Math.min(tableState.page, pages - 1);
  const start = tableState.page * tableState.pageSize;
  const view = rows.slice(start, start + tableState.pageSize);
  const allIncluded = rows.every(r => !r._excluded);

  /* 숫자 컬럼은 우측 정렬 — tabular-nums만으로는 자릿수가 맞지 않는다(150 vs 23412.3) */
  const numSet = new Set(numericColumns());
  const nc = c => numSet.has(c) ? ' class="num"' : '';
  /* 정렬 방향은 화살표 글자만이 아니라 aria-sort로도 알린다 */
  const sortOf = c => tableState.sortCol !== c ? 'none' : (tableState.sortDir > 0 ? 'ascending' : 'descending');
  let html = `<thead><tr><th class="chk" title="${esc(t('table.allIncludeTitle'))}"><input type="checkbox" id="chkAll"${allIncluded ? ' checked' : ''} aria-label="${esc(t('table.allIncludeTitle'))}"></th>`
    + `<th class="chk mutcol" title="${esc(t('table.mutedColTitle'))}">${esc(t('table.mutedCol'))}</th>`
    + cols.map(c =>
    `<th data-col="${esc(c)}"${nc(c)} tabindex="0" aria-sort="${sortOf(c)}">${esc(c)}${tableState.sortCol === c ? (tableState.sortDir > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('') + '</tr></thead><tbody>';
  view.forEach((r, i) => {
    const rk = esc(rowKeyCols(r._source).map(c => r[c]).filter(v => v !== null && v !== undefined && v !== '').join(' · ') || String(start + i + 1));
    html += `<tr class="${r._excluded ? 'excl' : ''}${r._muted ? ' muted' : ''}">`
      + `<td class="chk"><input type="checkbox" data-i="${i}"${r._excluded ? '' : ' checked'} aria-label="${esc(tf('table.includeRow', { row: rk }))}"></td>`
      + `<td class="chk"><input type="checkbox" data-m="${i}"${r._muted ? ' checked' : ''} aria-label="${esc(tf('table.muteRow', { row: rk }))}"></td>`
      + cols.map(c => `<td${nc(c)}>${r[c] === null || r[c] === undefined ? '<span style="color:var(--axis)">–</span>' : esc(r[c])}</td>`).join('') + '</tr>';
  });
  table.innerHTML = html + '</tbody>';
  const rerenderCharts = () => { for (const c of state.charts) renderPlot(c); };
  const sortBy = th => {
    const c = th.dataset.col;
    if (tableState.sortCol === c) tableState.sortDir *= -1;
    else { tableState.sortCol = c; tableState.sortDir = 1; }
    renderTable();
    /* 표를 다시 그리면 포커스가 사라진다 — 같은 컬럼의 헤더로 되돌려 준다(키보드로 연속 정렬하려면 필수) */
    const back = document.querySelector(`#dataTable th[data-col="${CSS.escape(c)}"]`);
    if (back) back.focus();
  };
  table.querySelectorAll('th[data-col]').forEach(th => {
    th.addEventListener('click', () => sortBy(th));
    th.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); sortBy(th); } });
  });
  /* 표를 다시 그리면 방금 누른 체크박스가 사라진다 — 같은 자리로 포커스를 되돌린다 */
  const afterToggle = sel => { bumpCuration(); renderTable(); rerenderCharts(); analysisStale(); save();
    const back = document.querySelector('#dataTable tbody input[' + sel + ']'); if (back) back.focus(); };
  table.querySelectorAll('tbody input[data-i]').forEach(cb => cb.addEventListener('change', () => {
    const r = view[Number(cb.dataset.i)];
    if (cb.checked) delete r._excluded; else r._excluded = true;
    afterToggle(`data-i="${cb.dataset.i}"`);
  }));
  /* 흐리게는 여태 포인트 클릭 말고는 경로가 없었다 — 표에서도 켜고 끌 수 있어야 키보드로 닿는다 */
  table.querySelectorAll('tbody input[data-m]').forEach(cb => cb.addEventListener('change', () => {
    const r = view[Number(cb.dataset.m)];
    if (cb.checked) r._muted = true; else delete r._muted;
    afterToggle(`data-m="${cb.dataset.m}"`);
  }));
  const chkAll = table.querySelector('#chkAll');
  if (chkAll) chkAll.addEventListener('change', () => {
    rows.forEach(r => { if (chkAll.checked) delete r._excluded; else r._excluded = true; });
    bumpCuration(); renderTable(); rerenderCharts(); analysisStale(); save();
  });
  const nExcl = allRows().filter(r => r._excluded).length;
  document.getElementById('tableCount').textContent = tf('table.count', {
    total: total.toLocaleString(), cols: cols.length, all: allRows().length.toLocaleString(),
    excl: nExcl ? tf('table.exclSuffix', { n: nExcl }) : '',
  });
  const restoreBtn = document.getElementById('restoreExcl');
  restoreBtn.hidden = nExcl === 0;
  restoreBtn.textContent = tf('table.restoreExcl', { n: nExcl });
  const nMuted = allRows().filter(r => r._muted).length;
  const mutedBtn = document.getElementById('restoreMuted');
  mutedBtn.hidden = nMuted === 0;
  mutedBtn.textContent = tf('table.restoreMuted', { n: nMuted });
  document.getElementById('pgInfo').textContent = tf('pager.info', { page: pages ? tableState.page + 1 : 0, pages });
  const colBtn = document.getElementById('btnCols');
  const nAll = columns().filter(c => c !== '_source' || state.datasets.length > 1).length;
  colBtn.hidden = !state.datasets.length;
  colBtn.textContent = tf('table.columns', { n: cols.length, m: nAll });
  colBtn.classList.toggle('on', state.hiddenCols.length > 0);
}
/* ---- 컬럼 표시/숨김 팝오버 ----
   숨김은 삭제가 아니다: 참조를 끊지 않으므로 이미 그 컬럼으로 그린 차트는 계속 그려진다.
   사용처 표시는 "숨기면 이 드롭다운에서 사라진다"는 안내일 뿐이다. */
function showColumnsMenu(mouseEv) {
  popover.innerHTML = '';
  const all = columns().filter(c => c !== '_source' || state.datasets.length > 1);
  const apply = () => { renderTable(); refreshCfgPanels(); analysisStale(); save(); };
  /* 목록을 다시 그릴 때는 이벤트가 이미 끝났으므로 버튼을 기준점으로 넘긴다 */
  const setHidden = list => { state.hiddenCols = list; apply(); showColumnsMenu(document.getElementById('btnCols')); };
  popover.append(el('div', { class: 'pp-title' }, t('col.title')));
  const list = el('div', { class: 'pp-list' });
  all.forEach(c => {
    const hidden = state.hiddenCols.includes(c);
    const use = colUsage(c);
    const where = [...new Set(use.charts.map(u => u.label))].slice(0, 2).join(', ')
      + (use.deps.length ? (use.charts.length ? ' · ' : '') + use.deps.join(', ') : '');
    const row = el('label', { class: 'pp-check' + (hidden ? ' off' : '') },
      el('input', {
        type: 'checkbox', ...(hidden ? {} : { checked: '' }),
        onchange: e => {   // 목록은 다시 그리지 않는다 — 여러 개를 연달아 끄고 켤 수 있게
          state.hiddenCols = e.target.checked ? state.hiddenCols.filter(h => h !== c) : [...state.hiddenCols, c];
          row.classList.toggle('off', !e.target.checked);
          apply();
        },
      }),
      el('span', { class: 'cname' }, c),
      ...(where ? [el('span', { class: 'cuse' }, where)] : []),
    );
    list.append(row);
  });
  /* "쓰는 것만": 차트가 참조하는 컬럼 + 다른 계산 컬럼의 입력만 남긴다.
     숫자만 남기는 단축은 두지 않았다 — 숨김이 도구 전체에 적용되므로 method 같은 그룹 컬럼이
     통째로 사라져 그룹 지정이 조용히 불가능해진다. */
  const used = all.filter(c => { const u = colUsage(c); return u.charts.length || u.deps.length; });
  /* 일괄 버튼은 한 번에 여러 컬럼을 뒤집는다 — 개별 체크박스와 달리 손으로 되돌리기 어렵다 */
  const bulk = (next, msg) => {
    const before = state.hiddenCols.slice();
    setHidden(next);
    showToast(msg, t('toast.undo'), () => setHidden(before));
  };
  popover.append(list, el('div', { class: 'pp-row' },
    el('button', { onclick: () => bulk([], t('col.showAll')) }, t('col.showAll')),
    ...(used.length ? [el('button', { onclick: () => bulk(all.filter(c => !used.includes(c)), t('col.usedOnly')) }, t('col.usedOnly'))] : []),
  ), el('div', { class: 'pp-note' }, t('col.hiddenNote')));
  placePopover(mouseEv);
}

/* ================= 자동 분석 (탐색용 스크리닝) =================

 * 문장은 {kind, params}로만 보관하고 렌더 시 i18n 템플릿에 넣는다(언어 토글에 자동 대응).

 * 시드=클러스터) 반복 수가 임의적이라 p값을 정당화할 수 없다. 대신 원단위 차이 + 조건별 방향
 * 일관성으로 신뢰도를 나타내고, 자명하거나 뒤집힌 관계는 아예 발견으로 내보내지 않는다.

const AN = {

  crossMin: 0.8, flipMin: 0.25, dzMin: 0.8, relMin: 0.05,
  missMin: 0.05, biasGap: 0.30, designMaxLv: 12, catMaxLv: 24,   // 모델 20종 비교 같은 실제 사례를 침묵시키지 않도록
  madZ: 3.5, outMax: 3, outMinAmp: 0.05, satFrac: 0.9, bootB: 2000,
};
const AN_SEP = '\u0001';   // 복합 키 구분자 — 데이터 값에 나타나지 않는 제어문자
const AN_ALL = '\u0002';    // "전체 행" 자리표시자 — 문장은 렌더 시점에 번역되므로 언어를 굽지 않는다
let analysis = null;      // {profiles, insights, meta} — 캐시. onDataChanged가 무효화
let anShowAll = false;

/* ---- 순수 통계 (인자만으로 동작 — 콘솔에서 바로 검증 가능) ---- */
function anMean(a) { return a.length ? a.reduce((s, v) => s + v, 0) / a.length : null; }
function anQuantile(sorted, p) {
  if (!sorted.length) return null;
  const i = (sorted.length - 1) * p, lo = Math.floor(i), hi = Math.ceil(i);
  return lo === hi ? sorted[lo] : sorted[lo] + (sorted[hi] - sorted[lo]) * (i - lo);
}
function anMedian(a) { return a.length ? anQuantile(a.slice().sort((x, y) => x - y), 0.5) : null; }
function anDescribe(a) {
  const n = a.length; if (!n) return null;
  const s = a.slice().sort((x, y) => x - y), mean = anMean(a);
  const sd = n > 1 ? Math.sqrt(a.reduce((p, v) => p + (v - mean) * (v - mean), 0) / (n - 1)) : 0;
  return { n, mean, sd, min: s[0], q1: anQuantile(s, 0.25), med: anQuantile(s, 0.5), q3: anQuantile(s, 0.75), max: s[n - 1] };
}
function anPearson(xs, ys) {
  const n = xs.length; if (n < 3) return null;
  const mx = anMean(xs), my = anMean(ys);
  let sxy = 0, sxx = 0, syy = 0;
  for (let i = 0; i < n; i++) { const dx = xs[i] - mx, dy = ys[i] - my; sxy += dx * dy; sxx += dx * dx; syy += dy * dy; }
  const d = Math.sqrt(sxx * syy);
  return d > 0 ? sxy / d : null;
}
function anRanks(a) {   // 동순위는 평균 랭크
  const idx = a.map((v, i) => [v, i]).sort((p, q) => p[0] - q[0]);
  const out = new Array(a.length);
  for (let i = 0; i < idx.length;) {
    let j = i;
    while (j + 1 < idx.length && idx[j + 1][0] === idx[i][0]) j++;
    const r = (i + j) / 2 + 1;
    for (let k = i; k <= j; k++) out[idx[k][1]] = r;
    i = j + 1;
  }
  return out;
}
function anSpearman(xs, ys) { return anPearson(anRanks(xs), anRanks(ys)); }
/* 수정 z (Iglewicz–Hoaglin). z-score를 쓰지 않는 이유: |z| 상한이 (n−1)/√n이라 n=10이면 최대 2.85 —
   "|z|>3" 규칙이 물리적으로 발동하지 않는다. MAD=0(값의 과반이 동률)이면 평균절대편차로 폴백. */
function anRobustZ(a) {
  const med = anMedian(a), dev = a.map(v => Math.abs(v - med));
  const mad = anMedian(dev);
  if (mad > 0) return a.map(v => 0.6745 * (v - med) / mad);
  const m = anMean(dev);
  return m > 0 ? a.map(v => (v - med) / (1.253314 * m)) : null;
