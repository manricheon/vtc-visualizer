/* ---- 모든 차트를 한 장 PNG로 세로 합성 ---- */
async function exportAllCharts() {
  const cfgs = state.charts.filter(c => plotDivs[c.id] && plotDivs[c.id].data);
  if (!cfgs.length) { alert(t('err.drawChartFirst')); return; }
  const imgs = [];
  for (const c of cfgs) {
    const gd = plotDivs[c.id];
    const url = await Plotly.toImage(gd, { format: 'png', scale: 2, width: gd.clientWidth || 900, height: gd.clientHeight || 460 });
    const im = new Image(); im.src = url;
    await new Promise(res => { im.onload = res; });
    imgs.push(im);
  }
  const pad = 24, W = Math.max(...imgs.map(i => i.width));
  const H = imgs.reduce((s, i) => s + i.height, 0) + pad * (imgs.length + 1);
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = CHROME.surface; ctx.fillRect(0, 0, W, H);   // 합성 배경 = 현재 테마 서피스
  let y = pad;
  for (const im of imgs) { ctx.drawImage(im, Math.round((W - im.width) / 2), y); y += im.height + pad; }
  cv.toBlob(b => {
    const a = el('a', { href: URL.createObjectURL(b), download: 'vtc-visualizer-all-charts.png' });
    a.click(); URL.revokeObjectURL(a.href);
  }, 'image/png');
}

/* ---- 차트 프리셋: 설정만 저장 (데이터 제외) — 같은 컬럼 이름의 데이터에 재적용 ---- */
const PRESET_KEY = 'vtc-visualizer:presets';
function loadPresets() {
  try { return JSON.parse(localStorage.getItem(PRESET_KEY)) || {}; } catch (e) { return {}; }
}
function savePresets(p) { localStorage.setItem(PRESET_KEY, JSON.stringify(p)); }
/* 프리셋이 참조하는 계산 컬럼 정의를 함께 담는다 — 없으면 받는 쪽에서 빈 차트가 되고 경고도 없었다 */
/* 차트가 참조하는 컬럼 이름 — 프리셋의 계산 컬럼 수집과 숨김 해제가 함께 쓴다.
   손으로 적은 목록을 두면 필드가 늘 때 빠진다(실제로 보조축 y2가 빠져 있었다) — DERIVED_REF_FIELDS 하나만 본다. */
function chartRefCols(cfg) {
  return new Set([...DERIVED_REF_FIELDS.map(k => cfg[k]), ...(cfg.filters || []).map(f => f.col)].filter(Boolean));
}
function presetDerivedFor(cfg) {
  const used = chartRefCols(cfg);
  const out = [], seen = new Set();
  const add = name => {
    const d = state.derived.find(x => x.name === name);
    if (!d || seen.has(name)) return;
    seen.add(name);
    derivedInputs(d).filter(Boolean).forEach(add);   // 체인 의존성까지
    out.push(d);
  };
  used.forEach(add);
  return out;
}
function chartPreset(cfg) {
  const p = serializableChart(cfg);
  delete p.id; delete p.title;
  delete p.textMarkers; delete p.labelOffsets; delete p.hiddenLabels;   // 특정 데이터 점에 묶인 필드는 제외
  const der = presetDerivedFor(cfg);
  if (der.length) p._derived = der;   // 축으로 쓰는 계산 컬럼 정의를 함께 (적용 시 없으면 복원)
  return p;
}
function applyPreset(cfg, preset) {
  const prev = JSON.parse(JSON.stringify(serializableChart(cfg)));   // 설정을 통째로 덮어쓰므로 되돌릴 수 있어야 한다
  const keep = { id: cfg.id, title: cfg.title };
  /* 곁들여 한 일은 토스트를 따로 띄우지 않고 마지막 한 줄에 모은다 —
     showToast는 요소 하나를 재사용하므로 연달아 부르면 앞의 안내가 그대로 덮인다(보이지 않았다). */
  const notes = [];
  let restored = 0;
  for (const d of preset._derived || []) {   // 프리셋이 쓰는 계산 컬럼이 없으면 정의를 복원한다
    if (!state.derived.some(x => x.name === d.name)) { state.derived.push(d); restored++; }
  }
  if (restored) {
    applyDerived(); renderDerived(); renderTable(); analysisStale();
    notes.push(tf('toast.presetDerived', { n: restored }));
  }
  const clean = { ...preset };
  delete clean._derived;
  /* 프리셋이 쓰는 컬럼이 숨겨져 있으면 풀어 준다 — 차트는 그려지지만 축 선택기에서 그 컬럼을
     다시 고를 수 없어 반쪽짜리 상태가 된다. 없는 계산 컬럼을 복원해 주는 것과 같은 결. */
  if (state.hiddenCols.length) {
    const need = [...chartRefCols(clean)].filter(c => state.hiddenCols.includes(c));
    if (need.length) {
      state.hiddenCols = state.hiddenCols.filter(c => !need.includes(c));
      renderTable(); analysisStale();
      notes.push(tf('toast.presetUnhid', { n: need.length, cols: need.join(', ') }));
    }
  }
  if (clean.dataset && !state.datasets.some(d => d.name === clean.dataset)) {
    notes.push(tf('toast.presetNoDataset', { name: clean.dataset }));   // 그 파일이 없으면 전체로 — 빈 차트를 남기지 않는다
    clean.dataset = '';
  }
  const merged = { ...defaultChart(), ...clean, ...keep };   // 프리셋에 없는 새 필드는 기본값으로 (세션 복원과 동일 규칙)
  for (const k of Object.keys(cfg)) if (!k.startsWith('_')) delete cfg[k];
  Object.assign(cfg, merged);
  const card = cardOf(cfg);   // 유형이 바뀔 수 있으므로 이 카드만 재구성 (다른 카드의 줌·패널 상태는 보존)
  if (card) { purgePlot(cfg.id); card.replaceWith(renderChartCard(cfg)); renderPlot(cfg); } else refreshCharts();
  save();
  showToast([t('toast.presetApplied'), ...notes].join(' · '), t('toast.undo'), () => {
    for (const k of Object.keys(cfg)) if (!k.startsWith('_')) delete cfg[k];
    Object.assign(cfg, prev);
    const c2 = cardOf(cfg);
    if (c2) { purgePlot(cfg.id); c2.replaceWith(renderChartCard(cfg)); renderPlot(cfg); }
    save();
  });
}

/* ---- 기본 프리셋 ----
   남의 데이터에 어떤 컬럼이 있는지 알 수 없으므로 컬럼 이름을 박아 둘 수 없다.
   대신 GUIDE 레시피를 "역할"(그룹·스윕 노브·점수·비용)로 적어 두고, 열 때마다 지금 데이터에 맞춘다.
   역할이 채워지지 않는 레시피는 목록에 아예 띄우지 않는다 — 눌렀더니 빈 차트가 되는 것이 가장 나쁘다. */
const SP_SCORE_RE = /score|acc|f1|auc|bleu|rouge|prec|recall|quality|iou|map\b|rate|ratio|win/i;
const SP_COST_RE = /token|budget|latency|time|cost|frame|step|size|param|mem|fps|throughput|flops|energy|watt/i;
let starterRoleCache = null;
function starterRoles() {
  /* 종류는 **값의 분포**가 정하고(anProfile — 이름을 보지 않는다), 이름은 같은 종류 안에서
     "둘 중 어느 게 점수고 어느 게 비용인가"를 고르는 데만 쓴다.
     도메인 약어만 쓰는 데이터에서도 범주 컬럼과 스윕 노브는 제대로 잡힌다. */
  const key = dataVer + '|' + state.hiddenCols.join(',');
  if (starterRoleCache && starterRoleCache.key === key) return starterRoleCache.roles;
  const rows = allRows();
  const prof = rows.length ? anProfile(rows, visibleColumns()) : [];
  const of = role => prof.filter(p => p.role === role).map(p => p.col);
  const conts = of('cont'), designs = of('design');
  const nums = [...conts, ...designs];                     // 연속량이 없으면 스윕 노브라도 값 축으로 쓴다
  const cats = [...of('cat'), ...of('flag')].filter(c => c !== '_source');
  const score = conts.find(c => SP_SCORE_RE.test(c))
    || conts.find(c => !SP_COST_RE.test(c)) || nums[0] || '';
  /* 비용 축은 연속량을 먼저 본다 — 스윕 노브를 X로 쓰면 스윕 레시피와 같은 그림이 되어 버린다 */
  const cost = conts.find(c => c !== score && SP_COST_RE.test(c))
    || designs.find(c => c !== score && SP_COST_RE.test(c))
    || conts.find(c => c !== score) || nums.find(c => c !== score) || '';
  const design = designs.find(c => c !== score) || '';
  const roles = { score, cost, design, cat: cats[0] || '' };
  starterRoleCache = { key, roles };
  return roles;
}
const STARTER_PRESETS = [
  { key: 'avg', need: ['cat', 'score'], make: r => ({
      type: 'bar', x: r.cat, y: r.score, group: r.cat,
      barAgg: 'mean', barError: 'std', barSort: 'desc', barText: 'value' }) },
  { key: 'sweep', need: ['design', 'score'], make: r => ({
      type: 'scatter+line', x: r.design, y: r.score, group: r.cat,
      xScale: logFits(r.design) ? 'log' : 'linear', trend: 'none' }) },
  { key: 'tradeoff', need: ['cost', 'score'], make: r => ({
      type: 'scatter', x: r.cost, y: r.score, group: r.cat, pareto: true, paretoDir: 'min-x-max-y' }) },
  { key: 'heat', need: ['cat', 'design', 'score'], make: r => ({
      type: 'heatmap', x: r.cat, y: r.design, heatZ: r.score, heatAgg: 'mean', heatText: 'value' }) },
  { key: 'dist', need: ['score'], make: r => ({ type: 'box', y: r.score, group: r.cat }) },
];
/* 2배씩 늘어나는 스윕은 로그축에서 등간격이 된다 — 값이 그런 모양일 때만 켠다 */
function logFits(col) {
  if (!col) return false;
  const v = uniqueVals(col).filter(n => typeof n === 'number' && n > 0);
  return v.length >= 3 && v[v.length - 1] / v[0] >= 8;
}
function starterList() {
  if (!allRows().length) return [];
  const r = starterRoles();
  return STARTER_PRESETS
    .filter(s => s.need.every(k => r[k]) && (s.key !== 'tradeoff' || r.cost !== r.score))
    .map(s => ({ key: s.key, cfg: s.make(r) }));
}

function onDataChanged(autoChart = true) {
  applyDerived();   // 계산 컬럼 재적용 (데이터·정의 변경 반영)
  if (state.datasets.length <= 1) {   // _source가 UI에서 사라지면 그걸 참조하던 설정도 유령이 된다
    for (const c of state.charts) {
      for (const k of ['x', 'y', 'group', 'group2', 'colorBy', 'facetBy', 'labelCol', 'heatZ']) {
        if (c[k] === '_source') c[k] = '';
      }
      c.filters = c.filters.filter(f => f.col !== '_source');
    }
  }
  /* 지정한 데이터셋이 사라졌으면 전체로 되돌린다 — 되돌리기만 하면 그 파일에만 있던 컬럼을 가리키는
     축이 남아 여전히 빈 차트다. 전환할 때와 같은 정리(없는 컬럼 비우기 + 축 다시 고르기)를 태운다. */
  const names = state.datasets.map(d => d.name);
  for (const c of state.charts) if (c.dataset && !names.includes(c.dataset)) switchDataset(c, '');
  analysis = null;  // 분석 결과는 데이터에 종속 — 낡은 인사이트를 남기지 않는다
  renderAnalysis();
  renderChips();
  renderDerived();

  renderTable();
  if (autoChart && state.datasets.length && !state.charts.length) addChart();
  else { refreshCfgPanels(); for (const c of state.charts) renderPlot(c); }
  updateEmptyCharts();   // 데이터가 비면 빈 상태 안내·예시 버튼이 다시 보여야 한다
  save();
}

  state.datasets = []; state.charts = []; state.nextId = 1; state.hiddenCols = [];
  invalidateDataCaches();
  onDataChanged(false); refreshCharts();
});
document.getElementById('restoreExcl').addEventListener('click', () => {
  allRows().forEach(r => { delete r._excluded; });
  renderTable(); analysisStale();
  for (const c of state.charts) renderPlot(c);
  save();
});
document.getElementById('restoreMuted').addEventListener('click', () => {
  allRows().forEach(r => { delete r._muted; });
  renderTable(); analysisStale();
  for (const c of state.charts) renderPlot(c);
  save();
});
document.getElementById('btnExportCsv').addEventListener('click', exportTableCsv);
document.getElementById('btnCols').addEventListener('click', e => showColumnsMenu(e));
document.getElementById('tableSearch').addEventListener('input', e => { tableState.search = e.target.value; tableState.page = 0; renderTable(); });
document.getElementById('pgPrev').addEventListener('click', () => { tableState.page = Math.max(0, tableState.page - 1); renderTable(); });
document.getElementById('pgNext').addEventListener('click', () => { tableState.page += 1; renderTable(); });
document.getElementById('btnLangToggle').addEventListener('click', () => {
  LANG = LANG === 'ko' ? 'en' : 'ko';
  localStorage.setItem(LANG_KEY, LANG);
  applyLang();
  paletteSelectRefresh();
  relabelCards(); refreshCfgPanels(); for (const c of state.charts) renderPlot(c);
  renderTable(); renderChips(); renderAnalysis();   // 인사이트는 {kind, params}라 재계산 없이 언어만 바뀜
  const b = document.getElementById('btnTheme'); if (b) b.title = t('theme.toggle');
  applyWidth();   // 폭 버튼 라벨도 언어에 맞춰 갱신
});
(() => {   // 팔레트 선택 — 기본은 현행, 나머지는 필요할 때 고른다
  const sel = document.getElementById('selPalette');
  const fill = () => {
    sel.innerHTML = '';
    for (const k of Object.keys(PALETTE_THEMES)) {
      const o = el('option', { value: k }, t('palette.' + k));
      if (k === PALETTE_THEME) o.selected = true;
      sel.append(o);
    }
    sel.title = t('palette.title');
  };
  fill();
  sel.addEventListener('change', e => setPaletteTheme(e.target.value));
  paletteSelectRefresh = fill;
})();
document.getElementById('btnTheme').addEventListener('click', toggleTheme);
document.getElementById('btnWidth').addEventListener('click', cycleWidth);
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (THEME === 'auto') applyTheme(); });

/* visualizer.py 서버가 있으면 폴더의 csv/json을 자동 로드 */
async function tryServerAutoload() {
  if (!/^https?:$/.test(location.protocol)) return;
  try {
    const res = await fetch('api/files');
    if (!res.ok) return;
    const files = await res.json();
    let reloaded = 0;
    for (const name of files) {
      /* 같은 이름이면 건너뛰던 예전 동작은 갱신된 로그를 영영 보여주지 않았다 — 항상 최신 내용으로 교체한다 */
      const had = state.datasets.some(d => d.name === name);
      const r = await fetch('api/file?name=' + encodeURIComponent(name));
      if (r.ok) {
        try { addDataset(name, parseAny(await r.text(), name)); if (had) reloaded++; }
        catch (e) { console.warn('자동 로드 실패:', name, e); }
      }
    }
    if (reloaded) showToast(tf('toast.reloaded', { n: reloaded }));
  } catch (e) { /* 서버 없음 — 정상 */ }
}

/* ================= init ================= */
document.getElementById('appVersion').textContent = APP_VERSION;
document.querySelector('.footer-ver').textContent = APP_VERSION;
applyLang();
applyTheme();   // CHROME·PALETTE·SEQ를 테마에 맞춰 설정 (첫 렌더 전)
applyWidth();
loadSaved();
renderChips(); renderDerived(); renderTable(); refreshCharts();
tryServerAutoload();
</script>
