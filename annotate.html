<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VTC Visualizer — 이미지 주석</title>
<link rel="icon" href="data:,">
<style>
  /* 토큰은 index.html과 같은 값이다 — 두 페이지가 같은 도구로 보여야 한다.
     여기서만 색을 바꾸지 말 것(고치려면 양쪽을 함께). */
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb; --page: #f9f9f7;
    --ink-1: #0b0b0b; --ink-2: #52514e; --ink-muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);
    --accent: #2a78d6; --danger: #d03b3b; --hover: #eef4fd;
    --font: system-ui, -apple-system, "Segoe UI", sans-serif;
    --fs-xs: 11px; --fs-sm: 12.5px; --fs-md: 14px; --fs-lg: 20px;
    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px;
    --ctl-h: 30px; --radius: 6px; --radius-lg: 10px;
    --shadow-1: 0 1px 2px rgba(11,11,11,.05), 0 1px 1px rgba(11,11,11,.03);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-1: #202226; --page: #16171a; --ink-1: #ececed; --ink-2: #b7b8bb; --ink-muted: #8a8b8f;
      --grid: #34363b; --axis: #4a4c52; --border: rgba(255,255,255,0.13); --accent: #5a9ef0; --danger: #f2635f; --hover: #223247;
      --shadow-1: 0 1px 2px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #202226; --page: #16171a; --ink-1: #ececed; --ink-2: #b7b8bb; --ink-muted: #8a8b8f;
    --grid: #34363b; --axis: #4a4c52; --border: rgba(255,255,255,0.13); --accent: #5a9ef0; --danger: #f2635f; --hover: #223247;
    --shadow-1: 0 1px 2px rgba(0,0,0,.45);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink-1); font-family: var(--font); font-size: 14px; line-height: 1.5; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 16px 20px 60px; }
  header.app { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; padding: var(--sp-3) 0 var(--sp-4); }
  header.app h1 { font-size: var(--fs-lg); margin: 0; font-weight: 650; letter-spacing: -.01em; }
  header.app .ver { font-size: var(--fs-xs); color: var(--ink-muted); font-weight: 400; margin-left: var(--sp-1); }
  header.app .sub { color: var(--ink-muted); font-size: var(--fs-sm); }
  nav.actions { margin-left: auto; display: flex; gap: var(--sp-2); align-items: center; flex-wrap: wrap; }

  button, select, input[type="text"], input[type="number"] {
    font: inherit; font-size: var(--fs-sm); color: var(--ink-1);
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: var(--radius); height: var(--ctl-h); padding: 0 var(--sp-2);
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--ink-muted); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.primary:hover { filter: brightness(0.94); }
  button.ghost { background: transparent; }
  button.danger { color: var(--danger); }
  button.small { font-size: var(--fs-sm); height: 26px; line-height: 24px; padding: 0 var(--sp-2); }
  button.on { border-color: var(--accent); color: var(--accent); }
  input[type="color"] { width: 30px; height: 24px; padding: 1px; border: 1px solid var(--border); border-radius: 5px; background: var(--surface-1); cursor: pointer; }
  label.inline { display: inline-flex; align-items: center; gap: 5px; color: var(--ink-2); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .skip { position: absolute; left: -9999px; top: 0; z-index: 100; background: var(--surface-1); color: var(--ink-1);
          border: 1px solid var(--accent); border-radius: var(--radius); padding: var(--sp-2) var(--sp-3); }
  .skip:focus { left: var(--sp-3); top: var(--sp-3); }

  section.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius-lg);
                 padding: var(--sp-4); margin-bottom: var(--sp-4); box-shadow: var(--shadow-1); }
  section.card h2 { font-size: var(--fs-xs); margin: 0 0 var(--sp-3); color: var(--ink-muted); font-weight: 600;
                    text-transform: uppercase; letter-spacing: .09em; }
  .hint { color: var(--ink-muted); font-size: var(--fs-xs); line-height: 1.55; margin: var(--sp-1) 0; }
  .row { display: flex; align-items: center; gap: var(--sp-2); margin: var(--sp-2) 0; flex-wrap: wrap; }
  .row > .lbl { width: 78px; flex: none; color: var(--ink-muted); font-size: var(--fs-sm); }

  #dropzone { border: 1.5px dashed var(--axis); border-radius: var(--radius-lg); padding: var(--sp-6) var(--sp-4);
              text-align: center; color: var(--ink-muted); font-size: var(--fs-md); }
  /* 이미지가 들어온 뒤에는 점선을 거둔다 — "여기 떨어뜨리세요"는 할 일을 끝냈고, 남아 있으면 소음이다.
     드래그 중에는(.drag) 다시 점선으로 돌아와 받을 수 있다는 것을 알린다.
     (본문 index.html은 그대로 둔다 — 거기서 파일을 떨어뜨리는 건 **더하기**라 계속 권할 일이지만,
      여기서 떨어뜨리면 이미지가 **바뀌고 마크가 사라진다**.) */
  #dropzone.has { padding: var(--sp-2) var(--sp-3); display: flex; gap: var(--sp-2); align-items: center; justify-content: center;
                  border-style: solid; border-width: 1px; border-color: var(--border); }
  #dropzone.has.drag { border-style: dashed; border-width: 1.5px; }
  #dropzone.has .drop-text, #dropzone.has .empty-hint { display: none; }
  #dropzone.drag { border-color: var(--accent); background: var(--hover); }
  .btns { display: flex; gap: var(--sp-2); justify-content: center; flex-wrap: wrap; margin-top: var(--sp-3); }
  #dropzone.has .btns { margin-top: 0; }

  /* 그림판 — 캔버스 위에 마크를 그린다. 화면 크기와 무관하게 **원본 픽셀 좌표**로 저장한다 */
  #stageWrap { position: relative; overflow: auto; max-height: 70vh; border: 1px solid var(--border);
               border-radius: var(--radius); background: var(--page); }
  #stage { display: block; touch-action: none; cursor: crosshair; }
  #stage.move { cursor: move; }
  #emptyStage { padding: var(--sp-6); text-align: center; color: var(--ink-muted); }

  .tools { display: flex; gap: var(--sp-2); align-items: center; flex-wrap: wrap; margin-bottom: var(--sp-3); }
  .marks { max-height: 220px; overflow: auto; }
  .mark-row { display: flex; gap: var(--sp-2); align-items: center; padding: 3px 4px; border-radius: var(--radius); }
  .mark-row:hover, .mark-row.sel { background: var(--hover); }
  .mark-row .mname { flex: 1; font-size: var(--fs-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mark-row .mkind { font-size: var(--fs-xs); color: var(--ink-muted); flex: none; }

  footer { color: var(--ink-muted); font-size: var(--fs-xs); padding: var(--sp-5) 0 var(--sp-2); border-top: 1px solid var(--grid); }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink-1); color: var(--page);
           padding: 8px 14px; border-radius: var(--radius); font-size: var(--fs-sm); display: none; z-index: 60; }
  #toast.show { display: block; }
</style>
</head>
<body>
<a href="#stageWrap" class="skip" data-i18n="a11y.skip"></a>
<div class="wrap">
  <header class="app">
    <h1>VTC Visualizer <span class="ver" id="appVersion"></span></h1>
    <span class="sub" data-i18n="header.sub"></span>
    <nav class="actions">
      <button id="btnUndo" data-i18n="btn.undo"></button>
      <button id="btnExport" class="primary" data-i18n="btn.export"></button>
      <select id="selScale" class="ghost" data-i18n-aria="btn.scale">
        <option value="1">1x</option><option value="2" selected>2x</option>
      </select>
      <button id="btnTheme" class="ghost"></button>
      <button id="btnLang" class="ghost"></button>
    </nav>
  </header>

  <main>
    <section class="card">
      <h2 data-i18n="section.image"></h2>
      <div id="dropzone">
        <span class="drop-text" data-i18n="drop.text"></span>
        <div class="empty-hint hint" data-i18n="drop.hint"></div>
        <div class="btns">
          <button id="btnOpen" data-i18n="btn.open"></button>
          <span class="hint" id="imgInfo"></span>
        </div>
      </div>
      <input type="file" id="fileInput" accept="image/*" hidden data-i18n-aria="btn.open">
    </section>

    <section class="card">
      <h2 data-i18n="section.marks"></h2>
      <div class="tools">
        <button class="small tool on" data-tool="text" data-i18n="tool.text"></button>
        <button class="small tool" data-tool="arrow" data-i18n="tool.arrow"></button>
        <button class="small tool" data-tool="rect" data-i18n="tool.rect"></button>
        <button class="small tool" data-tool="mask" data-i18n="tool.mask"></button>
        <span class="hint" data-i18n="tool.hint"></span>
      </div>
      <div class="row">
        <span class="lbl" data-i18n="cfg.style"></span>
        <input type="color" id="inpColor" value="#d03b3b" data-i18n-aria="cfg.color">
        <input type="number" id="inpWidth" min="1" max="24" value="3" style="width:70px" data-i18n-aria="cfg.width">
        <input type="number" id="inpFont" min="8" max="96" value="22" style="width:70px" data-i18n-aria="cfg.font">
        <label class="inline"><input type="checkbox" id="inpBg" checked><span data-i18n="cfg.bg"></span></label>
        <button class="small danger" id="btnDelete" data-i18n="btn.deleteMark"></button>
      </div>
      <div id="stageWrap" tabindex="-1">
        <div id="emptyStage" data-i18n="stage.empty"></div>
        <canvas id="stage" hidden></canvas>
      </div>
      <div class="hint" data-i18n="stage.hint"></div>
      <div class="marks" id="markList"></div>
    </section>
  </main>

  <footer>VTC Visualizer <span class="footer-ver"></span> — <span data-i18n="footer.text"></span> © mrc</footer>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
const APP_VERSION = 'v0.30';

/* ================= i18n ================= */
const I18N = {
  ko: {
    'header.sub': '보고용 캡처에 라벨·화살표·가리기를 얹는 도구 — 이미지는 브라우저 밖으로 나가지 않습니다',
    'a11y.skip': '그림판으로 건너뛰기',
    'section.image': '이미지', 'section.marks': '주석',
    'drop.text': '이미지를 여기에 드래그 앤 드랍하거나 붙여넣기(⌘/Ctrl+V) 하세요',
    'drop.hint': '차트 PNG, 스크린샷, 아무 그림이나 됩니다. 브라우저 안에서만 처리됩니다.',
    'btn.open': '이미지 열기…', 'btn.undo': '실행 취소', 'btn.export': 'PNG 저장', 'btn.scale': '저장 배율',
    'btn.deleteMark': '선택 삭제',
    'tool.text': '텍스트', 'tool.arrow': '화살표', 'tool.rect': '사각형', 'tool.mask': '가리기',
    'tool.hint': '그림판에서 끌어 그리고, 마크를 눌러 고릅니다. 고른 마크는 드래그로 옮깁니다.',
    'cfg.style': '스타일', 'cfg.color': '색', 'cfg.width': '선 굵기', 'cfg.font': '글자 크기', 'cfg.bg': '글자 배경',
    'stage.empty': '이미지를 먼저 넣으세요.',
    'stage.hint': '드래그 = 그리기 · 클릭 = 고르기 · Delete = 삭제 · ⌘/Ctrl+Z = 실행 취소. 목록에서도 고르고 지울 수 있습니다.',
    'mark.text': '텍스트', 'mark.arrow': '화살표', 'mark.rect': '사각형', 'mark.mask': '가리기',
    'prompt.text': '넣을 문구:',
    'confirm.replace': '새 이미지를 넣으면 지금 주석 {n}개가 사라집니다(되돌릴 수 없음). 계속할까요?',
    'toast.pasted': '붙여넣은 이미지를 넣었습니다.', 'toast.exported': 'PNG로 저장했습니다.',
    'toast.needImage': '이미지를 먼저 넣으세요.', 'toast.notImage': '이미지 파일이 아닙니다.',
    'toast.undoNone': '되돌릴 것이 없습니다.', 'toast.selectNone': '고른 마크가 없습니다.',
    'img.info': '{w} × {h} 픽셀 · 마크 {n}개',
    'footer.text': '이미지는 브라우저 밖으로 나가지 않습니다',
    'theme.toggle': '라이트/다크 전환', 'lang.toggle': 'EN',
  },
  en: {
    'header.sub': 'Put labels, arrows and redactions on a screenshot — the image never leaves your browser',
    'a11y.skip': 'Skip to the canvas',
    'section.image': 'Image', 'section.marks': 'Annotations',
    'drop.text': 'Drag an image here, or paste it (⌘/Ctrl+V)',
    'drop.hint': 'A chart PNG, a screenshot, any picture. Everything stays inside the browser.',
    'btn.open': 'Open image…', 'btn.undo': 'Undo', 'btn.export': 'Save PNG', 'btn.scale': 'Export scale',
    'btn.deleteMark': 'Delete selected',
    'tool.text': 'Text', 'tool.arrow': 'Arrow', 'tool.rect': 'Box', 'tool.mask': 'Redact',
    'tool.hint': 'Drag on the canvas to draw, click a mark to select it. A selected mark can be dragged.',
    'cfg.style': 'Style', 'cfg.color': 'Colour', 'cfg.width': 'Line width', 'cfg.font': 'Font size', 'cfg.bg': 'Text backdrop',
    'stage.empty': 'Add an image first.',
    'stage.hint': 'Drag = draw · click = select · Delete = remove · ⌘/Ctrl+Z = undo. The list below selects and deletes too.',
    'mark.text': 'Text', 'mark.arrow': 'Arrow', 'mark.rect': 'Box', 'mark.mask': 'Redaction',
    'prompt.text': 'Text to place:',
    'confirm.replace': 'Loading a new image discards the {n} annotation(s) you have (no undo). Continue?',
    'toast.pasted': 'Pasted image loaded.', 'toast.exported': 'Saved as PNG.',
    'toast.needImage': 'Add an image first.', 'toast.notImage': 'That is not an image file.',
    'toast.undoNone': 'Nothing to undo.', 'toast.selectNone': 'No mark selected.',
    'img.info': '{w} × {h} px · {n} mark(s)',
    'footer.text': 'the image never leaves your browser',
    'theme.toggle': 'Toggle light/dark', 'lang.toggle': '한국어',
  },
};
/* 저장 키는 index.html과 공유한다 — 두 페이지의 언어·테마가 따로 놀면 같은 도구로 보이지 않는다 */
const LANG_KEY = 'vtc-visualizer:lang', THEME_KEY = 'vtc-visualizer:theme';
let LANG = localStorage.getItem(LANG_KEY) || (navigator.language || '').startsWith('ko') ? 'ko' : 'en';
if (!I18N[LANG]) LANG = 'ko';
const t = k => (I18N[LANG][k] !== undefined ? I18N[LANG][k] : k);
const tf = (k, v) => t(k).replace(/\{(\w+)\}/g, (_, n) => (v[n] !== undefined ? v[n] : `{${n}}`));
function applyLang() {
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(e => { e.textContent = t(e.getAttribute('data-i18n')); });
  document.querySelectorAll('[data-i18n-aria]').forEach(e => { e.setAttribute('aria-label', t(e.getAttribute('data-i18n-aria'))); });
  document.getElementById('btnLang').textContent = t('lang.toggle');
  document.getElementById('btnTheme').title = t('theme.toggle');
  renderMarks(); syncInfo();
}
let THEME = localStorage.getItem(THEME_KEY) || 'auto';
function applyTheme() {
  if (THEME === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', THEME);
  const dark = THEME === 'dark' || (THEME === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.getElementById('btnTheme').textContent = dark ? '☀️' : '🌙';
}

let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}

/* ================= state =================
   마크 좌표는 **원본 이미지 픽셀**이다. 화면에 맞춰 축소해 보여줘도 저장은 원본 해상도로 나가야 하므로,
   화면 좌표는 그릴 때·집을 때만 환산한다(scale). 화면 좌표로 저장하면 창 크기가 결과를 바꾼다. */
let img = null;              // HTMLImageElement
let marks = [];              // {kind, x, y, x2, y2, text, color, width, font}
let undoStack = [];          // marks의 스냅샷 — 되돌리기는 상태 통째로가 가장 단순하고 안 틀린다
let sel = -1;                // 고른 마크 인덱스
let tool = 'text';
let view = 1;                // 화면 배율 (1 이하)

const stage = document.getElementById('stage');
const ctx = stage.getContext('2d');
const snapshot = () => { undoStack.push(JSON.stringify(marks)); if (undoStack.length > 50) undoStack.shift(); };

function fitView() {
  if (!img) return;
  const wrap = document.getElementById('stageWrap');
  const avail = Math.max(320, wrap.clientWidth - 2);
  view = Math.min(1, avail / img.naturalWidth);
  stage.width = Math.round(img.naturalWidth * view);
  stage.height = Math.round(img.naturalHeight * view);
}
function setImage(image) {
  img = image;
  marks = []; undoStack = []; sel = -1;
  document.getElementById('emptyStage').hidden = true;
  stage.hidden = false;
  document.getElementById('dropzone').classList.add('has');
  fitView(); draw(); renderMarks(); syncInfo();
}
function syncInfo() {
  document.getElementById('imgInfo').textContent = img
    ? tf('img.info', { w: img.naturalWidth, h: img.naturalHeight, n: marks.length }) : '';
}

/* ---- 그리기 ----
   화면과 저장이 **같은 함수**를 쓴다 — 두 벌로 두면 화면에는 맞는데 저장본만 어긋나는 일이 생긴다. */
function paint(c, scale, withSel) {
  c.clearRect(0, 0, c.canvas.width, c.canvas.height);
  if (img) c.drawImage(img, 0, 0, img.naturalWidth * scale, img.naturalHeight * scale);
  for (let i = 0; i < marks.length; i++) drawMark(c, marks[i], scale, withSel && i === sel);
}
function drawMark(c, m, s, isSel) {
  c.save();
  c.strokeStyle = m.color; c.fillStyle = m.color; c.lineWidth = Math.max(1, m.width * s);
  c.lineCap = 'round'; c.lineJoin = 'round';
  const x = m.x * s, y = m.y * s, x2 = (m.x2 || 0) * s, y2 = (m.y2 || 0) * s;
  if (m.kind === 'text') {
    c.font = `600 ${Math.max(6, m.font * s)}px ${getComputedStyle(document.body).fontFamily}`;
    c.textBaseline = 'top';
    const w = c.measureText(m.text || '').width, h = m.font * s * 1.25;
    /* 배경은 켜면 **완전 불투명**이다 — 85%로 두었더니 아래 선·격자가 비쳐 글자색이 탁해졌다.
       읽히라고 까는 것이므로 어정쩡하게 덮지 않는다. 배경이 그림을 가리는 자리에서는 아예 끈다. */
    if (m.bg !== false) {
      c.fillStyle = '#fff';
      c.fillRect(x - 3, y - 2, w + 6, h + 4);
      c.fillStyle = m.color;
    }
    c.fillText(m.text || '', x, y);
    if (isSel) { c.strokeStyle = '#2a78d6'; c.lineWidth = 1; c.setLineDash([4, 3]); c.strokeRect(x - 3, y - 2, w + 6, h + 4); }
  } else if (m.kind === 'rect') {
    c.strokeRect(Math.min(x, x2), Math.min(y, y2), Math.abs(x2 - x), Math.abs(y2 - y));
    if (isSel) { c.setLineDash([4, 3]); c.strokeStyle = '#2a78d6'; c.lineWidth = 1;
      c.strokeRect(Math.min(x, x2) - 3, Math.min(y, y2) - 3, Math.abs(x2 - x) + 6, Math.abs(y2 - y) + 6); }
  } else if (m.kind === 'mask') {
    /* 가리기는 **불투명**해야 한다 — 반투명이면 아래 글자가 비쳐 가린 의미가 없다 */
    c.fillStyle = m.color;
    c.fillRect(Math.min(x, x2), Math.min(y, y2), Math.abs(x2 - x), Math.abs(y2 - y));
    if (isSel) { c.setLineDash([4, 3]); c.strokeStyle = '#2a78d6'; c.lineWidth = 1;
      c.strokeRect(Math.min(x, x2) - 3, Math.min(y, y2) - 3, Math.abs(x2 - x) + 6, Math.abs(y2 - y) + 6); }
  } else {   // arrow
    c.beginPath(); c.moveTo(x, y); c.lineTo(x2, y2); c.stroke();
    const a = Math.atan2(y2 - y, x2 - x), hl = Math.max(8, m.width * s * 3.2);
    c.beginPath();
    c.moveTo(x2, y2);
    c.lineTo(x2 - hl * Math.cos(a - 0.4), y2 - hl * Math.sin(a - 0.4));
    c.lineTo(x2 - hl * Math.cos(a + 0.4), y2 - hl * Math.sin(a + 0.4));
    c.closePath(); c.fill();
    if (isSel) { c.setLineDash([4, 3]); c.strokeStyle = '#2a78d6'; c.lineWidth = 1;
      c.strokeRect(Math.min(x, x2) - 6, Math.min(y, y2) - 6, Math.abs(x2 - x) + 12, Math.abs(y2 - y) + 12); }
  }
  c.restore();
}
function draw() { if (img) paint(ctx, view, true); }

/* ---- 집기 ---- */
function markBox(m) {
  if (m.kind === 'text') {
    const w = (m.text || '').length * m.font * 0.6, h = m.font * 1.25;
    return { x: m.x, y: m.y, w, h };
  }
  return { x: Math.min(m.x, m.x2), y: Math.min(m.y, m.y2), w: Math.abs(m.x2 - m.x), h: Math.abs(m.y2 - m.y) };
}
function hitTest(px, py) {
  /* 나중에 그린 것이 위에 있으므로 뒤에서부터 본다 */
  for (let i = marks.length - 1; i >= 0; i--) {
    const b = markBox(marks[i]), pad = 6;
    if (px >= b.x - pad && px <= b.x + b.w + pad && py >= b.y - pad && py <= b.y + b.h + pad) return i;
  }
  return -1;
}

/* ---- 목록 ---- */
function renderMarks() {
  const box = document.getElementById('markList');
  box.innerHTML = '';
  marks.forEach((m, i) => {
    const name = m.kind === 'text' ? (m.text || '') : `${Math.round(Math.abs(m.x2 - m.x))} × ${Math.round(Math.abs(m.y2 - m.y))}`;
    const row = document.createElement('div');
    row.className = 'mark-row' + (i === sel ? ' sel' : '');
    const btn = document.createElement('button');
    btn.className = 'small ghost mname';
    btn.textContent = name || t('mark.' + m.kind);
    btn.setAttribute('aria-label', `${t('mark.' + m.kind)} ${i + 1}: ${name}`);
    btn.onclick = () => { sel = i; syncStyleInputs(); draw(); renderMarks(); };
    const kind = document.createElement('span');
    kind.className = 'mkind'; kind.textContent = t('mark.' + m.kind);
    const del = document.createElement('button');
    del.className = 'small danger'; del.textContent = '×';
    del.setAttribute('aria-label', `${t('btn.deleteMark')}: ${t('mark.' + m.kind)} ${i + 1}`);
    del.onclick = () => { snapshot(); marks.splice(i, 1); if (sel >= marks.length) sel = -1; draw(); renderMarks(); syncInfo(); };
    row.append(kind, btn, del);
    box.append(row);
  });
  syncInfo();
}

/* ---- 마우스 ---- */
let drag = null;
stage.addEventListener('pointerdown', e => {
  if (!img) return;
  const r = stage.getBoundingClientRect();
  const px = (e.clientX - r.left) / view, py = (e.clientY - r.top) / view;
  const hit = hitTest(px, py);
  if (hit >= 0 && (hit === sel || tool === 'move')) {   // 고른 것을 다시 누르면 이동
    sel = hit; snapshot();
    drag = { mode: 'move', px, py, orig: { ...marks[hit] } };
    stage.classList.add('move');
    stage.setPointerCapture(e.pointerId);
    return;
  }
  if (hit >= 0) { sel = hit; syncStyleInputs(); draw(); renderMarks(); return; }   // 첫 클릭은 고르기만
  if (tool === 'text') {
    const txt = prompt(t('prompt.text'), '');
    if (!txt) return;
    snapshot();
    marks.push({ kind: 'text', x: px, y: py, text: txt, color: colorVal(), width: widthVal(), font: fontVal(), bg: bgVal() });
    sel = marks.length - 1;
    draw(); renderMarks(); return;
  }
  snapshot();
  marks.push({ kind: tool, x: px, y: py, x2: px, y2: py, color: colorVal(), width: widthVal(), font: fontVal() });
  sel = marks.length - 1;
  drag = { mode: 'draw' };
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove', e => {
  if (!drag || !img) return;
  const r = stage.getBoundingClientRect();
  const px = (e.clientX - r.left) / view, py = (e.clientY - r.top) / view;
  const m = marks[sel];
  if (!m) return;
  if (drag.mode === 'draw') { m.x2 = px; m.y2 = py; }
  else {
    const dx = px - drag.px, dy = py - drag.py;
    m.x = drag.orig.x + dx; m.y = drag.orig.y + dy;
    if (drag.orig.x2 !== undefined) { m.x2 = drag.orig.x2 + dx; m.y2 = drag.orig.y2 + dy; }
  }
  draw();
});
const endDrag = () => { if (!drag) return; drag = null; stage.classList.remove('move'); renderMarks(); };
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);

const colorVal = () => document.getElementById('inpColor').value;
const widthVal = () => Number(document.getElementById('inpWidth').value) || 3;
const fontVal = () => Number(document.getElementById('inpFont').value) || 22;
const bgVal = () => document.getElementById('inpBg').checked;
/* 스타일 입력은 **고른 마크가 있으면 그것을** 바꾼다 — 없으면 다음에 그릴 것의 기본값 */
for (const [id, key] of [['inpColor', 'color'], ['inpWidth', 'width'], ['inpFont', 'font']]) {
  document.getElementById(id).addEventListener('input', e => {
    if (sel >= 0 && marks[sel]) {
      marks[sel][key] = key === 'color' ? e.target.value : Number(e.target.value) || marks[sel][key];
      draw();
    }
  });
}
/* 배경은 텍스트에만 뜻이 있다 — 다른 마크를 고른 채로 눌러도 아무 일이 없어야 한다(조용히 필드만 남기지 않는다) */
document.getElementById('inpBg').addEventListener('change', e => {
  if (sel >= 0 && marks[sel] && marks[sel].kind === 'text') { marks[sel].bg = e.target.checked; draw(); }
});
/* 마크를 고르면 그 마크의 스타일을 입력에 되비춘다 — 안 그러면 입력이 고른 것과 어긋나 보인다 */
function syncStyleInputs() {
  const m = sel >= 0 ? marks[sel] : null;
  if (!m) return;
  document.getElementById('inpColor').value = m.color;
  document.getElementById('inpWidth').value = String(m.width);
  document.getElementById('inpFont').value = String(m.font);
  if (m.kind === 'text') document.getElementById('inpBg').checked = m.bg !== false;
}

/* ---- 도구 ---- */
document.querySelectorAll('.tool').forEach(b => b.addEventListener('click', () => {
  tool = b.dataset.tool;
  document.querySelectorAll('.tool').forEach(x => x.classList.toggle('on', x === b));
}));

/* ---- 되돌리기·삭제 ---- */
function undo() {
  if (!undoStack.length) { showToast(t('toast.undoNone')); return; }
  marks = JSON.parse(undoStack.pop());
  if (sel >= marks.length) sel = -1;
  draw(); renderMarks();
}
document.getElementById('btnUndo').addEventListener('click', undo);
document.getElementById('btnDelete').addEventListener('click', () => {
  if (sel < 0 || !marks[sel]) { showToast(t('toast.selectNone')); return; }
  snapshot(); marks.splice(sel, 1); sel = -1; draw(); renderMarks();
});
document.addEventListener('keydown', e => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName || ''))) return;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
  if ((e.key === 'Delete' || e.key === 'Backspace') && sel >= 0) {
    e.preventDefault(); snapshot(); marks.splice(sel, 1); sel = -1; draw(); renderMarks();
  }
});

/* ---- 입력 ---- */
function loadFile(file) {
  if (!file || !/^image\//.test(file.type)) { showToast(t('toast.notImage')); return; }
  /* 새 이미지는 마크를 전부 지운다 — 되돌리기도 안 되므로 물어보고 한다.
     실수로 창에 그림 하나 떨어뜨렸다고 30분치 주석이 사라지면 안 된다. */
  if (marks.length && !confirm(tf('confirm.replace', { n: marks.length }))) return;
  const url = URL.createObjectURL(file);
  const im = new Image();
  im.onload = () => { setImage(im); URL.revokeObjectURL(url); };
  im.src = url;
}
const dz = document.getElementById('dropzone');
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drag'));
dz.addEventListener('drop', e => {
  e.preventDefault(); dz.classList.remove('drag');
  loadFile(e.dataTransfer.files && e.dataTransfer.files[0]);
});
document.getElementById('btnOpen').addEventListener('click', () => document.getElementById('fileInput').click());
document.getElementById('fileInput').addEventListener('change', e => { loadFile(e.target.files[0]); e.target.value = ''; });
/* 붙여넣기가 이 도구의 주 입구다 — 스크린샷은 파일로 저장하지 않고 클립보드에 있는 경우가 대부분이다 */
document.addEventListener('paste', e => {
  const items = (e.clipboardData && e.clipboardData.items) || [];
  for (const it of items) {
    if (it.type && it.type.startsWith('image/')) {
      loadFile(it.getAsFile());
      showToast(t('toast.pasted'));
      return;
    }
  }
});

/* ---- 내보내기 ----
   화면 배율이 아니라 **원본 해상도 × 저장 배율**로 다시 그린다 — 화면에서 축소해 보고 있었다고
   저장본까지 작아지면 안 된다. 선택 표시는 저장본에 들어가지 않는다. */
document.getElementById('btnExport').addEventListener('click', () => {
  if (!img) { showToast(t('toast.needImage')); return; }
  const s = Number(document.getElementById('selScale').value) || 1;
  const out = document.createElement('canvas');
  out.width = Math.round(img.naturalWidth * s);
  out.height = Math.round(img.naturalHeight * s);
  paint(out.getContext('2d'), s, false);
  out.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'annotated.png';
    a.click();
    URL.revokeObjectURL(a.href);
    showToast(t('toast.exported'));
  }, 'image/png');
});

/* ---- 토글 ---- */
document.getElementById('btnTheme').addEventListener('click', () => {
  const dark = THEME === 'dark' || (THEME === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  THEME = dark ? 'light' : 'dark';
  localStorage.setItem(THEME_KEY, THEME);
  applyTheme();
});
document.getElementById('btnLang').addEventListener('click', () => {
  LANG = LANG === 'ko' ? 'en' : 'ko';
  localStorage.setItem(LANG_KEY, LANG);
  applyLang();
});
window.addEventListener('resize', () => { if (img) { fitView(); draw(); } });

/* ================= init ================= */
document.getElementById('appVersion').textContent = APP_VERSION;
document.querySelector('.footer-ver').textContent = APP_VERSION;
applyLang();
applyTheme();
</script>
</body>
</html>
